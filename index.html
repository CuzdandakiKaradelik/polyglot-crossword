<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Studio - Nirvana Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #070a13; }
        .smooth { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen text-slate-100 antialiased tracking-tight"
      x-data="{
        selectedLang: 'en-US',
        customText: 'The beautiful thing about learning is that nobody can take it away from you.',
        speechRate: 1.0,
        shadowMode: false,
        liveEcho: false, // 1. Yeni Özellik: Canlı Ses Geri Bildirimi

        // Analiz ve Metrik State'leri
        recognition: null,
        spokenText: '',
        evaluatedWords: [],
        isListening: false,
        
        // Akıcılık Metrikleri (2. Yeni Özellik)
        wpmScore: 0,
        fluencyStatus: 'Analiz bekleniyor...',
        startTime: null,

        // Ses Altyapısı
        mediaRecorder: null,
        audioChunks: [],
        audioUrl: null,
        isRecording: false,
        localStream: null,
        audioContext: null,
        feedbackNode: null,

        init() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                this.recognition = new SpeechRecognition();
                this.recognition.continuous = true;
                this.recognition.interimResults = false;
                
                this.recognition.onresult = (event) => {
                    let resultText = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) resultText += event.results[i][0].transcript;
                    }
                    this.spokenText = resultText.trim();
                    this.calculateMetrics();
                };
                this.recognition.onend = () => { this.isListening = false; };
            }
        },

        // Gelişmiş Telaffuz ve WPM Hız Hesaplama Algoritması
        calculateMetrics() {
            // 1. Kelime Doğruluk Analizi
            let originalWords = this.customText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,'').split(' ');
            let spokenWords = this.spokenText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,'').split(' ');
            
            this.evaluatedWords = originalWords.map(word => {
                return { text: word, correct: spokenWords.includes(word) };
            });

            // 2. WPM (Hız) ve Akıcılık Skoru Hesaplama
            if (this.startTime) {
                let endTime = Date.now();
                let durationInSeconds = (endTime - this.startTime) / 1000;
                let durationInMinutes = durationInSeconds / 60;
                let wordCount = spokenWords.length;

                this.wpmScore = Math.round(wordCount / durationInMinutes);

                if (this.wpmScore >= 110 && this.wpmScore <= 150) {
                    this.fluencyStatus = 'Mükemmel! Tam bir Native (Doğal Konuşmacı) temposu. 🔥';
                } else if (this.wpmScore < 110) {
                    this.fluencyStatus = 'Biraz yavaş kaldınız. Kelimeleri daha akıcı bağlamayı deneyin. ⏱️';
                } else {
                    this.fluencyStatus = 'Çok hızlı gidiyorsunuz! Anlaşılırlık için sakinleşin. 🏎️';
                }
            }
        },

        playNative() {
            if(!this.customText.trim()) return;
            window.speechSynthesis.cancel();
            
            let utterance = new SpeechSynthesisUtterance(this.customText);
            let voices = window.speechSynthesis.getVoices();
            let premiumVoice = voices.find(v => v.lang === this.selectedLang && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Microsoft')));
            
            if (premiumVoice) utterance.voice = premiumVoice;
            else utterance.lang = this.selectedLang;
            
            utterance.rate = this.speechRate;

            if (this.shadowMode) {
                setTimeout(() => { this.startSession(); }, 1200);
            }

            window.speechSynthesis.speak(utterance);
        },

        // OTURUM YÖNETİMİ (KAYIT + CANLI GERİ BİLDİRİM + ANALİZ)
        async startSession() {
            this.audioChunks = [];
            this.audioUrl = null;
            this.spokenText = '';
            this.evaluatedWords = [];
            this.wpmScore = 0;
            this.startTime = Date.now(); // Zamanı başlat
            
            try {
                this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // CANLI SES GERİ BİLDİRİMİ (Ghost Echo)
                if (this.liveEcho) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    let source = this.audioContext.createMediaStreamSource(this.localStream);
                    this.feedbackNode = this.audioContext.createGain();
                    this.feedbackNode.gain.value = 0.8; // Aşırı patlamayı önlemek için ses seviyesi
                    source.connect(this.feedbackNode);
                    this.feedbackNode.connect(this.audioContext.destination); // Sesi doğrudan kulaklığa basar
                }

                this.mediaRecorder = new MediaRecorder(this.localStream);
                this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
                this.mediaRecorder.onstop = () => {
                    let audioBlob = new Blob(this.audioChunks, { type: 'audio/mp3' });
                    this.audioUrl = URL.createObjectURL(audioBlob);
                };
                this.mediaRecorder.start();
                this.isRecording = true;
            } catch(e) { alert('Mikrofon başlatılamadı.'); }

            if (this.recognition) {
                this.recognition.lang = this.selectedLang;
                this.recognition.start();
                this.isListening = true;
            }
        },

        stopSession() {
            if (this.mediaRecorder && this.isRecording) {
                this.mediaRecorder.stop();
                this.isRecording = false;
            }
            if (this.recognition && this.isListening) {
                this.recognition.stop();
                this.isListening = false;
            }
            // Canlı ekoyu kapat ve sistemi temizle
            if (this.localStream) {
                this.localStream.getTracks().forEach(track => track.stop());
            }
            if (this.audioContext) {
                this.audioContext.close();
            }
        }
      }">

    <header class="w-full border-b border-slate-800 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto h-16 flex items-center justify-between px-6">
            <span class="text-xs font-black tracking-widest bg-gradient-to-r from-teal-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">POLYGLOT ENGINE // NIRVANA</span>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                <span class="text-[10px] font-mono text-teal-400 uppercase">Live Feedback Engine Active</span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto pt-10 px-4 pb-32 space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Kusursuz Dil Laboratuvarı</h1>
            <p class="text-sm text-slate-400">Canlı kulaklık geri bildirimi ve akıcılık radarına sahip tek açık kaynaklı proje.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800/80 rounded-3xl p-6 shadow-2xl space-y-6">
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Hedef Dil</label>
                    <select x-model="selectedLang" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 smooth">
                        <option value="en-US">İngilizce (US)</option>
                        <option value="de-DE">Almanca (DE)</option>
                        <option value="fr-FR">Fransızca (FR)</option>
                        <option value="es-ES">İspanyolca (ES)</option>
                    </select>
                </div>

                <button @click="shadowMode = !shadowMode" :class="shadowMode ? 'bg-indigo-600/20 text-indigo-400 border-indigo-500/40' : 'bg-slate-950/40 text-slate-500 border-slate-800'" class="border p-3 rounded-xl flex flex-col justify-center items-start smooth text-left cursor-pointer">
                    <span class="text-xs font-bold">Gecikmeli Shadowing</span>
                    <span class="text-[9px] text-slate-400 mt-0.5" x-text="shadowMode ? 'Aktif: Sesin arkasından gelin' : 'Kapalı'"></span>
                </button>

                <button @click="liveEcho = !liveEcho" :class="liveEcho ? 'bg-teal-600/20 text-teal-400 border-teal-500/40' : 'bg-slate-950/40 text-slate-500 border-slate-800'" class="border p-3 rounded-xl flex flex-col justify-center items-start smooth text-left cursor-pointer">
                    <span class="text-xs font-bold">Ghost Echo (Canlı Ses)</span>
                    <span class="text-[9px] text-slate-400 mt-0.5" x-text="liveEcho ? 'Aktif: Kendi sesinizi duyun' : 'Kapalı (Kulaklık önerilir)'"></span>
                </button>
            </div>

            <div class="space-y-1">
                <textarea x-model="customText" rows="3" class="w-full bg-slate-800/30 border border-slate-700 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-indigo-500 smooth resize-none"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2 bg-slate-950/60 border border-slate-800 p-4 rounded-xl space-y-2">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">Kelime Doğruluk Analizi</span>
                    <div class="flex flex-wrap gap-1.5 pt-1">
                        <template x-for="word in evaluatedWords">
                            <span :class="word.correct ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'" class="px-2 py-0.5 rounded border text-xs" x-text="word.text"></span>
                        </template>
                        <template x-if="evaluatedWords.length === 0">
                            <span class="text-xs text-slate-600 italic">Konuşma analizi bekleniyor...</span>
                        </template>
                    </div>
                </div>

                <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">Akıcılık Radarı</span>
                        <div class="flex items-baseline gap-1 mt-2">
                            <span class="text-2xl font-black text-teal-400" x-text="wpmScore"></span>
                            <span class="text-[10px] text-slate-500 font-bold">WPM</span>
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-400 leading-tight mt-2" x-text="fluencyStatus"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button @click="playNative()" class="py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold rounded-xl text-xs smooth cursor-pointer shadow-lg shadow-indigo-600/20">
                    🔊 Orijinal Sesi Başlat
                </button>
                
                <button @click="isRecording ? stopSession() : startSession()" 
                        :class="isRecording ? 'bg-rose-600 animate-pulse text-white shadow-lg shadow-rose-600/20' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'"
                        class="py-3.5 font-bold rounded-xl text-xs smooth cursor-pointer">
                    <span x-text="isRecording ? '■ Pratiği ve Analizi Bitir' : '🎤 Kendini Dene & Canlı Dinle'"></span>
                </button>
            </div>

        </div>

    </main>
</body>
</html>
