<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot's Atlas - Kişisel Dil Sözlüğü</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🌐 Polyglot's Atlas</h1>
            <p>Çok dilli kelime dağarcığınızı yönetin ve diller arası bağ kurun.</p>
        </header>

        <section class="form-section">
            <h2>✨ Yeni Kelime Karşılaştırması Ekle</h2>
            <form id="word-form">
                <div class="form-group">
                    <label for="base-word">Ana Kelime (Türkçe/Ortak Dil):</label>
                    <input type="text" id="base-word" placeholder="Örn: Gece" required>
                </div>
                
                <div class="languages-grid">
                    <div class="form-group">
                        <label for="lang-1">1. Hedef Dil & Kelime:</label>
                        <input type="text" id="lang-1" placeholder="Örn: İngilizce - Night" required>
                    </div>
                    <div class="form-group">
                        <label for="lang-2">2. Hedef Dil & Kelime (Opsiyonel):</label>
                        <input type="text" id="lang-2" placeholder="Örn: İspanyolca - Noche">
                    </div>
                    <div class="form-group">
                        <label for="lang-3">3. Hedef Dil & Kelime (Opsiyonel):</label>
                        <input type="text" id="lang-3" placeholder="Örn: İtalyanca - Notte">
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="is-false-friend">
                    <label for="is-false-friend" class="warning-label">⚠️ Bu kelime bir "Yalancı Eşdeğer" (False Friend) - Karışabilir!</label>
                </div>

                <button type="submit" class="btn-submit">Atlasa Ekle</button>
            </form>
        </section>

        <section class="filter-section">
            <input type="text" id="search-bar" placeholder="Kelimelerde ara...">
            <button id="btn-filter-all" class="btn-filter active">Hepsini Göster</button>
            <button id="btn-filter-warning" class="btn-filter">Sadece Riskli Kelimeler (False Friends)</button>
        </section>

        <section class="list-section">
            <h2>📚 Kelime Atlasınız</h2>
            <div id="words-container" class="words-grid">
                </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
