<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>

           TEMA TANIMLAMALARI (10 Özgün Gazete/Baskı Teması)
           ========================================================================== */
        :root { --bg: #2b2b2b; --page: #ffffff; --grid: #bcbfc2; --text: #1a1a1a; --hint: #fbc02d; --btn: #1f3a52; --accent: #777; }

        .theme-1 { --bg: #1c1c1c; --page: #f4edd2; --grid: #cfc4a2; --text: #3d2b1f; --hint: #d4af37; --btn: #5c4033; --accent: #8b7355; } 
        .theme-2 { --bg: #0f172a; --page: #1e293b; --grid: #475569; --text: #f8fafc; --hint: #38bdf8; --btn: #0ea5e9; --accent: #94a3b8; } 
        .theme-3 { --bg: #2d3748; --page: #edf2f7; --grid: #cbd5e0; --text: #2d3748; --hint: #ed8936; --btn: #2b6cb0; --accent: #4a5568; } 
        .theme-4 { --bg: #741b47; --page: #fff2cc; --grid: #e6b8af; --text: #4c1130; --hint: #f1c232; --btn: #a64d79; --accent: #741b47; } 
        .theme-5 { --bg: #1e3f20; --page: #f1f8f5; --grid: #c2d6cc; --text: #0f2912; --hint: #81c784; --btn: #2e7d32; --accent: #4caf50; } 
        .theme-6 { --bg: #3a3a3a; --page: #e5e5e5; --grid: #b5b5b5; --text: #111111; --hint: #ff5722; --btn: #e64a19; --accent: #616161; } 
        .theme-7 { --bg: #4a148c; --page: #f3e5f5; --grid: #d1c4e9; --text: #311b92; --hint: #ffb74d; --btn: #6a1b9a; --accent: #7e57c2; } 
        .theme-8 { --bg: #004d40; --page: #e0f2f1; --grid: #b2dfdb; --text: #004d40; --hint: #ffb300; --btn: #00695c; --accent: #4db6ac; } 
        .theme-9 { --bg: #5d4037; --page: #efebe9; --grid: #d7ccc8; --text: #3e2723; --hint: #d4a373; --btn: #4e342e; --accent: #8d6e63; } 

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .paper-container {
            background-color: var(--page);
            width: 100%;
            max-width: 850px;
            border: 4px double var(--text);
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 5px 0;
        }

        .sub-header {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .timer-bar {
            background-color: var(--grid);
            opacity: 0.9;
            color: var(--text);
            text-align: center;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 2px solid var(--text);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        select {
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            padding: 4px;
            border: 1px solid var(--accent);
            background: var(--page);
            color: var(--text);
        }

        .action-buttons {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 14px;
            border: 1px solid var(--text);
            cursor: pointer;
            border-radius: 3px;
            transition: transform 0.1s ease;
        }

        .btn:active { transform: scale(0.95); }
        .btn-new { background-color: var(--btn); color: white; }
        .btn-hint { background-color: var(--hint); color: black; }

        .workspace-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 700px) {
            .workspace-layout { grid-template-columns: 1fr; }
        }

        .matrix-section {
            background-color: var(--grid);
            border: 1px solid var(--accent);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
            overflow: auto;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--accent);
            padding: 1px;
        }

        .cell {
            background-color: transparent;
            position: relative;
            width: 34px;
            height: 34px;
        }

        .cell.active { background-color: var(--page); }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
            background: transparent;
            color: var(--text);
            position: relative;
            z-index: 5; /* Sayıların üstüne basabilmesi için z-index artırıldı */
        }

        .cell input:focus { background-color: var(--hint); color: #000; outline: none; }
        .cell-num { position: absolute; top: 1px; left: 2px; font-size: 8px; font-weight: bold; color: var(--text); opacity: 0.8; z-index: 1; pointer-events: none; }

        .corpus-section { display: flex; flex-direction: column; gap: 15px; }
        .corpus-section h2 { font-family: 'Playfair Display', serif; font-size: 18px; margin: 0 0 5px 0; border-bottom: 1px solid var(--text); padding-bottom: 3px; }
        .clue-block h3 { margin: 0 0 8px 0; font-size: 10px; text-transform: uppercase; background: var(--text); color: var(--page); padding: 2px 6px; display: inline-block; }
        .clue-item { font-size: 11px; line-height: 1.4; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px dotted var(--accent); cursor: pointer; }

        .corpus-index-wrapper { margin-top: 20px; border-top: 2px dashed var(--text); padding-top: 15px; display: none; }
        .corpus-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        .corpus-table th, .corpus-table td { border: 1px solid var(--accent); padding: 6px; text-align: left; }
        .corpus-table th { background-color: var(--grid); }
    </style>
</head>

</div>

            ]
        ],
        fr: [
            [
                {w:"PRIX", c:'"Le long-métrage a remporté le Grand ____ du Jury lors du festival."'}, 
                {w:"VOLEUR", c:'"Cobb, le personnage central d\'Inception, est un ____ de secrets industriels."'}, 
                {w:"SALLE", c:'"Les spectateurs éteignent leurs téléphones dès que la ____ de cinéma s\'assombrit."'}, 
                {w:"ESPACE", c:'"Le chef-d\'œuvre Interstellar raconte un voyage épique à travers l\'____ et le temps."'}, 
                {w:"HEROS", c:'"Dans ce film d\'action, le ____ parvient à sauver la ville in extremis."'}
            ],
            [
                {w:"TEXTE", c:'"Le réalisateur a demandé aux comédiens de respecter scrupuleusement le ____ des répliques."'}, 
                {w:"ECRAN", c:'"Ce film de science-fiction a été conçu spécifiquement pour être projeté sur grand ____."'}, 
                {w:"IMAGE", c:'"Le directeur de la photographie a fait un travail exceptionnel sur la gestion de l\'____."'},

    let matrixSize = 12;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let currentFocusCell = null;
    let activeDirection = "across";

    function applyTheme() {
        const themeIdx = document.getElementById('themeSelect').value;
        document.getElementById('body-root').className = `theme-${themeIdx}`;
    }

    function safeUpperCase(str, lang) {
        if (!str) return "";
        if (lang === 'tr') {
            return str.replace(/i/g, 'İ').replace(/ı/g, 'I').toUpperCase();
        }
        return str.toUpperCase();
    }

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const pack = TRANSLATIONS[lang];

        if (!pack) return;

        document.getElementById('ui-title').innerText = pack.title;
        document.getElementById('ui-edition').innerText = pack.edition;
        document.getElementById('ui-timer').innerText = pack.timer;
        document.getElementById('lbl-lang').innerText = pack.lang;
        document.getElementById('lbl-theme').innerText = pack.theme;
        document.getElementById('btn-new').innerText = pack.btnNew;
        document.getElementById('btn-hint').innerText = pack.btnHint;
        document.getElementById('ui-clues-title').innerText = pack.clues;
        document.getElementById('ui-across').innerText = pack.across;
        document.getElementById('ui-down').innerText = pack.down;
        document.getElementById('ui-success').innerText = pack.success;
        document.getElementById('th-word').innerText = pack.thWord;
        document.getElementById('th-note').innerText = pack.thNote;

        buildCrosswordMatrix();
    }

    function toggleMatrixVersion() {
        const selectElement = document.getElementById('matrixVersion');
        if (!selectElement) return;
        selectElement.value = (parseInt(selectElement.value) === 0) ? "1" : "0";
        buildCrosswordMatrix();
    }

    function buildCrosswordMatrix() {
        const indexArea = document.getElementById('corpus-index-area');
        if (indexArea) indexArea.style.display = 'none';
        
        const lang = document.getElementById('langSelect').value;
        const version = parseInt(document.getElementById('matrixVersion').value);
        const subset = LEXICON_DATABASE[lang][version];

        if (!subset) return;

        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        activeWords = [];

        // Kelime 1
        let w1 = subset[0]; let r1 = 4, c1 = 2;
        for(let i = 0; i < w1.w.length; i++) {
            localMatrix[r1][c1 + i] = { letter: w1.w[i], isStart: i === 0, num: 1, dir: "across" };
        }
        activeWords.push({ w: w1.w, c: w1.c, row: r1, col: c1, dir: "across", num: 1 });

        // Kelime 2
        let w2 = subset[1]; let r2 = 1, c2 = 4;
        for(let i = 0; i < w2.w.length; i++) {
            if(!localMatrix[r2 + i][c2]) {
                localMatrix[r2 + i][c2] = { letter: w2.w[i], isStart: i === 0, num: 2, dir: "down" };
            } else {
                if(i === 0) localMatrix[r2 + i][c2].num = 2;
                localMatrix[r2 + i][c2].altDir = "down";
            }
        }
        activeWords.push({ w: w2.w, c: w2.c, row: r2, col: c2, dir: "down", num: 2 });

        // Kelime 3
        let w3 = subset[2]; let r3 = 6, c3 = 1;
        for(let i = 0; i < w3.w.length; i++) {
            if(!localMatrix[r3][c3 + i]) {
                localMatrix[r3][c3 + i] = { letter: w3.w[i], isStart: i === 0, num: 3, dir: "across" };
            } else {
                if(i === 0) localMatrix[r3][c3 + i].num = 3;
                localMatrix[r3][c3 + i].altDir = "across";
            }
        }
        activeWords.push({ w: w3.w, c: w3.c, row: r3, col: c3, dir: "across", num: 3 });

        // Kelime 4
        let w4 = subset[3]; let r4 = 2, c4 = 7;
        for(let i = 0; i < w4.w.length; i++) {
            if(!localMatrix[r4 + i][c4]) {
                localMatrix[r4 + i][c4] = { letter: w4.w[i], isStart: i === 0, num: 4, dir: "down" };
            } else {
                if(i === 0) localMatrix[r4 + i][c4].num = 4;
                localMatrix[r4 + i][c4].altDir = "down";
            }
        }
        activeWords.push({ w: w4.w, c: w4.c, row: r4, col: c4, dir: "down", num: 4 });

        // Kelime 5
        let w5 = subset[4]; let r5 = 5, c5 = 6;
        for(let i = 0; i < w5.w.length; i++) {
            if(!localMatrix[r5][c5 + i]) {
                localMatrix[r5][c5 + i] = { letter: w5.w[i], isStart: i === 0, num: 5, dir: "across" };
            } else {
                if(i === 0) localMatrix[r5][c5 + i].num = 5;
                localMatrix[r5][c5 + i].altDir = "across";
            }
        }
        activeWords.push({ w: w5.w, c: w5.c, row: r5, col: c5, dir: "across", num: 5 });

        renderVisualGrid(localMatrix);
        renderLinguisticClues();
    }

    function renderVisualGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        if (!container) return;

        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 34px)`;
        inputElements = {};
        currentFocusCell = null;

        for(let r = 0; r < matrixSize; r++) {
            for(let c = 0; c < matrixSize; c++) {
                const cell = matrixData[r][c];
                const div = document.createElement('div');
                
                if(cell) {
                    div.className = 'cell active';
                    if(cell.num) {
                        let ns = document.createElement('span');
                        ns.className = 'cell-num';
                        ns.innerText = cell.num;
                        div.appendChild(ns);
                    }
                    
                    let inp = document.createElement('input');
                    inp.type = 'text';
                    inp.maxLength = 1;
                    inp.setAttribute('autocomplete', 'off');
                    inp.setAttribute('spellcheck', 'false');
                    
                    inp.addEventListener('input', (e) => {
                        const currentLang = document.getElementById('langSelect').value;
                        e.target.value = safeUpperCase(e.target.value, currentLang);
                        checkGridState();
                        
                        if(e.target.value.length === 1) {
                            let dir = (cell.altDir && activeDirection === cell.altDir) ? cell.altDir : cell.dir;
                            let nextR = dir === "down" ? r + 1 : r;
                            let nextC = dir === "down" ? c : c + 1;
                            let nextInp = inputElements[`${nextR}-${nextC}`];
                            if(nextInp) nextInp.focus();
                        }
                    });

                    inp.addEventListener('keydown', (e) => {
                        let dir = (cell.altDir && activeDirection === cell.altDir) ? cell.altDir : cell.dir;
                        
                        if (e.key === 'Backspace') {
                            if (e.target.value === '') {
                                let prevR = dir === "down" ? r - 1 : r;
                                let prevC = dir === "down" ? c - 1 : c;
                                let prevInp = inputElements[`${prevR}-${prevC}`];
                                if (prevInp) {
                                    prevInp.focus();
                                    prevInp.value = '';
                                    checkGridState();
                                    e.preventDefault();
                                }
                            } else {
                                e.target.value = '';
                                checkGridState();
                                e.preventDefault();
                            }
                        }
                        
                        if (e.key === 'ArrowRight') {
                            let target = inputElements[`${r}-${c + 1}`];
                            if (target) { activeDirection = "across"; target.focus(); }
                        }
                        if (e.key === 'ArrowLeft') {
                            let target = inputElements[`${r}-${c - 1}`];
                            if (target) { activeDirection = "across"; target.focus(); }
                        }
                        if (e.key === 'ArrowDown') {
                            let target = inputElements[`${r + 1}-${c}`];
                            if (target) { activeDirection = "down"; target.focus(); }
                        }
                        if (e.key === 'ArrowUp') {
                            let target = inputElements[`${r - 1}-${c}`];
                            if (target) { activeDirection = "down"; target.focus(); }
                        }
                    });
                    
                    inp.addEventListener('focus', () => { 
                        currentFocusCell = { row: r, col: c, element: inp }; 
                    });

                    inputElements[`${r}-${c}`] = inp;
                    div.appendChild(inp);
                } else {
                    div.className = 'cell';
                }
                container.appendChild(div);
            }
        }
    }

    function renderLinguisticClues() {
        const acrossBox = document.getElementById('across-clues');
        const downBox = document.getElementById('down-clues');
        
        if (!acrossBox || !downBox) return;
        
        acrossBox.innerHTML = '';
        downBox.innerHTML = '';

        activeWords.forEach(item => {
            let div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `<div><strong>${item.num}</strong> ${item.c}</div>`;
            
            div.addEventListener('click', () => {
                let startInp = inputElements[`${item.row}-${item.col}`];
                if (startInp) {
                    activeDirection = item.dir;
                    startInp.focus();
                }
            });

            if(item.dir === "across") acrossBox.appendChild(div);
            else downBox.appendChild(div);
        });
    }

    function giveLetterHint() {
        if(currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            const cellData = gridMatrix[currentFocusCell.row][currentFocusCell.col];
            currentFocusCell.element.value = cellData.letter;
            currentFocusCell.element.focus();
            checkGridState();
        }
    }

    function checkGridState() {
        let accurate = true;
        let cellsTested = 0;

        for(let r = 0; r < matrixSize; r++) {
            for(let c = 0; c < matrixSize; c++) {
                if(gridMatrix[r][c]) {
                    cellsTested++;
                    const inp = inputElements[`${r}-${c}`];
                    if(!inp || inp.value !== gridMatrix[r][c].letter) {
                        accurate = false;
                    }
                }
            }
        }

        const successArea = document.getElementById('corpus-index-area');
        const tbody = document.getElementById('corpus-table-body');

        if(accurate && cellsTested > 0) {
            if (tbody) {
                tbody.innerHTML = '';
                activeWords.forEach(item => {
                    let row = document.createElement('tr');
                    let highlightedQuote = item.c.replace('____', `<strong>${item.w}</strong>`);
                    row.innerHTML = `<td style="font-weight:bold; color:var(--btn);">${item.w}</td><td>${highlightedQuote}</td>`;
                    tbody.appendChild(row);
                });
            }
            if (successArea) successArea.style.display = 'block';
        } else {
            if (successArea) successArea.style.display = 'none';
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        changeLanguage();
    });
</script>
