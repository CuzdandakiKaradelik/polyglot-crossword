<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polyglot Comparative Matrix v15.0</title>
    <style>
        :root {
            --bg-main: #f8f9fa;
            --text-main: #212529;
            --border-color: #ced4da;
            --accent-blue: #004085;
            --cell-size: 42px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }
        
        .concept-badge {
            display: inline-block;
            background: #e2e3e5;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Kontrol Paneli */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #fff;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }
        select, button { width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border-color); background: #fff; outline: none; }
        button.btn-primary { background: var(--text-main); color: #fff; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button.btn-primary:hover { background: #343a40; }

        /* Çalışma Alanı */
        .workspace { display: none; grid-template-columns: 1.2fr 1fr; gap: 20px; }

        @media (max-width: 850px) { .workspace { grid-template-columns: 1fr; } }

        .matrix-holder {
            background: #fff; border: 1px solid var(--border-color); padding: 15px;
            overflow-x: auto; display: flex; justify-content: center; align-items: center;
        }

        .grid { display: grid; gap: 1px; background: var(--border-color); padding: 1px; }
        .cell { width: var(--cell-size); height: var(--cell-size); background: #fff; position: relative; }
        .cell.empty { background: #e9ecef; }

        .cell input {
            width: 100%; height: 100%; border: none; text-align: center;
            font-size: 16px; font-weight: bold; text-transform: uppercase; outline: none;
            padding: 0; background: transparent;
        }
        .cell input:focus { background: #fff3cd; }
        .cell-num { position: absolute; top: 2px; left: 3px; font-size: 9px; color: #6c757d; font-weight: bold; z-index: 2; }

        /* Mobil Optimizasyon */
        @media (max-width: 500px) {
            :root { --cell-size: 7.8vw; }
            .cell input { font-size: 14px; }
        }

        /* İpuçları Paneli */
        .clues-holder { background: #fff; border: 1px solid var(--border-color); padding: 20px; }
        .clue-section h3 { margin-top: 0; border-bottom: 1px solid var(--text-main); padding-bottom: 5px; font-size: 16px; }
        .clue-list { list-style: none; padding: 0; margin-bottom: 20px; }
        .clue-item { font-size: 13px; margin-bottom: 12px; line-height: 1.4; padding-bottom: 6px; border-bottom: 1px dotted var(--border-color); }
        .clue-item strong { background: #e2e3e5; padding: 2px 6px; margin-right: 5px; border-radius: 3px; }

        /* Karşılaştırmalı Dil İndeksi */
        .polyglot-index { margin-top: 20px; background: #fff; border: 1px solid var(--border-color); padding: 20px; display: none; }
        .polyglot-index h2 { margin-top: 0; font-size: 18px; color: #004085; }
        .analysis-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .analysis-table th, .analysis-table td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
        .analysis-table th { background: #f1f3f5; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>POLYGLOT COMPARATIVE MATRIX</h1>
        <div class="concept-badge" id="activeConceptDisplay">KAVRAM KÖPRÜSÜ: YÜKLENİYOR...</div>
    </header>

    <div class="control-panel">
        <div>
            <label>Acquisition Level / Seviye Grubu</label>
            <select id="levelSelect">
                <option value="beginner">A1-A2: Core Concepts (Temel Kavramlar)</option>
                <option value="intermediate">B1-B2: Structural & Abstract (Soyut ve Fonksiyonel)</option>
                <option value="advanced">C1-C2: Intellectual Discourse (Entelektüel Düşünce)</option>
            </select>
        </div>
        <div>
            <label>Sistem Operasyonu</label>
            <button class="btn-primary" onclick="initPolyglotEngine()">Yeni Matris Oluştur</button>
        </div>
    </div>

    <div class="workspace" id="mainWorkspace">
        <div class="matrix-holder">
            <div class="grid" id="lexicalGrid"></div>
        </div>

        <div class="clues-holder">
            <div class="clue-section">
                <h3>Yatay / Across</h3>
                <ul class="clue-list" id="acrossClues"></ul>
            </div>
            <div class="clue-section">
                <h3>Dikey / Down</h3>
                <ul class="clue-list" id="downClues"></ul>
            </div>
        </div>
    </div>

    <div class="polyglot-index" id="analysisPanel">
        <h2>✓ Karşılaştırmalı Polyglot Dil Analizi</h2>
        <table class="analysis-table">
            <thead>
                <tr>
                    <th>Dil</th>
                    <th>Kelime / Kalıp</th>
                    <th>Cümle İçinde Canlı Kullanım Analizi</th>
                </tr>
            </thead>
            <tbody id="analysisRows"></tbody>
        </table>
    </div>
</div>

<script>
    // KAVRAMSAL KÖPRÜLEME VERİTABANI
    // Her set, tek bir evrensel konunun 4 dildeki birebir karşılığıdır.
    const POLYGLOT_SETS = {
        beginner: [
            {
                concept: "ZAMAN / TIME",
                words: [
                    { w: "ALWAYS", lang: "EN (İngilizce)", c: "Daimi süreklilik bildiren temel zarf. | Örnek: 'She always reads before sleeping.'" },
                    { w: "SIEMPRE", lang: "ES (İspanyolca)", c: "Latin kökenli süreklilik zarfı. | Örnek: 'Siempre te recordaré de buena manera.'" },
                    { w: "IMMER", lang: "DE (Almanca)", c: "Cermen kökenli zaman süreklilik kelimesi. | Örnek: 'Es ist immer kalt in diesem Zimmer.'" },
                    { w: "TOUJOURS", lang: "FR (Fransızca)", c: "Fransızca 'her zaman' anlamına gelen yapı. | Örnek: 'Il est toujours en retard.'" }
                ]
            },
            {
                concept: "DOSTLUK / FRIENDSHIP",
                words: [
                    { w: "FRIEND", lang: "EN (İngilizce)", c: "Temel arkadaş, dost kelimesi. | Örnek: 'He is a reliable friend.'" },
                    { w: "AMIGO", lang: "ES (İspanyolca)", c: "Roman dillerindeki en popüler dost kelimesi. | Örnek: 'Un amigo es un hermano elegído.'" },
                    { w: "FREUND", lang: "DE (Almanca)", c: "Cermen yapılı arkadaş/erkek arkadaş kelimesi. | Örnek: 'Mein Freund hilft mir beim Umzug.'" },
                    { w: "AMI", lang: "FR (Fransızca)", c: "Fransızca dost, yoldaş. | Örnek: 'C'est mon meilleur ami depuis l'enfance.'" }
                ]
            }
        ],
        intermediate: [
            {
                concept: "NEDENSELLİK / CAUSE & EFFECT",
                words: [
                    { w: "HOWEVER", lang: "EN (İngilizce)", c: "Fikirleri keskin şekilde ayıran zıtlık bağlacı. | Örnek: 'It was hard; however, we did it.'" },
                    { w: "SIN EMBARGO", lang: "ES (İspanyolca)", c: "İspanyolca en sık kullanılan akıcı zıtlık yapısı. | Örnek: 'No tenía dinero; sin embargo, viajó.'" },
                    { w: "OBWOHL", lang: "DE (Almanca)", c: "Eyleme rağmen durumunu bildiren yan cümle bağlacı. | Örnek: 'Obwohl ich müde bin, lerne ich.'" },
                    { w: "POURTANT", lang: "FR (Fransızca)", c: "Fransızca 'yine de, oysa' anlamındaki güçlü bağlaç. | Örnek: 'Il fait froid, pourtant il se promène.'" }
                ]
            },
            {
                concept: "GELİŞİM / DEVELOPMENT",
                words: [
                    { w: "PROGRESS", lang: "EN (İngilizce)", c: "İlerleme, gelişim katetme durumu. | Örnek: 'The student made great progress.'" },
                    { w: "PROGRESO", lang: "ES (İspanyolca)", c: "İspanyolca gelişim ve ilerleme kavramı. | Örnek: 'El progreso económico es evidente.'" },
                    { w: "FORTSCHRITT", lang: "DE (Almanca)", c: "Almanca ileri adım, teknolojik/bireysel gelişim. | Örnek: 'Wir müssen den Fortschritt akzeptieren.'" },
                    { w: "PROGRES", lang: "FR (Fransızca)", c: "Fransızca gelişim ve medeniyet adımları. | Örnek: 'La science fait des progrès constants.'" }
                ]
            }
        ],
        advanced: [
            {
                concept: "ZAMANIN RUHU / SPIRIT OF THE AGE",
                words: [
                    { w: "ZEITGEIST", lang: "DE (Almanca)", c: "Orijinal Almanca entelektüel dönem tanımı. | Örnek: 'Der Film reflektiert den aktuellen Zeitgeist.'" },
                    { w: "INHERENT", lang: "EN (İngilizce)", c: "Bir nesnenin yapısında kaçınılmaz olarak var olan öz. | Örnek: 'Risks are inherent in every investment.'" },
                    { w: "POR DOQUIER", lang: "ES (İspanyolca)", c: "Her tarafta, her köşede var olma durumu. | Örnek: 'Había arte y poesía por doquier.'" },
                    { w: "PARTOUT", lang: "FR (Fransızca)", c: "Fransızca her yerde, her alanda bulunma durumu. | Örnek: 'Cette tendance se retrouve partout en Europe.'" }
                ]
            }
        ]
    };

    let gSize = 14;
    let activeDataset = [];
    let gridData = [];
    let inputsRef = {};

    function initPolyglotEngine() {
        document.getElementById('analysisPanel').style.display = 'none';
        document.getElementById('mainWorkspace').style.display = 'grid';
        
        const lvl = document.getElementById('levelSelect').value;
        const setsPool = POLYGLOT_SETS[lvl];

        // 1. ADIM: İlgili seviyeden rastgele BİR KAVRAM SETİ seç
        let randomSet = setsPool[Math.floor(Math.random() * setsPool.length)];
        
        // Üst başlıktaki kavram adını güncelle
        document.getElementById('activeConceptDisplay').innerText = `KAVRAM KÖPRÜSÜ: ${randomSet.concept}`;
        
        // Bu konsepte ait 4 dili matris için kopyala
        activeDataset = JSON.parse(JSON.stringify(randomSet.words));

        // Sabit akıllı geometrik yönlendirme (2 Yatay, 2 Dikey kesişim ağı)
        activeDataset[0].dir = "across";
        activeDataset[1].dir = "down";
        activeDataset[2].dir = "across";
        activeDataset[3].dir = "down";

        gridData = Array(gSize).fill(null).map(() => Array(gSize).fill(null));
        inputsRef = {};

        // 2. ADIM: Kelimeleri Matrise Geometrik Olarak Örüp Kilitleme
        // Kelime 1 (Yatay Ana Aks)
        let w1 = activeDataset[0];
        let r1 = 5, c1 = 2;
        for(let i=0; i<w1.w.length; i++) {
            gridData[r1][c1+i] = { letter: w1.w[i], num: i===0 ? 1 : null };
        }
        w1.num = 1;

        // Kelime 2 (Dikey Ana Aks - İlkiyle Kesişir)
        let w2 = activeDataset[1];
        let r2 = 2, c2 = Math.min(gSize - 1, c1 + 3);
        for(let i=0; i<w2.w.length; i++) {
            if(r2+i < gSize) {
                if(!gridData[r2+i][c2]) gridData[r2+i][c2] = { letter: w2.w[i], num: i===0 ? 2 : null };
                else if(i===0) gridData[r2+i][c2].num = 2;
            }
        }
        w2.num = 2;

        // Kelime 3 (Alt Yatay Aks - İkinciyle Kesişir)
        let w3 = activeDataset[2];
        let r3 = Math.min(gSize - 1, r2 + 4), c3 = Math.max(0, c2 - 2);
        for(let i=0; i<w3.w.length; i++) {
            if(c3+i < gSize) {
                if(!gridData[r3][c3+i]) gridData[r3][c3+i] = { letter: w3.w[i], num: i===0 ? 3 : null };
                else if(i===0) gridData[r3][c3+i].num = 3;
            }
        }
        w3.num = 3;

        // Kelime 4 (Son Dikey Aks - Kilitleyici)
        let w4 = activeDataset[3];
        let r4 = Math.max(0, r3 - 2), c4 = Math.min(gSize - 1, c3 + 4);
        for(let i=0; i<w4.w.length; i++) {
            if(r4+i < gSize) {
                if(!gridData[r4+i][c4]) gridData[r4+i][c4] = { letter: w4.w[i], num: i===0 ? 4 : null };
                else if(i===0) gridData[r4+i][c4].num = 4;
            }
        }
        w4.num = 4;

        renderGrid();
        renderClues();
    }

    function renderGrid() {
        const gridEl = document.getElementById('lexicalGrid');
        gridEl.innerHTML = '';
        gridEl.style.gridTemplateColumns = `repeat(${gSize}, var(--cell-size))`;

        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                const node = gridData[r][c];
                const cellDiv = document.createElement('div');

                if(node) {
                    cellDiv.className = 'cell';
                    if(node.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = node.num;
                        cellDiv.appendChild(numSpan);
                    }
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.setAttribute('autocomplete', 'off');
                    input.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                        checkMatrixStatus();
                    });
                    inputsRef[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell empty';
                }
                gridEl.appendChild(cellDiv);
            }
        }
    }

    function renderClues() {
        const acrossUl = document.getElementById('acrossClues');
        const downUl = document.getElementById('downClues');
        acrossUl.innerHTML = '';
        downUl.innerHTML = '';

        activeDataset.forEach(item => {
            const li = document.createElement('li');
            li.className = 'clue-item';
            li.innerHTML = `<strong>${item.num} [${item.lang}]</strong> ${item.c.split('|')[0]}`;
            
            if(item.dir === "across") acrossUl.appendChild(li);
            else downUl.appendChild(li);
        });
    }

    function checkMatrixStatus() {
        let allCorrect = true;
        let filledCount = 0;

        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                if(gridData[r][c]) {
                    filledCount++;
                    const userVal = inputsRef[`${r}-${c}`].value.trim().toUpperCase();
                    if(userVal !== gridData[r][c].letter.toUpperCase()) {
                        allCorrect = false;
                    }
                }
            }
        }

        if(allCorrect && filledCount > 0) {
            showAnalysisPanel();
        }
    }

    function showAnalysisPanel() {
        const rowsEl = document.getElementById('analysisRows');
        rowsEl.innerHTML = '';

        activeDataset.forEach(item => {
            const tr = document.createElement('tr');
            const exampleSentence = item.c.split('|')[1] || "Örnek yüklenemedi.";

            tr.innerHTML = `
                <td style="font-weight:bold; color:var(--accent-blue);">${item.lang}</td>
                <td style="font-weight:bold; text-transform:uppercase;">${item.w}</td>
                <td>${exampleSentence}</td>
            `;
            rowsEl.appendChild(tr);
        });

        document.getElementById('analysisPanel').style.display = 'block';
        document.getElementById('analysisPanel').scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
