<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Polyglot Crossword v2</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f4ebd9;
            color: #2b2b2b;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
        }

        .newspaper-container {
            max-width: 1200px;
            margin: 0 auto;
            border: 2px solid #2b2b2b;
            padding: 20px;
            box-shadow: 5px 5px 0px #2b2b2b;
            background-color: #fbf5eb;
        }

        header {
            text-align: center;
            border-bottom: 4px double #2b2b2b;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #eae0cc;
            padding: 10px;
            border: 1px solid #2b2b2b;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #2b2b2b;
            flex-wrap: wrap;
        }

        .control-panel label {
            font-weight: bold;
            font-size: 14px;
        }

        .control-panel select {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            padding: 5px 10px;
            border: 2px solid #2b2b2b;
            background-color: #fbf5eb;
            cursor: pointer;
        }

        .control-panel button, .btn-action {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 15px;
            border: 2px solid #2b2b2b;
            background-color: #2b2b2b;
            color: #fbf5eb;
            cursor: pointer;
            box-shadow: 2px 2px 0px #888;
        }

        .control-panel button:hover, .btn-action:hover {
            background-color: #444;
        }

        .pool-stats {
            font-size: 12px;
            font-style: italic;
            color: #666;
        }

        .game-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            margin-top: 20px;
        }

        @media (max-width: 950px) {
            .game-layout { flex-direction: column; }
        }

        .puzzle-section {
            flex: 1.3;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2b2b2b; 
            border: 1px solid #2b2b2b;
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            min-height: 500px;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: #2b2b2b;
            border: 2px solid #2b2b2b;
        }

        .cell {
            background-color: #2b2b2b;
            position: relative;
            width: 35px;
            height: 35px;
        }

        .cell.active { background-color: #ffffff; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            background: transparent;
            color: #2b2b2b;
            padding: 0;
            box-sizing: border-box;
        }

        .cell input:focus {
            background-color: #fffacd;
            outline: none;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 9px;
            font-weight: bold;
            color: #2b2b2b;
            z-index: 10;
            line-height: 1;
        }

        .clues-section {
            flex: 1;
            border-left: 1px dashed #2b2b2b;
            padding-left: 20px;
            max-height: 580px;
            overflow-y: auto;
        }

        .clues-section h2 {
            font-family: 'Playfair Display', serif;
            margin-top: 0;
            border-bottom: 2px solid #2b2b2b;
            padding-bottom: 5px;
        }

        .clue-group h3 {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background-color: #2b2b2b;
            color: #fbf5eb;
            padding: 4px 8px;
            display: inline-block;
        }

        .clue-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 13px;
            line-height: 1.5;
            padding: 6px;
            border-bottom: 1px dotted #ccc;
        }

        .clue-text-wrapper { flex: 1; }

        .clue-item strong {
            font-size: 14px;
            background-color: #eae0cc;
            padding: 0 4px;
            margin-right: 5px;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }

        #success-banner {
            display: none;
            background-color: #617a55;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 2px solid #2b2b2b;
            box-shadow: 3px 3px 0px #2b2b2b;
            font-family: 'Playfair Display', serif;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fbf5eb;
            padding: 30px;
            border: 3px solid #2b2b2b;
            max-width: 500px;
            width: 90%;
            box-shadow: 8px 8px 0px #2b2b2b;
            font-family: 'Courier Prime', monospace;
        }
        .modal-content h2 { font-family: 'Playfair Display', serif; margin-top: 0; text-align: center; }
        .deck-list { margin: 20px 0; max-height: 250px; overflow-y: auto; }
        .deck-item { padding: 8px; border-bottom: 1px dashed #2b2b2b; font-size: 14px; }
    </style>
</head>
<body>

<div class="newspaper-container">
    <header>
        <h1>The Polyglot Movie Crossword</h1>
    </header>

    <div class="stats-bar">
        <div>🏆 Skor: <span id="scoreVal">0</span></div>
        <div>🔥 Kombo: x<span id="comboVal">0</span></div>
        <div>⏱️ Kalan Süre: <span id="timerVal">--:--</span></div>
    </div>

    <div class="control-panel">
        <label for="langSelect">Hedef Dil:</label>
        <select id="langSelect" onchange="resetLanguageAndInit()">
            <option value="en">İngilizce (English)</option>
            <option value="es">İspanyolca (Español)</option>
            <option value="de">Almanca (Deutsch)</option>
            <option value="fr">Fransızca (Français)</option>
            <option value="it">İtalyanca (Italiano)</option>
        </select>

        <label for="timerSelect">Süre Modu:</label>
        <select id="timerSelect" onchange="initGame()">
            <option value="off">Süre Kapat</option>
            <option value="3">3 Dakika</option>
            <option value="5">5 Dakika</option>
        </select>
        
        <button onclick="initGame()">🔄 Yeni Bulmaca</button>
        <button onclick="getLetterHint()" style="background-color: #e2b13c; color: #000;">💡 Harf Al (-25 Puan)</button>
        <span class="pool-stats" id="poolStats"></span>
    </div>

    <div id="success-banner">
        📰 TEBRİKLER! Tüm kelimeleri çözdünüz! Kelime kartlarınız hazırlandı.
    </div>

    <div class="game-layout">
        <div class="puzzle-section">
            <div class="crossword-grid" id="grid-container"></div>
        </div>

        <div class="clues-section">
            <h2>Günün Sinema İpuçları</h2>
            
            <div class="clue-group">
                <h3>Yatay Kelimeler (Across)</h3>
                <div id="across-clues"></div>
            </div>

            <div class="clue-group">
                <h3>Dikey Kelimeler (Down)</h3>
                <div id="down-clues"></div>
            </div>
        </div>
    </div>
</div>

<div id="deckModal" class="modal">
    <div class="modal-content">
        <h2>✨ Öğrenilen Kelime Kartları</h2>
        <div class="deck-list" id="deckList"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn-action" onclick="closeModal()">Harika, Kapat!</button>
        </div>
    </div>
</div>

<script>
    // ORİJİNAL, GENİŞ KELİME HAVUZUNUZ TAMAMEN KORUNDU
    const DATA_POOL = {
        en: [

            { word: "STAR", clue: "Clue: 'Brad Pitt is a Hollywood _______.' | Anlamı: Yıldız Oyuncu" },
            { word: "HERO", clue: "Clue: 'Batman is the _______ Gotham needs.' | Anlamı: Kahraman" },
            { word: "THIEF", clue: "Clue: 'In Inception, Cobb is a skilled _______.' | Anlamı: Hırsız" },
            { word: "AWARD", clue: "Clue: 'He won an Oscar _______ last night.' | Anlamı: Ödül" },
            { word: "FIGHT", clue: "Clue: 'The first rule of _______ Club...' | Anlamı: Dövüş" },
            { word: "SNAKE", clue: "Clue: 'Samuel L. Jackson fought _______ on a plane.' | Anlamı: Yılan" },
            { word: "ALIEN", clue: "Clue: 'The Ridley Scott horror film is named _______.' | Anlamı: Uzaylı" },
            { word: "RING", clue: "Clue: 'The Lord of the _______ is a fantasy epic.' | Anlamı: Yüzük" },
            { word: "SHARK", clue: "Clue: 'Spielberg's Jaws is about a killer _______.' | Anlamı: Köpekbalığı" },
            { word: "STORY", clue: "Clue: 'Toy _______ was the first full CGI film.' | Anlamı: Hikaye" },
            { word: "DANCE", clue: "Clue: 'La La Land features beautiful _______ scenes.' | Anlamı: Dans" },
            { word: "SPACE", clue: "Clue: 'Interstellar is an epic film about _______.' | Anlamı: Uzay" },
            { word: "LIGHT", clue: "Clue: 'A Jedi fights with a _______saber.' | Anlamı: Işık" },
            { word: "GHOST", clue: "Clue: 'Who you gonna call? _______busters!' | Anlamı: Hayalet" },
            { word: "CROWD", clue: "Clue: 'Gladiator arena was full of a roaring _______.' | Anlamı: Kalabalık" }
        ],
        es: [
            { word: "MUNDO", clue: "Frase: 'Avatar muestra un _______ fantástico.' | Anlamı: Dünya" },
            { word: "NUEVO", clue: "Frase: 'Ayer vi el _______ tráiler de Marvel.' | Anlamı: Yeni" },
            { word: "PAPEL", clue: "Frase: 'El _______ principal de Joker fue increíble.' | Anlamı: Rol" },
            { word: "HÉROE", clue: "Frase: 'Spiderman es mi _______ favorito.' | Anlamı: Kahraman" },
            { word: "NOCHE", clue: "Frase: 'Batman trabaja durante la _______.' | Anlamı: Gece" },
            { word: "CHICA", clue: "Frase: 'Almodóvar dirige películas de la _______ Almodóvar.' | Anlamı: Kız" },
            { word: "GUION", clue: "Frase: 'Tarantino escribe un _______ lleno de action.' | Anlamı: Senaryo" },
            { word: "FUEGO", clue: "Frase: 'Los efectos especiales incluyen mucho _______.' | Anlamı: Ateş" },
            { word: "SUEÑO", clue: "Frase: 'Inception es una película sobre un _______.' | Anlamı: Rüya" },
            { word: "LIBRO", clue: "Frase: 'Harry Potter está basado en un _______.' | Anlamı: Kitap" },
            { word: "OJOS", clue: "Frase: 'El secreto de sus _______ ganó el Oscar.' | Anlamı: Gözler" },
            { word: "TIEMPO", clue: "Frase: 'Una película sobre viajes en el _______.' | Anlamı: Zaman" }
        ],
        de: [
            { word: "KINO", clue: "Satz: 'Wir treffen uns heute Abend im _______.' | Anlamı: Sinema" },
            { word: "HELD", clue: "Satz: 'Superman ist ein bekannter _______.' | Anlamı: Kahraman" },
            { word: "PREIS", clue: "Satz: 'Dieser Regisseur gewann einen großen _______.' | Anlamı: Ödül" },
            { word: "NACHT", clue: "Satz: 'Ein guter Horrorfilm spielt oft in der _______.' | Anlamı: Gece" },
            { word: "ROLLE", clue: "Satz: 'Er spielt die wichtigste _______ im Drama.' | Anlamı: Rol" },
            { word: "REGIE", clue: "Satz: 'Spielberg führte _______ bei diesem Klassiker.' | Anlamı: Yönetmenlik" },
            { word: "BUCH", clue: "Satz: 'Der Film basiert auf einem berühmten _______.' | Anlamı: Kitap" },
            { word: "LIEBE", clue: "Satz: 'Titanic ist eine Geschichte über große _______.' | Anlamı: Aşk" },
            { word: "TRAUM", clue: "Satz: 'Inception handelt von einem _______ im Traum.' | Anlamı: Rüya" },
            { word: "LEBEN", clue: "Satz: 'Das _______ der Anderen gewann einen Oscar.' | Anlamı: Hayat" },
            { word: "KRIEG", clue: "Satz: 'Star Wars bedeutet Star _______ auf Deutsch.' | Anlamı: Savaş" },
            { word: "ANGST", clue: "Satz: 'Ein Horrorfilm erzeugt beim Zuschauer _______.' | Anlamı: Korku" }
        ],
        fr: [
            { word: "ECRAN", clue: "Phrase: 'Regarder un chef-d'œuvre sur le grand _______.' | Anlamı: Ekran" },
            { word: "SALLE", clue: "Phrase: 'La _______ de cinéma était complètement pleine.' | Anlamı: Salon/Oda" },
            { word: "REVRE", clue: "Phrase: 'Inception parle d'un _______ contrôlé.' | Anlamı: Rüya" },
            { word: "PIECE", clue: "Phrase: 'Une tragédie adaptée d'une _______ de théâtre.' | Anlamı: Oyun/Parça" },
            { word: "DRÔLE", clue: "Phrase: 'Intouchables is un film très _______ et émouvant.' | Anlamı: Komik" },
            { word: "DEBUT", clue: "Phrase: 'Le générique commence au _______ du film.' | Anlamı: Başlangıç" },
            { word: "COEUR", clue: "Phrase: 'Un drame romantique qui touche le _______.' | Anlamı: Kalp" },
            { word: "GEANT", clue: "Phrase: 'Shrek est un ogre _______ et vert.' | Anlamı: Dev" },
            { word: "TEMPS", clue: "Phrase: 'Un voyage dans le _______ avec une DeLorean.' | Anlamı: Zaman" },
            { word: "FINALE", clue: "Phrase: 'La scène _______ de ce film coupe le souffle.' | Anlamı: Final/Son" }
        ],
        it: [
            { word: "CINEMA", clue: "Frase: 'Andiamo al _______ a vedere un horror.' | Anlamı: Sinema" },
            { word: "ATTORE", clue: "Frase: 'Marcello Mastroianni è un grande _______.' | Anlamı: Oyuncu" },
            { word: "REGIA", clue: "Frase: 'La _______ di questo kolossal è di Fellini.' | Anlamı: Yönetmenlik" },
            { word: "STORIA", clue: "Frase: 'Una _______ emozionante basata su fatti veri.' | Anlamı: Hikaye" },
            { word: "RUOLO", clue: "Frase: 'Ha ottenuto il _______ del cattivo nel film.' | Anlamı: Rol" },
            { word: "VITA", clue: "Frase: 'La dolce _______ è un classico del cinema.' | Anlamı: Hayat" },
            { word: "SUONO", clue: "Frase: 'Il montaggio del _______ ha vinto un premio.' | Anlamı: Ses" },
            { word: "CITTÀ", clue: "Frase: 'Batman protegge la _______ di Gotham.' | Anlamı: Şehir" },
            { word: "FUOCO", clue: "Frase: 'Un film d'azione pieno di esplosioni e _______.' | Anlamı: Ateş" }
        ]
    };

    let matrixSize = 15;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let usedWordsHistory = { en: [], es: [], de: [], fr: [], it: [] };

    // Yeni Mekanik Tanımlamaları
    let score = 0;
    let combo = 0;
    let timerInterval = null;
    let timeLeft = 0;
    let currentFocusCell = null;

    window.onload = function() {
        if(localStorage.getItem('polyglot_score')) {
            score = parseInt(localStorage.getItem('polyglot_score'));
            document.getElementById('scoreVal').innerText = score;
        }
        initGame();
    };

    function resetLanguageAndInit() {
        const selectedLang = document.getElementById('langSelect').value;
        usedWordsHistory[selectedLang] = [];
        initGame();
    }

    function initGame() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('success-banner').style.display = 'none';
        
        const selectedLang = document.getElementById('langSelect').value;
        const timerConfig = document.getElementById('timerSelect').value;

        let pool = [...DATA_POOL[selectedLang]];
        let unusedPool = pool.filter(w => !usedWordsHistory[selectedLang].includes(w.word));
        
        if (unusedPool.length < 4) {
            usedWordsHistory[selectedLang] = [];
            unusedPool = pool;
        }

        document.getElementById('poolStats').innerText = `(Kalan taze kombinasyon: ~${unusedPool.length})`;
        unusedPool.sort(() => 0.5 - Math.random());
        
        // Geniş havuzdan en fazla 6 kelime seçerek matrise gönderiyoruz
        let selectedWords = unusedPool.slice(0, Math.min(6, unusedPool.length));

        const generationResult = generateCrosswordLayout(selectedWords);
        
        if (!generationResult || generationResult.placedCount < 3) {
            initGame();
            return;
        }

        generationResult.placedWords.forEach(w => {
            if (!usedWordsHistory[selectedLang].includes(w.word)) {
                usedWordsHistory[selectedLang].push(w.word);
            }
        });

        activeWords = generationResult.placedWords;
        renderGrid(generationResult.matrix);
        renderClues(selectedLang);
        setupTimer(timerConfig);
        
        combo = 0;
        document.getElementById('comboVal').innerText = combo;
    }

    function setupTimer(mode) {
        const timerDisplay = document.getElementById('timerVal');
        if (mode === "off") {
            timerDisplay.innerText = "--:--";
            return;
        }
        timeLeft = parseInt(mode) * 60;
        updateTimerDisplay();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("⏱️ Süre bitti! Bulmaca kilitlendi.");
                Object.values(inputElements).forEach(input => input.disabled = true);
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timerVal').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function speakWord(word, langCode) {
        if ('speechSynthesis' in window) {
            let utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = langCode;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Tarayıcınız ses sentezini desteklemiyor.");
        }
    }

    function generateCrosswordLayout(words) {
        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        let placedWords = [];
        let wordCounter = 1;

        if(words.length === 0) return null;

        let first = words[0];
        let startCol = Math.max(0, Math.floor((matrixSize - first.word.length) / 2));
        let startRow = Math.floor(matrixSize / 2);
        
        for (let i = 0; i < first.word.length; i++) {
            localMatrix[startRow][startCol + i] = { letter: first.word[i], isStart: i === 0, num: wordCounter };
        }
        placedWords.push({ ...first, row: startRow, col: startCol, dir: "across", num: wordCounter++ });

        for (let w = 1; w < words.length; w++) {
            let current = words[w];
            let placed = false;

            for (let r = 0; r < matrixSize && !placed; r++) {
                for (let c = 0; c < matrixSize && !placed; c++) {
                    if (localMatrix[r][c] !== null) {
                        let matchLetter = localMatrix[r][c].letter;
                        let matchIndex = current.word.indexOf(matchLetter);

                        if (matchIndex !== -1) {
                            let dRow = r - matchIndex;
                            let dCol = c;
                            if (canPlaceWord(current.word, dRow, dCol, "down", localMatrix, r, c)) {
                                for (let i = 0; i < current.word.length; i++) {
                                    if (!localMatrix[dRow + i][dCol]) {
                                        localMatrix[dRow + i][dCol] = { letter: current.word[i], isStart: i === 0, num: i === 0 ? wordCounter : null };
                                    } else if (i === 0) {
                                        localMatrix[dRow + i][dCol].num = wordCounter;
                                    }
                                }
                                placedWords.push({ ...current, row: dRow, col: dCol, dir: "down", num: wordCounter++ });
                                placed = true;
                            }
                            
                            let aRow = r;
                            let aCol = c - matchIndex;
                            if (!placed && canPlaceWord(current.word, aRow, aCol, "across", localMatrix, r, c)) {
                                for (let i = 0; i < current.word.length; i++) {
                                    if (!localMatrix[aRow][aCol + i]) {
                                        localMatrix[aRow][aCol + i] = { letter: current.word[i], isStart: i === 0, num: i === 0 ? wordCounter : null };
                                    } else if (i === 0) {
                                        localMatrix[aRow][aCol + i].num = wordCounter;
                                    }
                                }
                                placedWords.push({ ...current, row: aRow, col: aCol, dir: "across", num: wordCounter++ });
                                placed = true;
                            }
                        }
                    }
                }
            }
        }
        return { matrix: localMatrix, placedWords: placedWords, placedCount: placedWords.length };
    }

    function canPlaceWord(word, startRow, startCol, dir, matrix, intersectR, intersectC) {
        if (startRow < 0 || startCol < 0) return false;
        if (dir === "down" && startRow + word.length > matrixSize) return false;
        if (dir === "across" && startCol + word.length > matrixSize) return false;

        for (let i = 0; i < word.length; i++) {
            let r = dir === "down" ? startRow + i : startRow;
            let c = dir === "down" ? startCol : startCol + i;
            if (r === intersectR && c === intersectC) continue; 
            if (matrix[r][c] !== null && matrix[r][c].letter !== word[i]) return false; 
        }
        return true;
    }

    function renderGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 35px)`;
        container.style.gridTemplateRows = `repeat(${matrixSize}, 35px)`;
        inputElements = {};

        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                const cellData = matrixData[r][c];
                const cellDiv = document.createElement('div');
                
                if (cellData) {
                    cellDiv.className = 'cell active';
                    if (cellData.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = cellData.num;
                        cellDiv.appendChild(numSpan);
                    }

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    
                    input.addEventListener('input', (e) => {
                        input.value = e.target.value.toUpperCase();
                        handleLetterInput(r, c, input.value);
                    });

                    input.addEventListener('focus', () => {
                        currentFocusCell = { row: r, col: c, element: input };
                    });

                    input.addEventListener('keydown', (e) => {
                        let targetRow = r; let targetCol = c;
                        switch (e.key) {
                            case "ArrowUp": targetRow--; break;
                            case "ArrowDown": targetRow++; break;
                            case "ArrowLeft": targetCol--; break;
                            case "ArrowRight": targetCol++; break;
                            default: return;
                        }
                        if (inputElements[`${targetRow}-${targetCol}`]) {
                            e.preventDefault();
                            inputElements[`${targetRow}-${targetCol}`].focus();
                        }
                    });

                    inputElements[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell';
                }
                container.appendChild(cellDiv);
            }
        }
    }

    function handleLetterInput(r, c, char) {
        if (gridMatrix[r][c] && gridMatrix[r][c].letter === char) {
            combo++;
            score += 10 + (combo * 2);
        } else {
            combo = 0;
        }
        document.getElementById('scoreVal').innerText = score;
        document.getElementById('comboVal').innerText = combo;
        localStorage.setItem('polyglot_score', score);
        checkWinCondition();
    }

    function getLetterHint() {
        if (currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            const cell = gridMatrix[currentFocusCell.row][currentFocusCell.col];
            currentFocusCell.element.value = cell.letter;
            
            combo = 0;
            score = Math.max(0, score - 25);
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('comboVal').innerText = combo;
            
            checkWinCondition();
        } else {
            alert("Lütfen önce doldurmak istediğiniz bir hücreye tıklayın!");
        }
    }

    function renderClues(lang) {
        const acrossContainer = document.getElementById('across-clues');
        const downContainer = document.getElementById('down-clues');
        acrossContainer.innerHTML = '';
        downContainer.innerHTML = '';

        activeWords.sort((a,b) => a.num - b.num).forEach(item => {
            const clueDiv = document.createElement('div');
            clueDiv.className = 'clue-item';
            
            clueDiv.innerHTML = `
                <div class="clue-text-wrapper"><strong>${item.num}</strong> ${item.clue}</div>
                <button class="audio-btn" onclick="speakWord('${item.word}', '${lang}')">🔊</button>
            `;
            
            if (item.dir === 'across') acrossContainer.appendChild(clueDiv);
            else downContainer.appendChild(clueDiv);
        });
    }

    function checkWinCondition() {
        let allCorrect = true;
        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                if (gridMatrix[r][c]) {
                    const userInput = inputElements[`${r}-${c}`].value;
                    if (userInput !== gridMatrix[r][c].letter) {
                        allCorrect = false;
                        break;
                    }
                }
            }
        }
        if (allCorrect) {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('success-banner').style.display = 'block';
            Object.values(inputElements).forEach(input => input.disabled = true);
            openVocabularyDeck();
        }
    }

    function openVocabularyDeck() {
        const deckList = document.getElementById('deckList');
        deckList.innerHTML = '';
        
        activeWords.forEach(item => {
            const div = document.createElement('div');
            div.className = 'deck-item';
            div.innerHTML = `⭐ <strong>${item.word}</strong>: ${item.clue.split('|')[1] || item.clue}`;
            deckList.appendChild(div);
        });

        document.getElementById('deckModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('deckModal').style.display = 'none';
    }
</script>

</body>
</html>
