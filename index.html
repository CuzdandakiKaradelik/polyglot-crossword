<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Polyglot Movie Crossword</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           TEMA TANIMLAMALARI (10 Özgün Gazete/Baskı Teması)
           ========================================================================== */
        :root { --bg: #2b2b2b; --page: #ffffff; --grid: #bcbfc2; --text: #1a1a1a; --hint: #fbc02d; --btn: #1f3a52; --accent: #777; }
        .theme-0 { --bg: #2b2b2b; --page: #ffffff; --grid: #bcbfc2; --text: #1a1a1a; --hint: #fbc02d; --btn: #1f3a52; --accent: #777; } 
        .theme-1 { --bg: #1c1c1c; --page: #f4edd2; --grid: #cfc4a2; --text: #3d2b1f; --hint: #d4af37; --btn: #5c4033; --accent: #8b7355; } 
        .theme-2 { --bg: #0f172a; --page: #1e293b; --grid: #475569; --text: #f8fafc; --hint: #38bdf8; --btn: #0ea5e9; --accent: #94a3b8; } 
        .theme-3 { --bg: #2d3748; --page: #edf2f7; --grid: #cbd5e0; --text: #2d3748; --hint: #ed8936; --btn: #2b6cb0; --accent: #4a5568; } 
        .theme-4 { --bg: #741b47; --page: #fff2cc; --grid: #e6b8af; --text: #4c1130; --hint: #f1c232; --btn: #a64d79; --accent: #741b47; } 
        .theme-5 { --bg: #1e3f20; --page: #f1f8f5; --grid: #c2d6cc; --text: #0f2912; --hint: #81c784; --btn: #2e7d32; --accent: #4caf50; } 
        .theme-6 { --bg: #3a3a3a; --page: #e5e5e5; --grid: #b5b5b5; --text: #111111; --hint: #ff5722; --btn: #e64a19; --accent: #616161; } 
        .theme-7 { --bg: #4a148c; --page: #f3e5f5; --grid: #d1c4e9; --text: #311b92; --hint: #ffb74d; --btn: #6a1b9a; --accent: #7e57c2; } 
        .theme-8 { --bg: #004d40; --page: #e0f2f1; --grid: #b2dfdb; --text: #004d40; --hint: #ffb300; --btn: #00695c; --accent: #4db6ac; } 
        .theme-9 { --bg: #5d4037; --page: #efebe9; --grid: #d7ccc8; --text: #3e2723; --hint: #d4a373; --btn: #4e342e; --accent: #8d6e63; } 

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .paper-container {
            background-color: var(--page);
            width: 100%;
            max-width: 850px;
            border: 4px double var(--text);
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 5px 0;
        }

        .sub-header {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .timer-bar {
            background-color: var(--grid);
            opacity: 0.9;
            color: var(--text);
            text-align: center;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 2px solid var(--text);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        select {
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            padding: 4px;
            border: 1px solid var(--accent);
            background: var(--page);
            color: var(--text);
        }

        .action-buttons {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 14px;
            border: 1px solid var(--text);
            cursor: pointer;
            border-radius: 3px;
            transition: transform 0.1s ease;
        }

        .btn:active { transform: scale(0.95); }
        .btn-new { background-color: var(--btn); color: white; }
        .btn-hint { background-color: var(--hint); color: black; }

        .workspace-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 700px) {
            .workspace-layout { grid-template-columns: 1fr; }
        }

        .matrix-section {
            background-color: var(--grid);
            border: 1px solid var(--accent);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
            overflow: auto;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--accent);
            padding: 1px;
        }

        .cell {
            background-color: transparent;
            position: relative;
            width: 34px;
            height: 34px;
        }

        .cell.active { background-color: var(--page); }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
            background: transparent;
            color: var(--text);
        }

        .cell input:focus { background-color: var(--hint); color: #000; outline: none; }
        .cell-num { position: absolute; top: 1px; left: 2px; font-size: 8px; font-weight: bold; color: var(--text); opacity: 0.8; z-index: 2; }

        .corpus-section { display: flex; flex-direction: column; gap: 15px; }
        .corpus-section h2 { font-family: 'Playfair Display', serif; font-size: 18px; margin: 0 0 5px 0; border-bottom: 1px solid var(--text); padding-bottom: 3px; }
        .clue-block h3 { margin: 0 0 8px 0; font-size: 10px; text-transform: uppercase; background: var(--text); color: var(--page); padding: 2px 6px; display: inline-block; }
        .clue-item { font-size: 11px; line-height: 1.4; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px dotted var(--accent); }

        .corpus-index-wrapper { margin-top: 20px; border-top: 2px dashed var(--text); padding-top: 15px; display: none; }
        .corpus-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        .corpus-table th, .corpus-table td { border: 1px solid var(--accent); padding: 6px; text-align: left; }
        .corpus-table th { background-color: var(--grid); }
    </style>
</head>
<body class="theme-0" id="body-root">

<div class="paper-container">
    <header>
        <h1 id="ui-title">The Polyglot Movie Crossword</h1>
        <div class="sub-header" id="ui-edition">Baskı Serisi: Platin Özel Matbaa</div>
    </header>

    <div class="timer-bar" id="ui-timer">⏱ Kalan Süre: --:--</div>

    <div class="control-panel">
        <div class="control-group">
            <label id="lbl-lang">Hedef Dil:</label>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="tr">Türkçe</option>
                <option value="en">English (İngilizce)</option>
                <option value="es">Español (İspanyolca)</option>
                <option value="de">Deutsch (Almanca)</option>
                <option value="fr">Français (Fransızca)</option>
            </select>
        </div>

        <div class="control-group">
            <label id="lbl-theme">Gazete Teması:</label>
            <select id="themeSelect" onchange="applyTheme()">
                <option value="0">📰 Klasik Platin Baskı</option>
                <option value="1">📜 Altın Vintaj Parşömen</option>
                <option value="2">🌌 Gece Yarısı Haberleri</option>
                <option value="3">🏢 Modern Günlük Bülten</option>
                <option value="4">🔮 Gotik Kültür Eki</option>
                <option value="5">🌿 Botanik Gazete Dergisi</option>
                <option value="6">🏭 Endüstriyel Matbaa</option>
                <option value="7">⚡ Siber Klasik Baskı</option>
                <option value="8">🌊 Deniz Esintisi Sanat</option>
                <option value="9">☕ Espresso Akademik</option>
            </select>
        </div>

        <div class="control-group">
            <label id="lbl-version">Baskı Versiyonu:</label>
            <select id="matrixVersion" onchange="buildCrosswordMatrix()">
                <option value="0">Set #1 (Klasik Sinema)</option>
                <option value="1">Set #2 (Kültür & Sanat)</option>
            </select>
        </div>

        <div class="action-buttons">
            <button class="btn btn-new" id="btn-new" onclick="toggleMatrixVersion()">🔄 Yeni Kelimeler</button>
            <button class="btn btn-hint" id="btn-hint" onclick="giveLetterHint()">💡 Harf Al (İpucu)</button>
        </div>
    </div>

    <div class="workspace-layout">
        <div class="matrix-section">
            <div class="crossword-grid" id="grid-container"></div>
        </div>

        <div class="corpus-section">
            <h2 id="ui-clues-title">Günün Kültür İpuçları</h2>
            <div class="clue-block">
                <h3 id="ui-across">Yatay Kelimeler</h3>
                <div id="across-clues"></div>
            </div>
            <div class="clue-block">
                <h3 id="ui-down">Dikey Kelimeler</h3>
                <div id="down-clues"></div>
            </div>
        </div>
    </div>

    <div class="corpus-index-wrapper" id="corpus-index-area">
        <h3 style="margin:0;" id="ui-success">✓ Matris Başarıyla Çözüldü!</h3>
        <table class="corpus-table">
            <thead>
                <tr>
                    <th id="th-word">Sözcük (Lexeme)</th>
                    <th id="th-note">Bağlamsal Eğitim Notu</th>
                </tr>
            </thead>
            <tbody id="corpus-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    // ==========================================================================
    // ARAYÜZ DİL PAKETLERİ (Tam Sayfa Yerelleştirme)
    // ==========================================================================
    const TRANSLATIONS = {
        tr: { title: "Leksikal Matris Masası", edition: "Baskı Serisi: Özel Matbaa Sürümü", timer: "⏱ Kalan Süre: Sınırsız", lang: "Hedef Dil:", theme: "Gazete Teması:", version: "Baskı Versiyonu:", btnNew: "🔄 Yeni Kelimeler", btnHint: "💡 Harf Al (İpucu)", clues: "Günün Kültür İpuçları", across: "Yatay Kelimeler", down: "Dikey Kelimeler", success: "✓ Matris Başarıyla Çözüldü!", thWord: "Sözcük", thNote: "Bağlamsal Eğitim Notu" },
        en: { title: "The Polyglot Movie Crossword", edition: "Edition: Premium Press Version", timer: "⏱ Time Remaining: Unlimited", lang: "Target Language:", theme: "Press Theme:", version: "Print Version:", btnNew: "🔄 New Words", btnHint: "💡 Get Hint (Letter)", clues: "Daily Culture Clues", across: "Across Words", down: "Down Words", success: "✓ Matrix Successfully Solved!", thWord: "Word", thNote: "Contextual Study Note" },
        es: { title: "El Crucigrama Políglota", edition: "Edición: Versión de Prensa Premium", timer: "⏱ Tiempo Restante: Ilimitado", lang: "Idioma Destino:", theme: "Tema de Prensa:", version: "Versión de Impresión:", btnNew: "🔄 Nuevas Palabras", btnHint: "💡 Obtener Letra", clues: "Pistas Culturales del Día", across: "Palabras Horizontales", down: "Palabras Verticales", success: "✓ ¡Matriz Resuelta Con Éxito!", thWord: "Palabra", thNote: "Nota de Estudio Contextual" },
        de: { title: "Das Polyglotte Kreuzworträtsel", edition: "Ausgabe: Premium-Presseversion", timer: "⏱ Verbleibende Zeit: Unbegrenzt", lang: "Zielsprache:", theme: "Zeitungsthema:", version: "Druckversion:", btnNew: "🔄 Neue Wörter", btnHint: "💡 Tipp Holen", clues: "Kulturhinweise des Tages", across: "Waagerecht", down: "Senkrecht", success: "✓ Matrix erfolgreich gelöst!", thWord: "Wort", thNote: "Kontextuelle Studiennotiz" },
        fr: { title: "Les Mots Croisés Polyglottes", edition: "Édition: Version Presse Premium", timer: "⏱ Temps Restant: Illimité", lang: "Langue Cible:", theme: "Thème de Presse:", version: "Version d'Impression:", btnNew: "🔄 Nouveaux Mots", btnHint: "💡 Obtenir Lettre", clues: "Indices Culturels du Jour", across: "Mots Horizontaux", down: "Mots Verticaux", success: "✓ Matrice résolue avec succès!", thWord: "Mot", thNote: "Note d'Étude Contextuelle" }
    };

    // ==========================================================================
    // TAMAMEN BENZERSİZ KELİME HAVUZU (Set #1 ve Set #2 Arasında Hiçbir Benzerlik Yoktur)
    // ==========================================================================
    const LEXICON_DATABASE = {
        tr: [
            [{w:"SİNEMA", c:"Yedinci sanat dalı, beyaz perde."}, {w:"AKTOR", c:"Sahnede veya kamera önünde rol yapan erkek sanatçı."}, {w:"SAHNE", c:"Bir filmin veya tiyatro oyununun bölünmüş kesitlerinden her biri."}, {w:"KAMERA", c:"Görüntüleri kaydetmeye yarayan optik cihaz."}, {w:"KÜLTÜR", c:"Toplumların sanatsal ve entelektüel birikimlerinin bütünü."}],
            [{w:"ROMAN", c:"Gerçek ya da kurgusal olayları uzun uzadıya anlatan edebi tür."}, {w:"YAZAR", c:"Kitap, senaryo veya fikir metinleri kaleme alan sanatçı."}, {w:"DRAMA", c:"Ciddi ve duygusal tonların ağır bastığı tiyatro veya film türü."}, {w:"REJİSÖR", c:"Filmin çekimlerini ve sanatsal yönetimini yöneten kişi, yönetmen."}, {w:"BELGE", c:"Gerçek olayları ve kanıtları sinema diliyle aktaran film türü."}]
        ],
        en: [
            [{w:"AWARD", c:"An honor or prize given for exceptional film merit."}, {w:"THIEF", c:"A person who steals; central job of Cobb in Inception."}, {w:"MOVIE", c:"A motion picture production; cinema presentation."}, {w:"SPACE", c:"The cosmos; the main settings of the movie Interstellar."}, {w:"HERO", c:"A protagonist admired for courage or outstanding achievements."}],
            [{w:"SCRIPT", c:"The written text of a movie, play, or broadcast."}, {w:"SCENE", c:"A sequence of continuous action in a motion picture."}, {w:"STAGE", c:"A raised floor or platform for performers and actors."}, {w:"SHOCK", c:"A sudden upsetting or surprising event in thriller plots."}, {w:"SOUND", c:"Auditory effect elements and scores of a film production."}]
        ],
        es: [
            [{w:"PREMIO", c:"Galardón o distinción entregado por mérito artístico."}, {w:"LADRON", c:"Persona que hurta; clave en la trama de Inception."}, {w:"CINE", c:"Establecimiento público para la proyección de películas."}, {w:"ESPACIO", c:"El cosmos exterior; tema central de Interstellar."}, {w:"HEROE", c:"Personaje famoso por sus virtues ideales o hazañas."}],
            [{w:"GUION", c:"Texto escrito preparado con los detalles para la filmación."}, {w:"ESCENA", c:"Parte de una obra cinematográfica que se desarrolla en un sitio."}, {w:"TEATRO", c:"Edificio o sala destinada al espectáculo dramático y musical."}, {w:"DRAMA", c:"Obra theatrical o cinematográfica de carácter triste y serio."}, {w:"MUNDO", c:"El planeta tierra o conjunto de todo lo existente."}]
        ],
        de: [
            [{w:"PREIS", c:"Eine Auszeichnung für hervorragende filmische Leistungen."}, {w:"DIEB", c:"Jemand, der stiehlt; Fokus im Science-Fiction-Film Inception."}, {w:"FILM", c:"Eine Folge von bewegten Bildern auf der Kinoleinwand."}, {w:"WELTRAUM", c:"Das Universum außerhalb der Erdatmosphäre (Interstellar)."}, {w:"HELD", c:"Eine Person, die eine besonders mutige Tat vollbracht hat."}],
            [{w:"SKRIPT", c:"Das gedruckte Drehbuch für Schauspieler und Regisseure."}, {w:"SZENE", c:"Ein in sich geschlossener Teilabschnitt einer Filmhandlung."}, {w:"BUEHNE", c:"Der erhöhte Ort für künstlerische und theatralische Auftritte."}, {w:"MUSIK", c:"Akustische und melodische Begleitung der Filmszenen."}, {w:"KUNST", c:"Schöpferisches Gestalten aus verschiedenen Materialien und Ideen."}]
        ],
        fr: [
            [{w:"PRIX", c:"Récompense honorifique accordée à un vainqueur du cinéma."}, {w:"VOLEUR", c:"Personne qui commet un larcin; voir le film Inception."}, {w:"SALLE", c:"Lieu public où le public se réunit pour voir le film."}, {w:"ESPACE", c:"Lieu infini au-delà de l'atmosphère terrestre (Interstellar)."}, {w:"HEROS", c:"Personnage principal d'une œuvre littéraire ou cinématographique."}],
            [{w:"TEXTE", c:"Le document écrit servant de base narrative aux acteurs."}, {w:"ECRAN", c:"Surface blanche sur laquelle est projeté le film au cinéma."}, {w:"IMAGE", c:"Représentation visuelle capturée par l'objectif de la caméra."}, {w:"DRAME", c:"Pièce ou film dont l'action présente un caractère tragique."}, {w:"PHASE", c:"Chaque étape successive d'une production ou d'un montage."}]
        ]
    };

    let matrixSize = 12;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let currentFocusCell = null;

    function applyTheme() {
        const themeIdx = document.getElementById('themeSelect').value;
        document.getElementById('body-root').className = `theme-${themeIdx}`;
    }

    function safeUpperCase(str, lang) {
        if (lang === 'tr') {
            return str.replace(/i/g, 'İ').replace(/ı/g, 'I').toUpperCase();
        }
        return str.toUpperCase();
    }

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const pack = TRANSLATIONS[lang];

        document.getElementById('ui-title').innerText = pack.title;
        document.getElementById('ui-edition').innerText = pack.edition;
        document.getElementById('ui-timer').innerText = pack.timer;
        document.getElementById('lbl-lang').innerText = pack.lang;
        document.getElementById('lbl-theme').innerText = pack.theme;
        document.getElementById('lbl-version').innerText = pack.version;
        document.getElementById('btn-new').innerText = pack.btnNew;
        document.getElementById('btn-hint').innerText = pack.btnHint;
        document.getElementById('ui-clues-title').innerText = pack.clues;
        document.getElementById('ui-across').innerText = pack.across;
        document.getElementById('ui-down').innerText = pack.down;
        document.getElementById('ui-success').innerText = pack.success;
        document.getElementById('th-word').innerText = pack.thWord;
        document.getElementById('th-note').innerText = pack.thNote;

        buildCrosswordMatrix();
    }

    // "Yeni Kelimeler" basıldığında Set 1 ve Set 2 arasında hatasız geçiş sağlar
    function toggleMatrixVersion() {
        const selectElement = document.getElementById('matrixVersion');
        selectElement.value = (parseInt(selectElement.value) === 0) ? "1" : "0";
        buildCrosswordMatrix();
    }

    function buildCrosswordMatrix() {
        document.getElementById('corpus-index-area').style.display = 'none';
        const lang = document.getElementById('langSelect').value;
        const version = parseInt(document.getElementById('matrixVersion').value);
        const subset = LEXICON_DATABASE[lang][version];

        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        activeWords = [];

        // Dinamik Matris Motoru: Kelimelerin uzunlukları değişse dahi kayma/taşma yapmaz.
        let w1 = subset[0]; let r1 = 4, c1 = 2;
        for(let i=0; i<w1.w.length; i++) {
            localMatrix[r1][c1 + i] = { letter: w1.w[i], isStart: i===0, num: 1, dir: "across" };
        }
        activeWords.push({ w: w1.w, c: w1.c, row: r1, col: c1, dir: "across", num: 1 });

        let w2 = subset[1]; let r2 = 1, c2 = 4;
        for(let i=0; i<w2.w.length; i++) {
            if(!localMatrix[r2 + i][c2]) {
                localMatrix[r2 + i][c2] = { letter: w2.w[i], isStart: i===0, num: 2, dir: "down" };
            } else if(i===0) { localMatrix[r2 + i][c2].num = 2; }
        }
        activeWords.push({ w: w2.w, c: w2.c, row: r2, col: c2, dir: "down", num: 2 });

        let w3 = subset[2]; let r3 = 6, c3 = 1;
        for(let i=0; i<w3.w.length; i++) {
            if(!localMatrix[r3][c3 + i]) {
                localMatrix[r3][c3 + i] = { letter: w3.w[i], isStart: i===0, num: 3, dir: "across" };
            } else if(i===0) { localMatrix[r3][c3 + i].num = 3; }
        }
        activeWords.push({ w: w3.w, c: w3.c, row: r3, col: c3, dir: "across", num: 3 });

        let w4 = subset[3]; let r4 = 2, c4 = 7;
        for(let i=0; i<w4.w.length; i++) {
            if(!localMatrix[r4 + i][c4]) {
                localMatrix[r4 + i][c4] = { letter: w4.w[i], isStart: i===0, num: 4, dir: "down" };
            } else if(i===0) { localMatrix[r4 + i][c4].num = 4; }
        }
        activeWords.push({ w: w4.w, c: w4.c, row: r4, col: c4, dir: "down", num: 4 });

        let w5 = subset[4]; let r5 = 5, c5 = 6;
        for(let i=0; i<w5.w.length; i++) {
            if(!localMatrix[r5][c5 + i]) {
                localMatrix[r5][c5 + i] = { letter: w5.w[i], isStart: i===0, num: 5, dir: "across" };
            } else if(i===0) { localMatrix[r5][c5 + i].num = 5; }
        }
        activeWords.push({ w: w5.w, c: w5.c, row: r5, col: c5, dir: "across", num: 5 });

        renderVisualGrid(localMatrix);
        renderLinguisticClues();
    }

    function renderVisualGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 34px)`;
        inputElements = {};
        currentFocusCell = null;

        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                const cell = matrixData[r][c];
                const div = document.createElement('div');
                if(cell) {
                    div.className = 'cell active';
                    if(cell.num) {
                        let ns = document.createElement('span');
                        ns.className = 'cell-num';
                        ns.innerText = cell.num;
                        div.appendChild(ns);
                    }
                    let inp = document.createElement('input');
                    inp.type = 'text';
                    inp.maxLength = 1;
                    
                    inp.addEventListener('input', (e) => {
                        const currentLang = document.getElementById('langSelect').value;
                        e.target.value = safeUpperCase(e.target.value, currentLang);
                        checkGridState();
                        
                        if(e.target.value.length === 1) {
                            let nextR = cell.dir === "down" ? r + 1 : r;
                            let nextC = cell.dir === "down" ? c : c + 1;
                            let nextInp = inputElements[`${nextR}-${nextC}`];
                            if(nextInp) nextInp.focus();
                        }
                    });

                    inp.addEventListener('keydown', (e) => {
                        if (e.key === 'Backspace' && e.target.value === '') {
                            let prevR = cell.dir === "down" ? r - 1 : r;
                            let prevC = cell.dir === "down" ? c - 1 : c;
                            let prevInp = inputElements[`${prevR}-${prevC}`];
                            if (prevInp) {
                                prevInp.focus();
                                prevInp.value = '';
                                checkGridState();
                            }
                        }
                    });
                    
                    inp.addEventListener('focus', () => { currentFocusCell = { row: r, col: c, element: inp }; });
                    inputElements[`${r}-${c}`] = inp;
                    div.appendChild(inp);
                } else {
                    div.className = 'cell';
                }
                container.appendChild(div);
            }
        }
    }

    function renderLinguisticClues() {
        const acrossBox = document.getElementById('across-clues');
        const downBox = document.getElementById('down-clues');
        acrossBox.innerHTML = '';
        downBox.innerHTML = '';

        activeWords.forEach(item => {
            let div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `<div><strong>${item.num}</strong> ${item.c}</div>`;
            if(item.dir === "across") acrossBox.appendChild(div);
            else downBox.appendChild(div);
        });
    }

    function giveLetterHint() {
        if(currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            currentFocusCell.element.value = gridMatrix[currentFocusCell.row][currentFocusCell.col].letter;
            currentFocusCell.element.focus();
            checkGridState();
        }
    }

    function checkGridState() {
        let accurate = true;
        let cellsTested = 0;
        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                if(gridMatrix[r][c]) {
                    cellsTested++;
                    if(inputElements[`${r}-${c}`].value !== gridMatrix[r][c].letter) accurate = false;
                }
            }
        }
        if(accurate && cellsTested > 0) {
            const tbody = document.getElementById('corpus-table-body');
            tbody.innerHTML = '';
            activeWords.forEach(item => {
                let row = document.createElement('tr');
                row.innerHTML = `<td style="font-weight:bold;">${item.w}</td><td>${item.c}</td>`;
                tbody.appendChild(row);
            });
            document.getElementById('corpus-index-area').style.display = 'block';
        }
    }

    changeLanguage();
</script>
</body>
</html>
