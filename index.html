<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polyglot Comparative Matrix Engine v16.0</title>
    <style>
        :root {
            --bg-main: #f8f9fa;
            --text-main: #212529;
            --border-color: #ced4da;
            --accent-blue: #004085;
            --cell-size: 42px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }
        
        .concept-badge {
            display: inline-block;
            background: #e2e3e5;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
            text-transform: uppercase;
            border-left: 4px solid var(--accent-blue);
        }

        /* Kontrol Paneli */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #fff;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }
        select, button { width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border-color); background: #fff; outline: none; }
        button.btn-primary { background: var(--text-main); color: #fff; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button.btn-primary:hover { background: #343a40; }

        /* Çalışma Alanı */
        .workspace { display: none; grid-template-columns: 1.2fr 1fr; gap: 20px; }

        @media (max-width: 850px) { .workspace { grid-template-columns: 1fr; } }

        .matrix-holder {
            background: #fff; border: 1px solid var(--border-color); padding: 15px;
            overflow-x: auto; display: flex; justify-content: center; align-items: center;
        }

        .grid { display: grid; gap: 1px; background: var(--border-color); padding: 1px; }
        .cell { width: var(--cell-size); height: var(--cell-size); background: #fff; position: relative; }
        .cell.empty { background: #e9ecef; }

        .cell input {
            width: 100%; height: 100%; border: none; text-align: center;
            font-size: 16px; font-weight: bold; text-transform: uppercase; outline: none;
            padding: 0; background: transparent;
        }
        .cell input:focus { background: #fff3cd; }
        .cell-num { position: absolute; top: 2px; left: 3px; font-size: 9px; color: #6c757d; font-weight: bold; z-index: 2; }

        /* Mobil Optimizasyon */
        @media (max-width: 500px) {
            :root { --cell-size: 8.2vw; }
            .cell input { font-size: 13px; }
        }

        /* İpuçları Paneli */
        .clues-holder { background: #fff; border: 1px solid var(--border-color); padding: 20px; }
        .clue-section h3 { margin-top: 0; border-bottom: 1px solid var(--text-main); padding-bottom: 5px; font-size: 16px; }
        .clue-list { list-style: none; padding: 0; margin-bottom: 20px; }
        .clue-item { font-size: 13px; margin-bottom: 12px; line-height: 1.4; padding-bottom: 6px; border-bottom: 1px dotted var(--border-color); }
        .clue-item strong { background: #e2e3e5; padding: 2px 6px; margin-right: 5px; border-radius: 3px; }

        /* Karşılaştırmalı Dil İndeksi */
        .polyglot-index { margin-top: 20px; background: #fff; border: 1px solid var(--border-color); padding: 20px; display: none; }
        .polyglot-index h2 { margin-top: 0; font-size: 18px; color: #004085; }
        .analysis-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .analysis-table th, .analysis-table td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
        .analysis-table th { background: #f1f3f5; }
    </style>
</head>

                    { w: "WIDERSPRUCH", lang: "DE (Almanca)", c: "Almanca karşı söylem, çelişme durumu. | Örnek: 'Das steht im Widerspruch zu unseren Prinzipien.'" },
                    { w: "CONTRADICTION", lang: "FR (Fransızca)", c: "Fransızca mantıksal tezat, tutarsızlık. | Örnek: 'Résoudre cette contradiction apparente.'" }
                ]
            },
            {
                concept: "ÇEŞİTLİLİK / DIVERSITY",
                words: [
                    { w: "DIVERSITY", lang: "EN (İngilizce)", c: "Kültürel veya biyolojik çok seslilik/çeşitlilik. | Örnek: 'Linguistic diversity enriches human heritage.'" },
                    { w: "VARIEDAD", lang: "ES (İspanyolca)", c: "İspanyolca çeşitlilik, çok renklilik. | Örnek: 'La Amazonía tiene una gran variedad de especies.'" },
                    { w: "VIELFALT", lang: "DE (Almanca)", c: "Almanca çokluk, rengarenklik, geniş yelpaze. | Örnek: 'Die kulturelle Vielfalt einer modernen Gesellschaft.'" },
                    { w: "DIVERSITE", lang: "FR (Fransızca)", c: "Fransızca sosyolojik veya doğal çeşitlilik faktörü. | Örnek: 'Protéger la diversité des écosystèmes.'" }
                ]
            },
            {
                concept: "GEÇİCİLİK / TRANSIENCE",
                words: [
                    { w: "EPHEMERAL", lang: "EN (İngilizce)", c: "Kısa ömürlü, anlık, geçici estetik. | Örnek: 'Fame is often ephemeral and unstable.'" },
                    { w: "EFIMERO", lang: "ES (İspanyolca)", c: "İspanyolca saman alevi gibi geçici olan durum. | Örnek: 'El éxito material es efimero e ilusorio.'" },
                    { w: "VERGÄNGLICH", lang: "DE (Almanca)", c: "Almanca ölümlü, zamanla yok olan dünya varlığı. | Örnek: 'Schönheit ist vergänglich, aber Charakter bleibt.'" },
                    { w: "EPHEMERE", lang: "FR (Fransızca)", c: "Fransızca kalıcı olmayan, anlık parlayıp sönen. | Örnek: 'Une joie éphémère gâchée par la réalité.'" }
                ]
            },
            {
                concept: "EGEMENLİK / SOVEREIGNTY",
                words: [
                    { w: "AUTONOMY", lang: "EN (İngilizce)", c: "Özgür iradeyle kendi kendini yönetme özerkliği. | Örnek: 'Universities need intellectual autonomy.'" },
                    { w: "AUTONOMIA", lang: "ES (İspanyolca)", c: "İspanyolca bağımsız karar mekanizması, özerklik. | Örnek: 'El banco merkezi requiere autonomia total.'" },
                    { w: "SOUVERÄNITÄT", lang: "DE (Almanca)", c: "Almanca devlet veya birey düzeyindeki üstün egemenlik. | Örnek: 'Die Souveränität des Staates darf nicht verletzt werden.'" },
                    { w: "SOUVERAINETE", lang: "FR (Fransızca)", c: "Fransızca bağımsız egemenlik gücü hakareti. | Örnek: 'Défendre la souveraineté nationale avec rigueur.'" }
                ]
            }
        ]
    };

    let gSize = 14;
    let activeDataset = [];
    let gridData = [];
    let inputsRef = {};

    function initPolyglotEngine() {
        document.getElementById('analysisPanel').style.display = 'none';
        document.getElementById('mainWorkspace').style.display = 'grid';
        
        const lvl = document.getElementById('levelSelect').value;
        const setsPool = POLYGLOT_SETS[lvl];

        // TALEP EDİLEN ALGORİTMA: Tam 5 kez üst üste karıştırma döngüsü (5x Shuffling)
        let selectedSet;
        for (let loop = 0; loop < 5; loop++) {
            setsPool.sort(() => 0.5 - Math.random());
            selectedSet = setsPool[Math.floor(Math.random() * setsPool.length)];
        }
        
        document.getElementById('activeConceptDisplay').innerText = `KAVRAM KÖPRÜSÜ: ${selectedSet.concept}`;
        
        activeDataset = JSON.parse(JSON.stringify(selectedSet.words));

        // Sabit akıllı geometrik yönlendirme (2 Yatay, 2 Dikey kesişim ağı)
        activeDataset[0].dir = "across";
        activeDataset[1].dir = "down";
        activeDataset[2].dir = "across";
        activeDataset[3].dir = "down";

        gridData = Array(gSize).fill(null).map(() => Array(gSize).fill(null));
        inputsRef = {};

        // Geometrik Kilitlenme Noktaları
        let w1 = activeDataset[0];
        let r1 = 5, c1 = 2;
        for(let i=0; i<w1.w.length; i++) {
            gridData[r1][c1+i] = { letter: w1.w[i], num: i===0 ? 1 : null };
        }
        w1.num = 1;

        let w2 = activeDataset[1];
        let r2 = 2, c2 = Math.min(gSize - 1, c1 + 3);
        for(let i=0; i<w2.w.length; i++) {
            if(r2+i < gSize) {
                if(!gridData[r2+i][c2]) gridData[r2+i][c2] = { letter: w2.w[i], num: i===0 ? 2 : null };
                else if(i===0) gridData[r2+i][c2].num = 2;
            }
        }
        w2.num = 2;

        let w3 = activeDataset[2];
        let r3 = Math.min(gSize - 1, r2 + 4), c3 = Math.max(0, c2 - 2);
        for(let i=0; i<w3.w.length; i++) {
            if(c3+i < gSize) {
                if(!gridData[r3][c3+i]) gridData[r3][c3+i] = { letter: w3.w[i], num: i===0 ? 3 : null };
                else if(i===0) gridData[r3][c3+i].num = 3;
            }
        }
        w3.num = 3;

        let w4 = activeDataset[3];
        let r4 = Math.max(0, r3 - 2), c4 = Math.min(gSize - 1, c3 + 4);
        for(let i=0; i<w4.w.length; i++) {
            if(r4+i < gSize) {
                if(!gridData[r4+i][c4]) gridData[r4+i][c4] = { letter: w4.w[i], num: i===0 ? 4 : null };
                else if(i===0) gridData[r4+i][c4].num = 4;
            }
        }
        w4.num = 4;

        renderGrid();
        renderClues();
    }

    function renderGrid() {
        const gridEl = document.getElementById('lexicalGrid');
        gridEl.innerHTML = '';
        gridEl.style.gridTemplateColumns = `repeat(${gSize}, var(--cell-size))`;

        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                const node = gridData[r][c];
                const cellDiv = document.createElement('div');

                if(node) {
                    cellDiv.className = 'cell';
                    if(node.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = node.num;
                        cellDiv.appendChild(numSpan);
                    }
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.setAttribute('autocomplete', 'off');
                    input.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                        checkMatrixStatus();
                    });
                    inputsRef[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell empty';
                }
                gridEl.appendChild(cellDiv);
            }
        }
    }

    function renderClues() {
        const acrossUl = document.getElementById('acrossClues');
        const downUl = document.getElementById('downClues');
        acrossUl.innerHTML = '';
        downUl.innerHTML = '';

        activeDataset.forEach(item => {
            const li = document.createElement('li');
            li.className = 'clue-item';
            li.innerHTML = `<strong>${item.num} [${item.lang}]</strong> ${item.c.split('|')[0]}`;
            
            if(item.dir === "across") acrossUl.appendChild(li);
            else downUl.appendChild(li);
        });
    }

    function checkMatrixStatus() {
        let allCorrect = true;
        let filledCount = 0;

        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                if(gridData[r][c]) {
                    filledCount++;
                    const userVal = inputsRef[`${r}-${c}`].value.trim().toUpperCase();
                    if(userVal !== gridData[r][c].letter.toUpperCase()) {
                        allCorrect = false;
                    }
                }
            }
        }

        if(allCorrect && filledCount > 0) {
            showAnalysisPanel();
        }
    }

    function showAnalysisPanel() {
        const rowsEl = document.getElementById('analysisRows');
        rowsEl.innerHTML = '';

        activeDataset.forEach(item => {
            const tr = document.createElement('tr');
            const exampleSentence = item.c.split('|')[1] || "Veri yüklenemedi.";

            tr.innerHTML = `
                <td style="font-weight:bold; color:var(--accent-blue);">${item.lang}</td>
                <td style="font-weight:bold; text-transform:uppercase; letter-spacing:1px;">${item.w}</td>
                <td>${exampleSentence}</td>
            `;
            rowsEl.appendChild(tr);
        });

        document.getElementById('analysisPanel').style.display = 'block';
        document.getElementById('analysisPanel').scrollIntoView({ behavior: 'smooth' });
    }
</script>
