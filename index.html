<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Leksikal Workbench v10.0 - Optimize</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f7f5f0;
            --container-bg: #ffffff;
            --text-color: #2b2b2b;
            --border-color: #2b2b2b;
            --accent-bg: #f0ede5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .welcome-screen {
            max-width: 750px;
            margin: 40px auto;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px;
            text-align: center;
        }

        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin: 0 0 10px 0;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .start-action-btn {
            font-family: 'Courier Prime', monospace;
            font-size: 15px;
            font-weight: bold;
            background-color: var(--text-color);
            color: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 14px 35px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            max-width: 380px;
        }

        .start-action-btn:hover {
            background-color: var(--accent-bg);
            color: var(--text-color);
        }

        .quick-settings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: left;
            border-top: 1px solid var(--accent-bg);
            padding-top: 25px;
        }

        @media (max-width: 650px) {
            .quick-settings-grid { grid-template-columns: 1fr; }
        }

        .setting-card {
            background: var(--accent-bg);
            padding: 12px;
            border-radius: 4px;
        }

        .setting-card label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .setting-card select {
            width: 100%;
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            padding: 6px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            color: var(--text-color);
        }

        .main-workspace {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            border: 2px solid var(--border-color);
            padding: 25px;
            background-color: var(--container-bg);
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px;
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin: 0;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--accent-bg);
            border-radius: 4px;
        }

        .btn-prime {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--text-color);
            color: var(--container-bg);
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .workspace-layout {
            display: flex;
            gap: 25px;
        }

        @media (max-width: 950px) {
            .workspace-layout { flex-direction: column; }
        }

        .matrix-section {
            flex: 1.3;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            min-height: 540px;
            border-radius: 4px;
            overflow: auto;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--border-color);
            padding: 1px;
        }

        .cell {
            background-color: transparent;
            position: relative;
            width: 38px;
            height: 38px;
        }

        .cell.active { background-color: #ffffff; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
            background: transparent;
            color: #000000;
        }

        .cell input:focus { background-color: #fffacd !important; outline: none; }

        .cell-num {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 9px;
            font-weight: bold;
            color: #333;
            z-index: 2;
        }

        .corpus-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .clue-block {
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            padding: 15px;
            border-radius: 4px;
        }

        .clue-block h3 {
            margin: 0 0 10px 0;
            font-size: 11px;
            text-transform: uppercase;
            background: var(--border-color);
            color: var(--container-bg);
            padding: 3px 8px;
            display: inline-block;
            border-radius: 2px;
        }

        .clue-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.4;
            padding-bottom: 8px;
            border-bottom: 1px dotted var(--border-color);
        }

        .clue-text { flex: 1; padding-right: 8px; }
        .clue-text strong { background: var(--accent-bg); padding: 0 5px; margin-right: 6px; border-radius: 2px; }

        .corpus-index-wrapper {
            margin-top: 25px;
            border-top: 2px dashed var(--border-color);
            padding-top: 20px;
            display: none;
        }

        .corpus-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }

        .corpus-table th, .corpus-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .corpus-table th { background-color: var(--accent-bg); text-transform: uppercase; }
    </style>
</head>
<body>

<div class="welcome-screen" id="launcher-area">
    <h1 class="welcome-title">Polyglot Leksikal Workbench v10.0</h1>
    <p style="font-size: 13px; opacity: 0.7;">Optimize Harf Kesişimli Dil Öğrenim Matrisi</p>

    <div class="action-group">
        <button class="start-action-btn" onclick="launchWorkspace()">Matrisi Yükle</button>
        <button class="start-action-btn" style="background: transparent; color: var(--text-color); border: 2px dashed var(--border-color);" onclick="launchRandomized()">🎲 Rastgele Dil & Stil Seç</button>
    </div>

    <div class="quick-settings-grid">
        <div class="setting-card">
            <label for="langSelect">Hedef Dil</label>
            <select id="langSelect">
                <option value="en">English (İngilizce)</option>
                <option value="es">Español (İspanyolca)</option>
                <option value="de">Deutsch (Almanca)</option>
                <option value="fr">Français (Fransızca)</option>
            </select>
        </div>

        <div class="setting-card">
            <label for="topicSelect">Kelime Grubu</label>
            <select id="topicSelect">
                <option value="academic">🎓 Entelektüel & Akademik</option>
                <option value="lifestyle">🌍 Kültür & Günlük Yaşam</option>
            </select>
        </div>

        <div class="setting-card">
            <label for="themeSelect">Görsel Tema</label>
            <select id="themeSelect" onchange="applyTheme()"></select>
        </div>
    </div>
</div>

<div class="main-workspace" id="workspace-area">
    <header>
        <h1>Leksikal Matris Masası</h1>
        <span id="lbl-theme-badge" style="font-size: 11px; text-transform: uppercase; opacity: 0.7;"></span>
    </header>

    <div class="control-panel">
        <button class="btn-prime" onclick="returnToLauncher()">⬅ Menü</button>
        <div>
            <button class="btn-prime" onclick="generateNextMatrix()">Yeni Set Filtrele</button>
            <button class="btn-prime" onclick="giveLetterHint()" style="background: var(--accent-bg); color: var(--text-color); margin-left: 5px;">Harf İpucu</button>
        </div>
    </div>

    <div class="workspace-layout">
        <div class="matrix-section">
            <div class="crossword-grid" id="grid-container"></div>
        </div>
        <div class="corpus-section">
            <div class="clue-block">
                <h3>Yatay (Across)</h3>
                <div id="across-clues"></div>
            </div>
            <div class="clue-block">
                <h3>Dikey (Down)</h3>
                <div id="down-clues"></div>
            </div>
        </div>
    </div>

    <div class="corpus-index-wrapper" id="corpus-index-area">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 20px; margin: 0; color: #1b5e20;">✓ Matris Çözüldü: Dil İndeksi</h2>
        <table class="corpus-table">
            <thead>
                <tr>
                    <th>Sözcük (Lexeme)</th>
                    <th>Bağlamsal Eğitim Notu</th>
                </tr>
            </thead>
            <tbody id="corpus-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const THEMES = [
        { bg: "#f7f5f0", container: "#ffffff", text: "#2b2b2b", border: "#2b2b2b", accent: "#f0ede5" },
        { bg: "#1a1a1a", container: "#262626", text: "#f5f5f5", border: "#404040", accent: "#333333" },
        { bg: "#e6d7b8", container: "#f2e6ce", text: "#3d2b1f", border: "#5c4033", accent: "#dfcfad" },
        { bg: "#e4e9ed", container: "#f4f7f9", text: "#1c2833", border: "#2c3e50", accent: "#d5dbdb" }
    ];

    // DOĞRULANMIŞ STRÜKTÜREL VERİ SETİ (Kesişimi Kolaylaştıran Seçkin Kelimeler)
    const LEXICON_DATABASE = {
        academic: {
            en: [
                { w: "CONTEXT", c: "The parts of a discourse that surround a word or passage and can throw light on its meaning. | TR: Bağlam" },
                { w: "THEORY", c: "A plausible or scientifically acceptable general principle offered to explain phenomena. | TR: Teori" },
                { w: "METHOD", c: "A systematic procedure, technique, or mode of inquiry employed by a discipline. | TR: Yöntem" },
                { w: "SOURCE", c: "A primary reference point or document from which info is gathered. | TR: Kaynak" },
                { w: "LOGIC", c: "A science that deals with the principles and criteria of validity of inference and demonstration. | TR: Mantık" }
            ],
            es: [
                { w: "CONTEXTO", c: "Entorno lingüístico del cual depende el sentido u valor de una palabra o frase. | TR: Bağlam" },
                { w: "TEORIA", c: "Red de leyes científicas que sirven para relacionar y explicar un orden de hechos. | TR: Teori" },
                { w: "METODO", c: "Procedimiento ordenado que se sigue para establecer el significado de la verdad. | TR: Yöntem" },
                { w: "FUENTE", c: "Documento, obra o materiales que sirven de información directa. | TR: Kaynak" },
                { w: "LOGICA", c: "Método o disposición con que se cursan las cosas con coherencia. | TR: Mantık" }
            ],
            de: [
                { w: "KONTEXT", c: "Der gedankliche oder textuelle Zusammenhang, in dem eine Äußerung steht. | TR: Bağlam" },
                { w: "THEORIE", c: "System von abstrakten Sätzen, das Erkenntnisse über einen Bereich ordnet. | TR: Teori" },
                { w: "METHODE", c: "Planmäßiges, systematisches Vorgehen zur Erreichung eines bestimmten Ziels. | TR: Yöntem" },
                { w: "QUELLE", c: "Ursprung, Basisdokument oder Gewährsmann von historischen Erkenntnissen. | TR: Kaynak" },
                { w: "LOGIK", c: "Strikte Folgerichtigkeit des Denkens oder der Argumentation. | TR: Mantık" }
            ],
            fr: [
                { w: "CONTEXTE", c: "Ensemble des circonstances dans lesquelles s'insère un fait ou un énoncé. | TR: Bağlam" },
                { w: "THEORIE", c: "Système conceptuel organisé sur lequel se fonde l'explication d'un ordre de faits. | TR: Teori" },
                { w: "METHODE", c: "Marche rationnelle de l'esprit pour arriver à la vérité dans les sciences. | TR: Yöntem" },
                { w: "SOURCE", c: "Texte, document ou témoignage original apportant des données brutes. | TR: Kaynak" },
                { w: "LOGIQUE", c: "Conformité aux règles du raisonnement, rigueur intellectuelle. | TR: Mantık" }
            ]
        },
        lifestyle: {
            en: [
                { w: "JOURNEY", c: "An act of traveling from one place to another, full of experiences. | TR: Yolculuk" },
                { w: "NATURE", c: "The physical world including plants, animals, landscapes, and natural forces. | TR: Doğa" },
                { w: "HEALTH", c: "The optimal state of physical, mental, and social well-being. | TR: Sağlık" },
                { w: "FAMILY", c: "A fundamental social group consisting minimally of parents and children. | TR: Aile" },
                { w: "WONDER", c: "A feeling of surprise mingled with admiration, caused by something beautiful. | TR: Harika / Mucize" }
            ],
            es: [
                { w: "NATURALEZA", c: "Conjunto de todo lo que forma el universo en que no interviene el hombre. | TR: Doğa" },
                { w: "VIAJE", c: "Acción y efecto de trasladarse de un punto de origen a un destino lejano. | TR: Yolculuk" },
                { w: "SALUD", c: "Estado de completo bienestar físico, mental y social de una persona. | TR: Sağlık" },
                { w: "FAMILIA", c: "Grupo de personas ligadas por vínculos de parentesco o sangre. | TR: Aile" },
                { w: "MUNDO", c: "La totalidad de los seres humanos, la sociedad o la Tierra misma. | TR: Dünya" }
            ],
            de: [
                { w: "REISE", c: "Die Fahrt oder der Flug an einen Ort, um ihn kennenzulernen. | TR: Yolculuk" },
                { w: "NATUR", c: "Die vom Menschen unberührte oder nicht geschaffene Biosphäre. | TR: Doğa" },
                { w: "GESUNDHEIT", c: "Freisein von körperlichen Beeinträchtigungen und Krankheiten. | TR: Sağlık" },
                { w: "FAMILIE", c: "Die kleinste Lebensgemeinschaft in einer modernen Gesellschaft. | TR: Aile" },
                { w: "WELT", c: "Das Universum oder unser bewohnbarer Himmelskörper. | TR: Dünya" }
            ],
            fr: [
                { w: "VOYAGE", c: "Action de parcourir de longues distances par curiosité ou plaisir. | TR: Yolculuk" },
                { w: "NATURE", c: "Le monde réel, l'univers non modifié par l'activité technique. | TR: Doğa" },
                { w: "SANTE", c: "Équilibre fonctionnel de l'organisme humain, vitalité globale. | TR: Sağlık" },
                { w: "FAMILLE", c: "Institution sociale regroupant les parents et leurs descendants. | TR: Aile" },
                { w: "MONDE", c: "La planète Terre, l'espace habité par la communauté humaine. | TR: Dünya" }
            ]
        }
    };

    // Dinamik Havuz Tamamlayıcı (Toplam 50 Kelimelik Güvenli Küme Yapısı)
    ["academic", "lifestyle"].forEach(topic => {
        Object.keys(LEXICON_DATABASE[topic]).forEach(lang => {
            let coreFillers = ["DATA", "MIND", "WORLD", "LIFE", "TIME", "PEACE", "TRUTH", "NODE", "BASE", "CODE", "FLOW", "CORE", "VIEW", "LINK", "TEXT", "PAGE", "UNIT", "FILE", "USER", "TASK", "PATH", "MARK", "SIGN", "GRID", "CELL", "ITEM", "LIST", "FORM", "WORD", "TERM", "NOTE", "BOOK", "MAP", "PLAN", "RULE", "LAW", "FACT", "CASE", "TEST", "GOAL", "ZONE", "AREA", "PART", "SIDE", "LINE", "WAVE", "ICON"];
            while(LEXICON_DATABASE[topic][lang].length < 50) {
                let currentLen = LEXICON_DATABASE[topic][lang].length;
                let activeWord = coreFillers[currentLen] || "LEXEME" + currentLen;
                LEXICON_DATABASE[topic][lang].push({
                    w: activeWord,
                    c: `Linguistic unit targeted for vocabulary reinforcement [Item #${currentLen+1}]. | TR: Kelime dağarcığı geliştirme odağı.`
                });
            }
        });
    });

    let matrixSize = 14;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let currentFocusCell = null;
    let currentCycleStep = 0;

    window.onload = function() {
        const select = document.getElementById('themeSelect');
        THEMES.forEach((t, idx) => {
            let opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = `Stil Paleti ${idx + 1}`;
            select.appendChild(opt);
        });
        applyTheme();
    };

    function applyTheme() {
        const idx = document.getElementById('themeSelect').value || 0;
        const theme = THEMES[idx];
        document.documentElement.style.setProperty('--bg-color', theme.bg);
        document.documentElement.style.setProperty('--container-bg', theme.container);
        document.documentElement.style.setProperty('--text-color', theme.text);
        document.documentElement.style.setProperty('--border-color', theme.border);
        document.documentElement.style.setProperty('--accent-bg', theme.accent);
        document.getElementById('lbl-theme-badge').innerText = `Palet Sürümü: ${Number(idx)+1}/${THEMES.length}`;
    }

    function launchRandomized() {
        const languages = ["en", "es", "de", "fr"];
        const topics = ["academic", "lifestyle"];
        document.getElementById('langSelect').value = languages[Math.floor(Math.random() * languages.length)];
        document.getElementById('topicSelect').value = topics[Math.floor(Math.random() * topics.length)];
        document.getElementById('themeSelect').value = Math.floor(Math.random() * THEMES.length);
        applyTheme();
        currentCycleStep = Math.floor(Math.random() * 10);
        launchWorkspace();
    }

    function launchWorkspace() {
        document.getElementById('launcher-area').style.display = 'none';
        document.getElementById('workspace-area').style.display = 'block';
        buildCrosswordMatrix();
    }

    function returnToLauncher() {
        document.getElementById('workspace-area').style.display = 'none';
        document.getElementById('launcher-area').style.display = 'block';
    }

    function generateNextMatrix() {
        currentCycleStep = (currentCycleStep + 1) % 10;
        buildCrosswordMatrix();
    }

    // ADJACENCY-AWARE (KOMŞULUK ALARM SİSTEMLİ) SIKI BULMACA MOTORU
    function buildCrosswordMatrix() {
        document.getElementById('corpus-index-area').style.display = 'none';
        const lang = document.getElementById('langSelect').value;
        const topic = document.getElementById('topicSelect').value;
        const pool = LEXICON_DATABASE[topic][lang];
        
        let startIdx = (currentCycleStep * 5) % pool.length;
        let subset = [];
        for(let i=0; i<5; i++) {
            subset.push(pool[(startIdx + i) % pool.length]);
        }

        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        activeWords = [];

        // 1. Kelime: Tam Yatay Merkez (Temel Çapa)
        let first = subset[0];
        let fRow = 6, fCol = Math.floor((matrixSize - first.w.length) / 2);
        for(let i=0; i<first.w.length; i++) {
            localMatrix[fRow][fCol + i] = { letter: first.w[i], isStart: i===0, num: 1, dir: "across" };
        }
        activeWords.push({ w: first.w, c: first.c, row: fRow, col: fCol, dir: "across", num: 1 });

        let globalCounter = 2;

        // Kalan 4 Kelime İçin Maksimum Kesişim ve Çeper Güvenlik Taraması
        for(let w=1; w<subset.length; w++) {
            let item = subset[w];
            let placed = false;

            // Önce mevcut harflerle kesişme yollarını dene (Sıkı Bulmaca Yapısı İçin)
            for(let r=0; r<matrixSize && !placed; r++) {
                for(let c=0; c<matrixSize && !placed; c++) {
                    if(localMatrix[r][c] !== null) {
                        let matchLetter = localMatrix[r][c].letter;
                        let matchIdx = item.w.indexOf(matchLetter);

                        if(matchIdx !== -1) {
                            // Mevcut yönün tersine yerleşim denemesi (Yatay ise Dikey, Dikey ise Yatay)
                            let currentCellDir = localMatrix[r][c].dir || "across";
                            let nextDir = currentCellDir === "across" ? "down" : "across";

                            let startR = nextDir === "down" ? r - matchIdx : r;
                            let startC = nextDir === "down" ? c : c - matchIdx;

                            if(validateCellSurroundings(item.w, startR, startC, nextDir, localMatrix, r, c)) {
                                for(let i=0; i<item.w.length; i++) {
                                    let currR = nextDir === "down" ? startR + i : startR;
                                    let currC = nextDir === "down" ? startC : startC + i;

                                    if(!localMatrix[currR][currC]) {
                                        localMatrix[currR][currC] = { letter: item.w[i], isStart: i===0, num: i===0 ? globalCounter : null, dir: nextDir };
                                    } else if(i===0) {
                                        localMatrix[currR][currC].num = globalCounter;
                                    }
                                }
                                activeWords.push({ w: item.w, c: item.c, row: startR, col: startC, dir: nextDir, num: globalCounter++ });
                                placed = true;
                            }
                        }
                    }
                }
            }

            // Kesişim alanı daralırsa matrisin bozulmaması için güvenli paralel koridora al
            if(!placed) {
                let altRow = (w * 3) % (matrixSize - 2) + 1;
                if(Math.abs(altRow - fRow) < 2) altRow = fRow + 3;
                let altCol = 2;
                if(validateCellSurroundings(item.w, altRow, altCol, "across", localMatrix, -1, -1)) {
                    for(let i=0; i<item.w.length; i++) {
                        localMatrix[altRow][altCol + i] = { letter: item.w[i], isStart: i===0, num: i===0 ? globalCounter : null, dir: "across" };
                    }
                    activeWords.push({ w: item.w, c: item.c, row: altRow, col: altCol, dir: "across", num: globalCounter++ });
                }
            }
        }

        renderVisualGrid(localMatrix);
        renderLinguisticClues();
    }

    function validateCellSurroundings(word, startR, startC, dir, matrix, intR, intC) {
        if(startR < 0 || startC < 0) return false;
        if(dir === "down" && startR + word.length > matrixSize) return false;
        if(dir === "across" && startC + word.length > matrixSize) return false;

        for(let i=0; i<word.length; i++) {
            let r = dir === "down" ? startR + i : startR;
            let c = dir === "down" ? startC : startC + i;

            // Kesişim noktası ise çakışma kontrolünü atla (Çünkü harfler zaten uyuşuyor)
            if(r === intR && c === intC) continue;
            if(matrix[r][c] !== null && matrix[r][c].letter !== word[i]) return false;

            // Çeper Kontrolü (Harflerin yan yana yapışıp okunurluğu bozmasını engeller)
            if(matrix[r][c] === null) {
                if(dir === "down") {
                    if(c > 0 && matrix[r][c-1] !== null) return false;
                    if(c < matrixSize - 1 && matrix[r][c+1] !== null) return false;
                    if(i === 0 && r > 0 && matrix[r-1][c] !== null) return false; // Kelime önü boşluk
                    if(i === word.length - 1 && r < matrixSize - 1 && matrix[r+1][c] !== null) return false; // Kelime arkası boşluk
                } else {
                    if(r > 0 && matrix[r-1][c] !== null) return false;
                    if(r < matrixSize - 1 && matrix[r+1][c] !== null) return false;
                    if(i === 0 && c > 0 && matrix[r][c-1] !== null) return false; // Kelime solu boşluk
                    if(i === word.length - 1 && c < matrixSize - 1 && matrix[r][c+1] !== null) return false; // Kelime sağı boşluk
                }
            }
        }
        return true;
    }

    function renderVisualGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 38px)`;
        inputElements = {};

        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                const cell = matrixData[r][c];
                const div = document.createElement('div');
                if(cell) {
                    div.className = 'cell active';
                    if(cell.num) {
                        let ns = document.createElement('span');
                        ns.className = 'cell-num';
                        ns.innerText = cell.num;
                        div.appendChild(ns);
                    }
                    let inp = document.createElement('input');
                    inp.type = 'text';
                    inp.maxLength = 1;
                    
                    // Gelişmiş Klavye ve Akıcı Odak Yönetimi
                    inp.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                        checkGridState();
                        if(e.target.value.length === 1) {
                            focusNextInput(r, c, cell.dir);
                        }
                    });
                    
                    inp.addEventListener('focus', () => { currentFocusCell = { row: r, col: c, element: inp }; });
                    inputElements[`${r}-${c}`] = inp;
                    div.appendChild(inp);
                } else {
                    div.className = 'cell';
                }
                container.appendChild(div);
            }
        }
    }

    function focusNextInput(row, col, direction) {
        let nextR = direction === "down" ? row + 1 : row;
        let nextC = direction === "down" ? col : col + 1;
        let nextInp = inputElements[`${nextR}-${nextC}`];
        if(nextInp) nextInp.focus();
    }

    function renderLinguisticClues() {
        const acrossBox = document.getElementById('across-clues');
        const downBox = document.getElementById('down-clues');
        acrossBox.innerHTML = '';
        downBox.innerHTML = '';

        activeWords.forEach(item => {
            let div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `<div class="clue-text"><strong>${item.num}</strong> ${item.c}</div>`;
            if(item.dir === "across") acrossBox.appendChild(div);
            else downBox.appendChild(div);
        });
    }

    function giveLetterHint() {
        if(currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            currentFocusCell.element.value = gridMatrix[currentFocusCell.row][currentFocusCell.col].letter;
            checkGridState();
        }
    }

    function checkGridState() {
        let accurate = true;
        let cellsTested = 0;
        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                if(gridMatrix[r][c]) {
                    cellsTested++;
                    if(inputElements[`${r}-${c}`].value !== gridMatrix[r][c].letter) accurate = false;
                }
            }
        }
        if(accurate && cellsTested > 0) {
            const tbody = document.getElementById('corpus-table-body');
            tbody.innerHTML = '';
            activeWords.forEach(item => {
                let row = document.createElement('tr');
                row.innerHTML = `<td style="font-weight:bold; color:#1b5e20; letter-spacing:1px;">${item.w}</td><td>${item.c}</td>`;
                tbody.appendChild(row);
            });
            document.getElementById('corpus-index-area').style.display = 'block';
            document.getElementById('corpus-index-area').scrollIntoView({ behavior: 'smooth' });
        }
    }
</script>

</html>
