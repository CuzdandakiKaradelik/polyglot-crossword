<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Lexical Systems v12.0</title>
    <style>
        :root {
            --bg-main: #f8f9fa;
            --text-main: #212529;
            --border-color: #ced4da;
            --accent-blue: #004085;
            --cell-size: 40px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        /* Kontrol Paneli */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #fff;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        select, button {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            background: #fff;
        }

        button.btn-primary {
            background: var(--text-main);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        button.btn-primary:hover {
            background: #343a40;
        }

        /* Çalışma Alanı */
        .workspace {
            display: none;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .matrix-holder {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 20px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        .grid {
            display: grid;
            gap: 1px;
            background: var(--border-color);
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background: #fff;
            position: relative;
        }

        .cell.empty {
            background: #e9ecef;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
        }

        .cell input:focus {
            background: #fff3cd;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 9px;
            color: #6c757d;
            font-weight: bold;
        }

        /* İpuçları Paneli */
        .clues-holder {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .clue-section h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 5px;
            font-size: 16px;
        }

        .clue-list {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }

        .clue-item {
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .clue-item strong {
            background: #e2e3e5;
            padding: 2px 6px;
            margin-right: 5px;
            border-radius: 3px;
        }

        /* Polyglot Bilgi Kartı (Sözlük) */
        .polyglot-index {
            margin-top: 20px;
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: none;
        }

        .polyglot-index h2 {
            margin-top: 0;
            font-size: 18px;
            color: #2b542c;
        }

        .analysis-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .analysis-table th, .analysis-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
        }

        .analysis-table th {
            background: #f1f3f5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>POLYGLOT LEXICAL MATRIX</h1>
    </header>

    <!-- Kontrol Ünitesi -->
    <div class="control-panel">
        <div>
            <label>Seviye / Acquisition Level</label>
            <select id="levelSelect">
                <option value="intermediate">B1-B2: Functional & Fluency</option>
                <option value="advanced">C1-C2: Advanced Discourse & Idioms</option>
            </select>
        </div>
        <div>
            <label>Sistem Operasyonu</label>
            <button class="btn-primary" onclick="initPolyglotEngine()">Matrisi İnşa Et</button>
        </div>
    </div>

    <!-- Çalışma Alanı -->
    <div class="workspace" id="mainWorkspace">
        <div class="matrix-holder">
            <div class="grid" id="lexicalGrid"></div>
        </div>

        <div class="clues-holder">
            <div class="clue-section">
                <h3>Yatay / Across</h3>
                <ul class="clue-list" id="acrossClues"></ul>
            </div>
            <div class="clue-section">
                <h3>Dikey / Down</h3>
                <ul class="clue-list" id="downClues"></ul>
            </div>
        </div>
    </div>

    <!-- Gelişmiş Dil Analiz Paneli (Çözüldüğünde Açılır) -->
    <div class="polyglot-index" id="analysisPanel">
        <h2>✓ Yapısal Matris Çözüldü: Dil Bilgisi İndeksi</h2>
        <table class="analysis-table">
            <thead>
                <tr>
                    <th>Kelime / Kalıp</th>
                    <th>Dil</th>
                    <th>Bağlamsal Kullanım ve Canlı Cümle Örneği</th>
                </tr>
            </thead>
            <tbody id="analysisRows"></tbody>
        </table>
    </div>
</div>

<script>
    // Bir Dilcinin İhtiyaç Duyacağı Gerçek Fonksiyonel Kalıplar ve Cümle Yapıları
    const INTEL_DATABASE = {
        intermediate: [
            { w: "HOWEVER", lang: "EN (İngilizce)", c: "Zıtlık bağlacı. İki bağımsız cümleyi bağlar. | Örnek: 'The system is old; however, it works perfectly.'", dir:"across" },
            { w: "PROBABLE", lang: "EN (İngilizce)", c: "Yüksek ihtimal belirten sıfat. | Örnek: 'It is highly probable that the strategy will succeed.'", dir:"down" },
            { w: "SIN EMBARGO", lang: "ES (İspanyolca)", c: "İspanyolca zıtlık kalıbı (However). | Örnek: 'Estudió mucho; sin embargo, no aprobó el examen.'", dir:"across" },
            { w: "OBWOHL", lang: "DE (Almanca)", c: "Almanca '-e rağmen' yan cümle bağlacı. | Örnek: 'Obwohl es regnet, gehen wir im Park spazieren.'", dir:"down" }
        ],
        advanced: [
            { w: "COMPREHENSIVE", lang: "EN (İngilizce)", c: "Kapsamlı, detaylı. | Örnek: 'The researcher provided a comprehensive analysis of the linguistic shifts.'", dir:"across" },
            { w: "INHERENT", lang: "EN (İngilizce)", c: "Doğasında olan, içsel özellik. | Örnek: 'Language learning has an inherent complexity that requires patience.'", dir:"down" },
            { w: "POR DOQUIER", lang: "ES (İspanyolca)", c: "Her yerde, dört bir yanda (Deyimsel). | Örnek: 'Encontraron rastros de influence romana por doquier.'", dir:"across" },
            { w: "ZEITGEIST", lang: "DE (Almanca)", c: "Zamanın ruhu (Dünya dillerine de geçmiştir). | Örnek: 'Der Roman fängt den Zeitgeist der Jahrtausendwende perfekt ein.'", dir:"down" }
        ]
    };

    let gSize = 14;
    let activeDataset = [];
    let gridData = [];
    let inputsRef = {};

    function initPolyglotEngine() {
        document.getElementById('analysisPanel').style.display = 'none';
        document.getElementById('mainWorkspace').style.display = 'grid';
        
        const lvl = document.getElementById('levelSelect').value;
        activeDataset = INTEL_DATABASE[lvl];

        // Boş Matris Oluştur
        gridData = Array(gSize).fill(null).map(() => Array(gSize).fill(null));
        inputsRef = {};

        // Manuel Akıllı Kesişim Algoritması (Verileri Tam Kesişecek Noktalara Yerleştiriyoruz)
        // 1. Kelime (Yatay)
        let w1 = activeDataset[0];
        let r1 = 4, c1 = 2;
        for(let i=0; i<w1.w.length; i++) {
            gridData[r1][c1+i] = { letter: w1.w[i], num: i===0 ? 1 : null, item: w1 };
        }
        w1.realRow = r1; w1.realCol = c1; w1.num = 1;

        // 2. Kelime (Dikey - 1. kelimenin 5. harfinden kesişsin)
        let w2 = activeDataset[1];
        let r2 = 2, c2 = c1 + 4; // Kesişim noktası
        for(let i=0; i<w2.w.length; i++) {
            if(!gridData[r2+i][c2]) {
                gridData[r2+i][c2] = { letter: w2.w[i], num: i===0 ? 2 : null, item: w2 };
            } else if (i===0) {
                gridData[r2+i][c2].num = 2;
            }
        }
        w2.realRow = r2; w2.realCol = c2; w2.num = 2;

        // 3. Kelime (Yatay - 2. kelimenin alt kısımlarından türesin)
        let w3 = activeDataset[2];
        let r3 = r2 + 4, c3 = c2 - 2;
        // İçinde boşluk varsa (Sin Embargo gibi) matriste boşluksuz birleştiriyoruz
        let cleanW3 = w3.w.replace(/\s/g, "");
        w3.processedWord = cleanW3;
        for(let i=0; i<cleanW3.length; i++) {
            if(!gridData[r3][c3+i]) {
                gridData[r3][c3+i] = { letter: cleanW3[i], num: i===0 ? 3 : null, item: w3 };
            } else if(i===0) {
                gridData[r3][c3+i].num = 3;
            }
        }
        w3.realRow = r3; w3.realCol = c3; w3.num = 3;

        // 4. Kelime (Dikey - Diğer bir kanattan kesişim)
        let w4 = activeDataset[3];
        let r4 = r3 - 3, c4 = c3 + 1;
        for(let i=0; i<w4.w.length; i++) {
            if(!gridData[r4+i][c4]) {
                gridData[r4+i][c4] = { letter: w4.w[i], num: i===0 ? 4 : null, item: w4 };
            } else if(i===0) {
                gridData[r4+i][c4].num = 4;
            }
        }
        w4.realRow = r4; w4.realCol = c4; w4.num = 4;

        renderGrid();
        renderClues();
    }

    function renderGrid() {
        const gridEl = document.getElementById('lexicalGrid');
        gridEl.innerHTML = '';
        gridEl.style.gridTemplateColumns = `repeat(${gSize}, var(--cell-size))`;

        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                const node = gridData[r][c];
                const cellDiv = document.createElement('div');

                if(node) {
                    cellDiv.className = 'cell';
                    if(node.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = node.num;
                        cellDiv.appendChild(numSpan);
                    }
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                        checkMatrixStatus();
                    });
                    inputsRef[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell empty';
                }
                gridEl.appendChild(cellDiv);
            }
        }
    }

    function renderClues() {
        const acrossUl = document.getElementById('acrossClues');
        const downUl = document.getElementById('downClues');
        acrossUl.innerHTML = '';
        downUl.innerHTML = '';

        activeDataset.forEach(item => {
            const li = document.createElement('li');
            li.className = 'clue-item';
            li.innerHTML = `<strong>${item.num} [${item.lang}]</strong> ${item.c.split('|')[0]}`;
            
            if(item.dir === "across") acrossUl.appendChild(li);
            else downUl.appendChild(li);
        });
    }

    function checkMatrixStatus() {
        let allCorrect = true;
        let filledCount = 0;

        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                if(gridData[r][c]) {
                    filledCount++;
                    const userVal = inputsRef[`${r}-${c}`].value.trim().toUpperCase();
                    if(userVal !== gridData[r][c].letter.toUpperCase()) {
                        allCorrect = false;
                    }
                }
            }
        }

        if(allCorrect && filledCount > 0) {
            showAnalysisPanel();
        }
    }

    function showAnalysisPanel() {
        const rowsEl = document.getElementById('analysisRows');
        rowsEl.innerHTML = '';

        activeDataset.forEach(item => {
            const tr = document.createElement('tr');
            const targetWord = item.processedWord ? item.w : item.w;
            const exampleSentence = item.c.split('|')[1] || "Örnek cümle yüklenemedi.";

            tr.innerHTML = `
                <td style="font-weight:bold; color:var(--accent-blue);">${targetWord}</td>
                <td>${item.lang}</td>
                <td>${exampleSentence}</td>
            `;
            rowsEl.appendChild(tr);
        });

        document.getElementById('analysisPanel').style.display = 'block';
        document.getElementById('analysisPanel').scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
