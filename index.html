<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Studio - Akıllı Telaffuz</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .smooth-transition { transition: all 0.3s ease; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen text-slate-200 antialiased tracking-tight"
      x-data="{
        selectedLang: 'en-US',
        customText: 'The future belongs to those who believe in the beauty of their dreams.', 
        speechRate: 1.0,
        
        mediaRecorder: null,
        audioChunks: [],
        audioUrl: null,
        isRecording: false,
        userWaveforms: [20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20],
        audioContext: null,
        analyser: null,

        // PREMIUM VE DOĞAL SES MOTORU (Robotik Sesleri Engeller)
        playNative() {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(this.customText);
            
            // Sistemde yüklü olan en kaliteli bulut/doğal sesleri tarar
            let voices = window.speechSynthesis.getVoices();
            let premiumVoice = voices.find(v => v.lang === this.selectedLang && 
                (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Microsoft') || v.name.includes('Zira')));
            
            if (premiumVoice) {
                utterance.voice = premiumVoice;
            } else {
                utterance.lang = this.selectedLang;
            }

            utterance.rate = this.speechRate;
            window.speechSynthesis.speak(utterance);
        },

        // GOOGLE ÇEVİRİ ENTEGRASYONU (Sıfır Maliyet)
        translateText() {
            if (!this.customText.trim()) return;
            // Kaynak dili otomatik algılaması veya seçilen dile göre ayarlaması için url oluşturuyoruz
            let sourceLangCode = this.selectedLang.split('-')[0]; // örn: 'en', 'de', 'fr'
            let googleTranslateUrl = `https://translate.google.com/?sl=${sourceLangCode}&tl=tr&text=${encodeURIComponent(this.customText)}&op=translate`;
            window.open(googleTranslateUrl, '_blank'); // Yeni sekmede çeviriyi açar
        },

        // GERÇEK MİKROFON ANALİZİ VE KAYIT
        async startRecording() {
            this.audioChunks = [];
            this.userWaveforms = [];
            
            let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.mediaRecorder = new MediaRecorder(stream);
            
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.analyser = this.audioContext.createAnalyser();
            let source = this.audioContext.createMediaStreamSource(stream);
            source.connect(this.analyser);
            this.analyser.fftSize = 32;
            
            let bufferLength = this.analyser.frequencyBinCount;
            let dataArray = new Uint8Array(bufferLength);

            let draw = () => {
                if (!this.isRecording) return;
                requestAnimationFrame(draw);
                this.analyser.getByteFrequencyData(dataArray);
                
                let avg = dataArray.reduce((a,b) => a+b, 0) / bufferLength;
                let barHeight = Math.max(15, Math.min(95, (avg / 128) * 100));
                
                if(this.userWaveforms.length > 18) this.userWaveforms.shift();
                this.userWaveforms.push(barHeight);
            };
            
            this.mediaRecorder.start();
            this.isRecording = true;
            draw();
            
            this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
            this.mediaRecorder.onstop = () => {
                let audioBlob = new Blob(this.audioChunks, { type: 'audio/mp3' });
                this.audioUrl = URL.createObjectURL(audioBlob);
                if(this.audioContext) this.audioContext.close();
            };
        },

        stopRecording() {
            if (this.mediaRecorder) {
                this.mediaRecorder.stop();
                this.isRecording = false;
            }
        },

        playUser() {
            if(this.audioUrl) new Audio(this.audioUrl).play();
        }
      }"
      x-init="setTimeout(() => window.speechSynthesis.getVoices(), 500)">

    <header class="w-full border-b border-indigo-500/10 bg-slate-900/60 backdrop-blur-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto h-16 flex items-center justify-between px-6">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-violet-500 shadow-[0_0_10px_#8b5cf6]"></div>
                <span class="text-base font-bold tracking-wide bg-gradient-to-r from-violet-400 to-indigo-400 bg-clip-text text-transparent">Polyglot Studio</span>
            </div>
            <span class="text-xs font-semibold bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full text-indigo-300">Doğal Ses Desteği Active</span>
        </div>
    </header>

    <main class="max-w-2xl mx-auto pt-12 px-4 pb-32">
        <div class="space-y-8">
            
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-extrabold text-white tracking-tight drop-shadow-sm">Aksan ve Konuşma Laboratuvarı</h1>
                <p class="text-sm text-slate-400">İstediğiniz dilde metin yazın, kusursuz sesle dinleyin ve telaffuzunuzu geliştirin.</p>
            </div>

            <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-6">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Hedef Dil</label>
                        <select x-model="selectedLang" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 smooth-transition">
                            <option value="en-US">İngilizce (US)</option>
                            <option value="de-DE">Almanca (Deutsch)</option>
                            <option value="fr-FR">Fransızca (Français)</option>
                            <option value="es-ES">İspanyolca (Español)</option>
                        </select>
                    </div>

                    <div class="space-y-1.5">
                        <div class="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-wider">
                            <span>Konuşma Hızı</span>
                            <span class="text-violet-400" x-text="speechRate + 'x'"></span>
                        </div>
                        <div class="pt-2">
                            <input type="range" min="0.5" max="1.5" step="0.25" x-model="speechRate" 
                                   class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-violet-500">
                        </div>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Pratik Yapılacak Metin</label>
                    <textarea x-model="customText" rows="4" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-4 py-3 text-base text-white focus:outline-none focus:border-violet-500 smooth-transition resize-none" placeholder="Buraya dilediğiniz bir cümleyi veya paragrafı ekleyin..."></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button @click="playNative()" class="w-full py-3.5 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-indigo-600/20 smooth-transition cursor-pointer flex items-center justify-center gap-2">
                        <span>▶</span> Doğal Sesle Dinle
                    </button>

                    <button @click="translateText()" class="w-full py-3.5 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl text-sm smooth-transition cursor-pointer flex items-center justify-center gap-2">
                        <span>🌐</span> Google Çeviri ile Bak
                    </button>
                </div>

                <div class="border-t border-slate-800/60 my-2"></div>

                <div class="bg-slate-950/40 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <button @click="isRecording ? stopRecording() : startRecording()" 
                                :class="isRecording ? 'bg-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.4)] text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'"
                                class="w-12 h-12 rounded-full flex items-center justify-center text-lg font-bold smooth-transition cursor-pointer shrink-0">
                            <span x-text="isRecording ? '■' : '🎤'"></span>
                        </button>
                        <div>
                            <span class="text-sm font-bold text-slate-200 block" x-text="isRecording ? 'Sesiniz Kaydediliyor ve Analiz Ediliyor...' : 'Şimdi Kendiniz Telaffuz Edin'"></span>
                            <span class="text-xs text-slate-500" x-text="isRecording ? 'Kayıt bitince durdur butonuna basın.' : 'Mikrofona basıp cümleyi kendi aksanınızla okuyun.'"></span>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-0.5 h-10 w-24 justify-end overflow-hidden shrink-0">
                        <template x-for="h in userWaveforms">
                            <div class="w-1 bg-gradient-to-t from-violet-500 to-fuchsia-400 rounded-full smooth-transition" :style="'height: ' + h + '%'"></div>
                        </template>
                    </div>
                </div>

                <button x-show="audioUrl" @click="playUser()" x-cloak x-transition
                        class="w-full py-3 bg-emerald-500/10 border border-emerald-500/20 hover:bg-emerald-500/20 text-emerald-400 font-bold rounded-xl text-xs smooth-transition cursor-pointer">
                    🔊 Kendi Ses Kaydınızı Dinleyin & Kusursuz Sesle Kıyaslayın
                </button>

            </div>

        </div>
    </main>
</body>
</html>
