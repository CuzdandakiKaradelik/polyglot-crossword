            /* 22. Luxury Gold */
            --bg-body: #111111;
            --bg-container: #1a1a1a;

            /* 23. Lavender Fields */
            --bg-body: #e8eaf6;
            --bg-container: #f3f4fa;
            --text-main: #3f51b5;
            --border-color: #7986cb;

            --cell-focus-bg: #c5cae9;
            --clue-num-bg: #e8eaf6;
            --font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .newspaper-container {
            max-width: 1150px;
            margin: 0 auto;
            border: 2px solid var(--border-color);
            padding: 20px;
            box-shadow: 5px 5px 0px var(--border-color);
            background-color: var(--bg-container);
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        header {
            text-align: center;
            border-bottom: 4px double var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .control-panel label {
            font-weight: bold;
            font-size: 16px;
        }

        .control-panel select {
            font-family: var(--font-family);
            font-size: 16px;
            padding: 5px 10px;
            border: 2px solid var(--border-color);
            background-color: var(--bg-container);
            color: var(--text-main);
            cursor: pointer;
        }

        .control-panel button {
            font-family: var(--font-family);
            font-size: 16px;
            font-weight: bold;
            padding: 6px 15px;
            border: 2px solid var(--border-color);
            background-color: var(--border-color);
            color: var(--bg-container);
            cursor: pointer;
            box-shadow: 2px 2px 0px #888;
        }

        .control-panel button:hover {
            opacity: 0.8;
        }

        .pool-stats {
            font-size: 12px;
            font-style: italic;
            color: #666;
            margin-left: 10px;
        }

        .game-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            margin-top: 20px;
        }

        @media (max-width: 950px) {
            .game-layout {
                flex-direction: column;
            }
        }

        .puzzle-section {
            flex: 1.3;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--border-color); 
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            min-height: 500px;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--border-color);
            border: 2px solid var(--border-color);
        }

        .cell {
            background-color: var(--border-color);
            position: relative;
            width: 35px;
            height: 35px;
        }

        .cell.active {
            background-color: var(--cell-active-bg);
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: var(--font-family);
            text-transform: uppercase;
            background: transparent;
            color: var(--text-main);
            padding: 0;
            box-sizing: border-box;
        }

        /* Dark, Matrix, Dracula vb. modlarda focus yazısının okunabilmesi için ince ayar */
        [data-theme="matrix"] .cell input:focus,
        [data-theme="dracula"] .cell input:focus,
        [data-theme="cyberpunk"] .cell input:focus,
        [data-theme="synthwave"] .cell input:focus,
        [data-theme="halloween"] .cell input:focus,
        [data-theme="mars"] .cell input:focus,
        [data-theme="gold"] .cell input:focus {
            color: #ffffff !important;
        }

        .cell input:focus {
            background-color: var(--cell-focus-bg);
            outline: none;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 9px;
            font-weight: bold;
            color: var(--text-main);
            z-index: 10;
            line-height: 1;
        }

        .clues-section {
            flex: 1;
            border-left: 1px dashed var(--border-color);
            padding-left: 20px;
            max-height: 580px;
            overflow-y: auto;
        }

        .clues-section h2 {
            font-family: 'Playfair Display', serif;
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }

        .clue-group {
            margin-bottom: 25px;
        }

        .clue-group h3 {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background-color: var(--border-color);
            color: var(--bg-container);
            padding: 4px 8px;
            display: inline-block;
        }

        .clue-item {
            margin-bottom: 14px;
            font-size: 13px;
            line-height: 1.5;
            padding: 6px;
            border-bottom: 1px dotted #ccc;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .clue-item:hover {
            background-color: var(--clue-num-bg);
        }

        .clue-item strong {
            font-size: 14px;
            background-color: var(--clue-num-bg);
            padding: 0 4px;
            margin-right: 5px;
        }

        #success-banner {
            display: none;
            background-color: #617a55;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 3px 3px 0px var(--border-color);
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

    <div class="control-panel">
        <label for="langSelect" id="lblLang">Target Language:</label>

            <div class="clue-group">

    </div>
</div>

    function initGame() {
        document.getElementById('success-banner').style.display = 'none';
        const selectedLang = document.getElementById('langSelect').value;
        updateInterfaceLanguage(selectedLang);

        let pool = [...DATA_POOL[selectedLang]];
        let unusedPool = pool.filter(w => !usedWordsHistory[selectedLang].includes(w.word));
        
        if (unusedPool.length < 2) {
            usedWordsHistory[selectedLang] = [];
            unusedPool = pool;
        }

        const trans = INTERFACE_LANGS[selectedLang];
        document.getElementById('poolStats').innerText = `(${trans.stats}: ~${unusedPool.length})`;
        unusedPool.sort(() => 0.5 - Math.random());
        let selectedWords = unusedPool.slice(0, Math.min(6, unusedPool.length));

        const generationResult = generateCrosswordLayout(selectedWords);
        
        if (!generationResult || generationResult.placedCount < 1) {
            initGame();
            return;
        }

        generationResult.placedWords.forEach(w => {
            if (!usedWordsHistory[selectedLang].includes(w.word)) {
                usedWordsHistory[selectedLang].push(w.word);
            }
        });

        activeWords = generationResult.placedWords;
        renderGrid(generationResult.matrix);
        renderClues();
        loadProgress();
    }

    function generateCrosswordLayout(words) {
        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        let placedWords = [];
        let wordCounter = 1;

        if(words.length === 0) return null;

        let first = words[0];
        let startCol = Math.max(0, Math.floor((matrixSize - first.word.length) / 2));
        let startRow = Math.floor(matrixSize / 2);
        
        for (let i = 0; i < first.word.length; i++) {
            localMatrix[startRow][startCol + i] = { letter: first.word[i], isStart: i === 0, num: wordCounter };
        }
        placedWords.push({ ...first, row: startRow, col: startCol, dir: "across", num: wordCounter++ });

        for (let w = 1; w < words.length; w++) {
            let current = words[w];
            let placed = false;

            for (let r = 0; r < matrixSize && !placed; r++) {
                for (let c = 0; c < matrixSize && !placed; c++) {
                    if (localMatrix[r][c] !== null) {
                        let matchLetter = localMatrix[r][c].letter;
                        let matchIndex = current.word.indexOf(matchLetter);

                        if (matchIndex !== -1) {
                            let dRow = r - matchIndex;
                            let dCol = c;
                            if (canPlaceWord(current.word, dRow, dCol, "down", localMatrix, r, c)) {
                                for (let i = 0; i < current.word.length; i++) {
                                    if (!localMatrix[dRow + i][dCol]) {
                                        localMatrix[dRow + i][dCol] = { letter: current.word[i], isStart: i === 0, num: i === 0 ? wordCounter : null };
                                    } else if (i === 0) {
                                        localMatrix[dRow + i][dCol].num = wordCounter;
                                    }
                                }
                                placedWords.push({ ...current, row: dRow, col: dCol, dir: "down", num: wordCounter++ });
                                placed = true;
                            }
                            
                            let aRow = r;
                            let aCol = c - matchIndex;
                            if (!placed && canPlaceWord(current.word, aRow, aCol, "across", localMatrix, r, c)) {
                                for (let i = 0; i < current.word.length; i++) {
                                    if (!localMatrix[aRow][aCol + i]) {
                                        localMatrix[aRow][aCol + i] = { letter: current.word[i], isStart: i === 0, num: i === 0 ? wordCounter : null };
                                    } else if (i === 0) {
                                        localMatrix[aRow][aCol + i].num = wordCounter;
                                    }
                                }
                                placedWords.push({ ...current, row: aRow, col: aCol, dir: "across", num: wordCounter++ });
                                placed = true;
                            }
                        }
                    }
                }
            }
        }

        return { matrix: localMatrix, placedWords: placedWords, placedCount: placedWords.length };
    }

    function canPlaceWord(word, startRow, startCol, dir, matrix, intersectR, intersectC) {
        if (startRow < 0 || startCol < 0) return false;
        if (dir === "down" && startRow + word.length > matrixSize) return false;
        if (dir === "across" && startCol + word.length > matrixSize) return false;

        for (let i = 0; i < word.length; i++) {
            let r = dir === "down" ? startRow + i : startRow;
            let c = dir === "down" ? startCol : startCol + i;

            if (r === intersectR && c === intersectC) continue; 

            if (matrix[r][c] !== null && matrix[r][c].letter !== word[i]) {
                return false; 
            }
        }
        return true;
    }

    function renderGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 35px)`;
        container.style.gridTemplateRows = `repeat(${matrixSize}, 35px)`;
        inputElements = {};

        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                const cellData = matrixData[r][c];
                const cellDiv = document.createElement('div');
                
                if (cellData) {
                    cellDiv.className = 'cell active';
                    if (cellData.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = cellData.num;
                        cellDiv.appendChild(numSpan);
                    }

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    
                    input.addEventListener('input', (e) => {
                        let val = e.target.value.toUpperCase();
                        if(val === "I") val = "İ"; 
                        input.value = val;
                        
                        saveProgress();
                        checkWinCondition();

                        if (input.value.length === 1) {
                            moveNextWithDirection(r, c);
                        }
                    });

                    input.addEventListener('focus', () => {
                        currentFocusCell = { row: r, col: c, element: input };
                        determineDirection(r, c);
                    });

                    input.addEventListener('keydown', (e) => {
                        let targetRow = r;
                        let targetCol = c;

                        switch (e.key) {
                            case "ArrowUp": targetRow--; break;
                            case "ArrowDown": targetRow++; break;
                            case "ArrowLeft": targetCol--; break;
                            case "ArrowRight": targetCol++; break;
                            case "Backspace":
                                if (input.value === "") {
                                    moveBackWithDirection(r, c);
                                } else {
                                    input.value = "";
                                    saveProgress();
                                }
                                return;
                            default: return;
                        }

                        if (inputElements[`${targetRow}-${targetCol}`]) {
                            e.preventDefault();
                            inputElements[`${targetRow}-${targetCol}`].focus();
                        }
                    });

                    inputElements[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell';
                }
                container.appendChild(cellDiv);
            }
        }
    }

    function determineDirection(r, c) {
        let hasHorizontal = inputElements[`${r}-${c+1}`] || inputElements[`${r}-${c-1}`];
        let hasVertical = inputElements[`${r+1}-${c}`] || inputElements[`${r-1}-${c}`];
        
        if (hasHorizontal && !hasVertical) {
            activeWritingDirection = "across";
        } else if (hasVertical && !hasHorizontal) {
            activeWritingDirection = "down";
        }
    }

    function moveNextWithDirection(r, c) {
        if (activeWritingDirection === "across") {
            if (inputElements[`${r}-${c+1}`]) inputElements[`${r}-${c+1}`].focus();
        } else if (activeWritingDirection === "down") {
            if (inputElements[`${r+1}-${c}`]) inputElements[`${r+1}-${c}`].focus();
        }
    }

    function moveBackWithDirection(r, c) {
        if (activeWritingDirection === "across") {
            if (inputElements[`${r}-${c-1}`]) inputElements[`${r}-${c-1}`].focus();
        } else if (activeWritingDirection === "down") {
            if (inputElements[`${r-1}-${c}`]) inputElements[`${r-1}-${c}`].focus();
        }
    }

    function getLetterHint() {
        const selectedLang = document.getElementById('langSelect').value;
        if (currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            const correctLetter = gridMatrix[currentFocusCell.row][currentFocusCell.col].letter;
            currentFocusCell.element.value = correctLetter;
            currentFocusCell.element.style.color = "#a61c1c";
            saveProgress();
            checkWinCondition();
            moveNextWithDirection(currentFocusCell.row, currentFocusCell.col);
        } else {
            alert(INTERFACE_LANGS[selectedLang].hintAlert);
        }
    }

    function saveProgress() {
        let savedAnswers = {};
        for (let key in inputElements) {
            if (inputElements[key].value) {
                savedAnswers[key] = inputElements[key].value;
            }
        }
        localStorage.setItem('saved-grid-answers', JSON.stringify(savedAnswers));
    }

    function loadProgress() {
        let savedAnswers = localStorage.getItem('saved-grid-answers');
        if (savedAnswers) {
            savedAnswers = JSON.parse(savedAnswers);
            for (let key in savedAnswers) {
                if (inputElements[key]) {
                    inputElements[key].value = savedAnswers[key];
                }
            }
            checkWinCondition();
        }
    }

    function renderClues() {
        const acrossContainer = document.getElementById('across-clues');
        const downContainer = document.getElementById('down-clues');
        acrossContainer.innerHTML = '';
        downContainer.innerHTML = '';

        activeWords.sort((a,b) => a.num - b.num).forEach(item => {
            const clueDiv = document.createElement('div');
            clueDiv.className = 'clue-item';
            clueDiv.innerHTML = `<strong>${item.num}</strong> ${item.clue}`;
            
            clueDiv.addEventListener('click', () => {
                activeWritingDirection = item.dir;
                if (inputElements[`${item.row}-${item.col}`]) {
                    inputElements[`${item.row}-${item.col}`].focus();
                }
            });

            if (item.dir === 'across') {
                acrossContainer.appendChild(clueDiv);
            } else {
                downContainer.appendChild(clueDiv);
            }
        });
    }

    function checkWinCondition() {
        let allCorrect = true;
        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                if (gridMatrix[r][c]) {
                    const userInput = inputElements[`${r}-${c}`].value;
                    if (userInput !== gridMatrix[r][c].letter) {
                        allCorrect = false;
                        break;
                    }
                }
            }
        }
        if (allCorrect) {
            const selectedLang = document.getElementById('langSelect').value;
            const banner = document.getElementById('success-banner');
            banner.innerText = INTERFACE_LANGS[selectedLang].win;
            banner.style.display = 'block';
            Object.values(inputElements).forEach(input => input.disabled = true);
            localStorage.removeItem('saved-grid-answers');
        }
    }

    window.onload = function() {
        const savedTheme = localStorage.getItem('polyglot-theme') || 'light';
        changeTheme(savedTheme);
        initGame();
    };
</script>

</body>
</html>
