<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polyglot Lexical Matrix v11.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fcfbfa;
            --panel-bg: #ffffff;
            --text-dark: #1c1a17;
            --text-muted: #615c55;
            --border-fine: #1c1a17;
            --accent-warm: #f4f0ea;
            --cell-size: 42px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Launcher Sürümü - Gazete Başlığı Estetiği */
        .app-container {
            width: 100%;
            max-width: 1000px;
            margin: 10px auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-fine);
            padding: 20px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
        }

        .editorial-header {
            text-align: center;
            border-bottom: 2px solid var(--border-fine);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .editorial-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: -0.5px;
        }

        .editorial-subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }

        /* Kurulum Kartları */
        .setup-panel {
            max-width: 500px;
            margin: 40px auto;
            text-align: center;
        }

        .grid-selectors {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            text-align: left;
        }

        .selector-field label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .selector-field select {
            width: 100%;
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            padding: 10px;
            border: 1px solid var(--border-fine);
            background: var(--panel-bg);
            color: var(--text-dark);
            border-radius: 0;
            outline: none;
        }

        .btn-editorial {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            background: var(--text-dark);
            color: var(--bg-color);
            border: 1px solid var(--border-fine);
            padding: 12px 30px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-editorial:hover {
            background: var(--accent-warm);
            color: var(--text-dark);
        }

        /* Ana Çalışma Alanı */
        .workspace {
            display: none;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-fine);
        }

        .btn-secondary {
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            background: transparent;
            border: 1px solid var(--border-fine);
            padding: 6px 12px;
            cursor: pointer;
        }

        /* MOBİL UYUMLU CORE LAYOUT */
        .main-layout {
            display: flex;
            gap: 30px;
        }

        @media (max-width: 850px) {
            .main-layout {
                flex-direction: column;
            }
        }

        .matrix-box {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--accent-warm);
            border: 1px solid var(--border-fine);
            padding: 15px;
            overflow-x: auto; /* Küçük ekranlarda taşmayı önler */
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--border-fine);
            padding: 1px;
        }

        .cell {
            background-color: transparent;
            position: relative;
            width: var(--cell-size);
            height: var(--cell-size);
        }

        .cell.active {
            background-color: #ffffff;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
            background: transparent;
            color: var(--text-dark);
            outline: none;
        }

        .cell input:focus {
            background-color: #fffde7;
        }

        .cell-num {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 9px;
            font-weight: bold;
            color: var(--text-muted);
            z-index: 2;
        }

        /* İpuçları Alanı */
        .clues-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .clue-group-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 18px;
            margin: 0 0 10px 0;
            border-bottom: 1px solid var(--border-fine);
            padding-bottom: 4px;
        }

        .clue-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .clue-item {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
            color: var(--text-dark);
            padding-bottom: 8px;
            border-bottom: 1px dotted #e0dc Normandy;
        }

        .clue-item strong {
            background: var(--accent-warm);
            padding: 1px 5px;
            margin-right: 5px;
            font-size: 11px;
        }

        /* Mobil Ekran İyileştirmeleri (Responsive CSS) */
        @media (max-width: 480px) {
            :root {
                --cell-size: 8vw; /* Hücreler ekrana göre otomatik küçülür */
            }
            .editorial-header h1 {
                font-size: 26px;
            }
            .cell input {
                font-size: 14px;
            }
            .app-container {
                padding: 12px;
            }
        }

        /* Başarı Bildirimi */
        .success-index {
            margin-top: 30px;
            border-top: 2px solid var(--border-fine);
            padding-top: 20px;
            display: none;
        }

        .success-index h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin: 0 0 15px 0;
        }

        .index-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .index-table th, .index-table td {
            border: 1px solid var(--border-fine);
            padding: 8px;
            text-align: left;
        }

        .index-table th {
            background: var(--accent-warm);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="editorial-header">
        <h1>THE LEXICAL WORKBENCH</h1>
        <div class="editorial-subtitle">A Polyglot Station for Systematic Vocabulary Acquisition</div>
    </header>

    <div class="setup-panel" id="launcher-area">
        <div class="grid-selectors">
            <div class="selector-field">
                <label for="langSelect">Target Language / Hedef Dil</label>
                <select id="langSelect">
                    <option value="en">English (İngilizce)</option>
                    <option value="es">Español (İspanyolca)</option>
                    <option value="de">Deutsch (Almanca)</option>
                    <option value="fr">Français (Fransızca)</option>
                </select>
            </div>
            <div class="selector-field">
                <label for="topicSelect">Lexical Area / Kelime Grubu</label>
                <select id="topicSelect">
                    <option value="academic">🎓 Academic & Intellectual Discourse</option>
                    <option value="lifestyle">🌍 Culture, Nature & Social Living</option>
                </select>
            </div>
        </div>
        <button class="btn-editorial" onclick="startMatrix()">Initialize Matrix / Matrisi Başlat</button>
    </div>

    <div class="workspace" id="workspace-area">
        <div class="action-bar">
            <button class="btn-secondary" onclick="goBack()"><─ Menu</button>
            <div>
                <button class="btn-secondary" onclick="giveHint()">Harf İpucu</button>
                <button class="btn-secondary" onclick="refreshMatrix()" style="margin-left: 5px;">Yeni Matris</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="matrix-box">
                <div class="crossword-grid" id="grid-container"></div>
            </div>

            <div class="clues-box">
                <div>
                    <h3 class="clue-group-title">Yatay (Across)</h3>
                    <ul class="clue-list" id="across-clues"></ul>
                </div>
                <div>
                    <h3 class="clue-group-title">Dikey (Down)</h3>
                    <ul class="clue-list" id="down-clues"></ul>
                </div>
            </div>
        </div>

        <div class="success-index" id="success-area">
            <h2>✓ Matrix Solved: Linguistic Index</h2>
            <table class="index-table">
                <thead>
                    <tr>
                        <th>Sözcük (Lexeme)</th>
                        <th>Bağlam ve Anlam Notu</th>
                    </tr>
                </thead>
                <tbody id="index-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Gerçek, Doğrulanmış ve Kusursuz Bağlamsal Dil Verisi
    const LEXICON = {
        academic: {
            en: [
                { w: "CONTEXT", c: "The circumstances forming the setting for an event or statement. | TR: Bağlam" },
                { w: "THEORY", c: "A system of ideas intended to explain something complex. | TR: Teori" },
                { w: "METHOD", c: "A defined, systematic procedure for accomplishing a task. | TR: Yöntem" },
                { w: "SOURCE", c: "A primary book, document, or person supplying information. | TR: Kaynak" },
                { w: "LOGIC", c: "Strict principles of validity and reasoning. | TR: Mantık" }
            ],
            es: [
                { w: "CONTEXTO", c: "Entorno lingüístico o situación del cual depende el sentido. | TR: Bağlam" },
                { w: "TEORIA", c: "Conjunto de leyes científicas organizadas para explicar algo. | TR: Teori" },
                { w: "METODO", c: "Procedimiento estructurado para llegar a la verdad. | TR: Yöntem" },
                { w: "FUENTE", c: "Texto o material inicial que provee datos fidedignos. | TR: Kaynak" },
                { w: "LOGICA", c: "Estructura de pensamiento coherente y válida. | TR: Mantık" }
            ],
            de: [
                { w: "KONTEXT", c: "Der gedankliche Zusammenhang, in dem ein Wort steht. | TR: Bağlam" },
                { w: "THEORIE", c: "System von Prinzipien zur Erklärung von Phänomenen. | TR: Teori" },
                { w: "METHODE", c: "Systematisches Vorgehen zur Erreichung eines Ziels. | TR: Yöntem" },
                { w: "QUELLE", c: "Textdokument, das historische Fakten liefert. | TR: Kaynak" },
                { w: "LOGIK", c: "Folgerichtiges, klares Denken und Argumentieren. | TR: Mantık" }
            ],
            fr: [
                { w: "CONTEXTE", c: "Ensemble des circonstances entourant un texte ou un fait. | TR: Bağlam" },
                { w: "THEORIE", c: "Système d'idées abstraites appliqué à un domaine. | TR: Teori" },
                { w: "METHODE", c: "Manière ordonnée de mener la pensée vers la vérité. | TR: Yöntem" },
                { w: "SOURCE", c: "Document original servant de point de départ. | TR: Kaynak" },
                { w: "LOGIQUE", c: "Raisonnement rigoureux, cohérent et juste. | TR: Mantık" }
            ]
        },
        lifestyle: {
            en: [
                { w: "JOURNEY", c: "An act of traveling from one destination to another. | TR: Yolculuk" },
                { w: "NATURE", c: "The physical world, including wildlife and landscapes. | TR: Doğa" },
                { w: "HEALTH", c: "The state of complete physical and mental well-being. | TR: Sağlık" },
                { w: "FAMILY", c: "A primary social unit consisting of closely related people. | TR: Aile" },
                { w: "WONDER", c: "A feeling of admiration caused by something beautiful. | TR: Harika" }
            ],
            es: [
                { w: "NATURALEZA", c: "El mundo físico, los seres vivos y entornos biológicos. | TR: Doğa" },
                { w: "VIAJE", c: "Traslado físico que se hace de un país a otro. | TR: Yolculuk" },
                { w: "SALUD", c: "Estado orgánico óptimo de bienestar y vitalidad. | TR: Sağlık" },
                { w: "FAMILIA", c: "Grupo de personas unidas por lazos sanguíneos o parentesco. | TR: Aile" },
                { w: "MUNDO", c: "El planeta Tierra o el universo en su totalidad. | TR: Dünya" }
            ],
            de: [
                { w: "REISE", c: "Die Fortbewegung zu einem entfernten Ziel. | TR: Yolculuk" },
                { w: "NATUR", c: "Die organische Umwelt ohne menschlichen Eingriff. | TR: Doğa" },
                { w: "GESUNDHEIT", c: "Zustand des völligen körperlichen Wohlbefindens. | TR: Sağlık" },
                { w: "FAMILIE", c: "Die engste Lebensgemeinschaft von Eltern und Kindern. | TR: Aile" },
                { w: "WELT", c: "Unser ganzer Planet mit all seinen Kulturen. | TR: Dünya" }
            ],
            fr: [
                { w: "VOYAGE", c: "Déplacement lointain effectué pour le plaisir. | TR: Yolculuk" },
                { w: "NATURE", c: "Le monde physique et les écosystèmes sauvages. | TR: Doğa" },
                { w: "SANTE", c: "Bon état physiologique général d'une personne. | TR: Sağlık" },
                { w: "FAMILLE", c: "Groupe social uni par les liens du sang. | TR: Aile" },
                { w: "MONDE", c: "La Terre entière avec l'humanité qui l'habite. | TR: Dünya" }
            ]
        }
    };

    let matrixSize = 13;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let currentFocusCell = null;
    let cycle = 0;

    function startMatrix() {
        document.getElementById('launcher-area').style.display = 'none';
        document.getElementById('workspace-area').style.display = 'block';
        buildEngine();
    }

    function goBack() {
        document.getElementById('workspace-area').style.display = 'none';
        document.getElementById('launcher-area').style.display = 'block';
    }

    function refreshMatrix() {
        cycle = (cycle + 1) % 5;
        buildEngine();
    }

    // Gelişmiş Komşuluk ve Harf Kesişim Algoritması
    function buildEngine() {
        document.getElementById('success-area').style.display = 'none';
        const lang = document.getElementById('langSelect').value;
        const topic = document.getElementById('topicSelect').value;
        const rawPool = LEXICON[topic][lang];

        // Kelime sırasını karıştırarak dinamizm sağlama
        let pool = [...rawPool].sort((a, b) => b.w.length - a.w.length);

        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        activeWords = [];

        // 1. Kelime Anchor Olarak Tam Yatay Merkeze
        let first = pool[0];
        let fRow = 6, fCol = Math.floor((matrixSize - first.w.length) / 2);
        for(let i=0; i<first.w.length; i++) {
            localMatrix[fRow][fCol + i] = { letter: first.w[i], isStart: i===0, num: 1, dir: "across" };
        }
        activeWords.push({ w: first.w, c: first.c, row: fRow, col: fCol, dir: "across", num: 1 });

        let counter = 2;

        // Kalan kelimeleri kesiştirme denemeleri
        for(let w=1; w<pool.length; w++) {
            let item = pool[w];
            let placed = false;

            for(let r=0; r<matrixSize && !placed; r++) {
                for(let c=0; c<matrixSize && !placed; c++) {
                    if(localMatrix[r][c] !== null) {
                        let letter = localMatrix[r][c].letter;
                        let idxInWord = item.w.indexOf(letter);

                        if(idxInWord !== -1) {
                            let parentDir = localMatrix[r][c].dir;
                            let nextDir = parentDir === "across" ? "down" : "across";
                            let startR = nextDir === "down" ? r - idxInWord : r;
                            let startC = nextDir === "down" ? c : c - idxInWord;

                            if(validatePlacement(item.w, startR, startC, nextDir, localMatrix, r, c)) {
                                for(let i=0; i<item.w.length; i++) {
                                    let currR = nextDir === "down" ? startR + i : startR;
                                    let currC = nextDir === "down" ? startC : startC + i;

                                    if(!localMatrix[currR][currC]) {
                                        localMatrix[currR][currC] = { letter: item.w[i], isStart: i===0, num: i===0 ? counter : null, dir: nextDir };
                                    } else if(i === 0) {
                                        localMatrix[currR][currC].num = counter;
                                    }
                                }
                                activeWords.push({ w: item.w, c: item.c, row: startR, col: startC, dir: nextDir, num: counter++ });
                                placed = true;
                            }
                        }
                    }
                }
            }

            // Kesişme olmazsa izole güvenli paralel satır/sütun ataması
            if(!placed) {
                let altRow = (w * 3) % (matrixSize - 2) + 1;
                if(Math.abs(altRow - fRow) < 2) altRow = fRow + 3;
                let altCol = 1;
                if(validatePlacement(item.w, altRow, altCol, "across", localMatrix, -1, -1)) {
                    for(let i=0; i<item.w.length; i++) {
                        localMatrix[altRow][altCol + i] = { letter: item.w[i], isStart: i===0, num: i===0 ? counter : null, dir: "across" };
                    }
                    activeWords.push({ w: item.w, c: item.c, row: altRow, col: altCol, dir: "across", num: counter++ });
                    placed = true;
                }
            }
        }

        renderVisuals(localMatrix);
    }

    function validatePlacement(word, startR, startC, dir, matrix, intR, intC) {
        if(startR < 0 || startC < 0) return false;
        if(dir === "down" && startR + word.length > matrixSize) return false;
        if(dir === "across" && startC + word.length > matrixSize) return false;

        for(let i=0; i<word.length; i++) {
            let r = dir === "down" ? startR + i : startR;
            let c = dir === "down" ? startC : startC + i;

            if(r === intR && c === intC) continue;
            if(matrix[r][c] !== null && matrix[r][c].letter !== word[i]) return false;

            // Yan çeper harf çakışma bariyeri (Mobilde kelime okunuşunu korur)
            if(matrix[r][c] === null) {
                if(dir === "down") {
                    if(c > 0 && matrix[r][c-1] !== null) return false;
                    if(c < matrixSize - 1 && matrix[r][c+1] !== null) return false;
                } else {
                    if(r > 0 && matrix[r-1][c] !== null) return false;
                    if(r < matrixSize - 1 && matrix[r+1][c] !== null) return false;
                }
            }
        }
        return true;
    }

    function renderVisuals(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, var(--cell-size))`;
        inputElements = {};

        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                const cell = matrixData[r][c];
                const div = document.createElement('div');
                
                if(cell) {
                    div.className = 'cell active';
                    if(cell.num) {
                        let span = document.createElement('span');
                        span.className = 'cell-num';
                        span.innerText = cell.num;
                        div.appendChild(span);
                    }
                    let inp = document.createElement('input');
                    inp.type = 'text';
                    inp.maxLength = 1;
                    inp.setAttribute('autocomplete', 'off');
                    inp.setAttribute('autocorrect', 'off');
                    
                    inp.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                        verifyState();
                        if(e.target.value.length === 1) {
                            jumpNext(r, c, cell.dir);
                        }
                    });

                    inp.addEventListener('focus', () => {
                        currentFocusCell = { row: r, col: c, element: inp };
                    });

                    inputElements[`${r}-${c}`] = inp;
                    div.appendChild(inp);
                } else {
                    div.className = 'cell';
                }
                container.appendChild(div);
            }
        }

        // İpuçlarını Yazdır
        const acrossList = document.getElementById('across-clues');
        const downList = document.getElementById('down-clues');
        acrossList.innerHTML = '';
        downList.innerHTML = '';

        activeWords.forEach(word => {
            let li = document.createElement('li');
            li.className = 'clue-item';
            li.innerHTML = `strong>${word.num}</strong> ${word.c}`;
            if(word.dir === "across") acrossList.appendChild(li);
            else downList.appendChild(li);
        });
    }

    function jumpNext(r, c, currentDir) {
        let nR = currentDir === "down" ? r + 1 : r;
        let nC = currentDir === "down" ? c : c + 1;
        let target = inputElements[`${nR}-${nC}`];
        if(target) target.focus();
    }

    function giveHint() {
        if(currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            currentFocusCell.element.value = gridMatrix[currentFocusCell.row][currentFocusCell.col].letter;
            verifyState();
        }
    }

    function verifyState() {
        let clean = true;
        let counts = 0;
        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                if(gridMatrix[r][c]) {
                    counts++;
                    if(inputElements[`${r}-${c}`].value !== gridMatrix[r][c].letter) clean = false;
                }
            }
        }

        if(clean && counts > 0) {
            const body = document.getElementById('index-table-body');
            body.innerHTML = '';
            activeWords.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td style="font-weight:bold; color:#2e7d32;">${item.w}</td><td>${item.c}</td>`;
                body.appendChild(tr);
            });
            document.getElementById('success-area').style.display = 'block';
            document.getElementById('success-area').scrollIntoView({ behavior: 'smooth' });
        }
    }
</script>
</body>
</html>
