    <style>
        :root {
            --bg-color: #f7f5f0;
            --container-bg: #ffffff;
            --text-color: #2b2b2b;
            --border-color: #2b2b2b;
            --accent-bg: #f0ede5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
            transition: all 0.2s ease;
        }

        /* --- GİRİŞ EKRANI --- */
        .welcome-screen {
            max-width: 750px;
            margin: 40px auto;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px;
            text-align: center;
        }

        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            margin: 0 0 10px 0;
        }

        .welcome-subtitle {
            font-size: 13px;
            opacity: 0.7;
            display: block;
            margin-bottom: 30px;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .start-action-btn {
            font-family: 'Courier Prime', monospace;
            font-size: 16px;
            font-weight: bold;
            background-color: var(--text-color);
            color: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 14px 35px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 380px;
        }

        .start-action-btn:hover {
            background-color: var(--accent-bg);
            color: var(--text-color);
        }

        .random-action-btn {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: bold;
            background-color: transparent;
            color: var(--text-color);
            border: 2px dashed var(--border-color);
            padding: 12px 35px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 380px;
        }

        .random-action-btn:hover {
            background-color: var(--text-color);
            color: var(--container-bg);
            border-style: solid;
        }

        .quick-settings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: left;
            border-top: 1px solid var(--accent-bg);
            padding-top: 25px;
        }

        @media (max-width: 650px) {
            .quick-settings-grid { grid-template-columns: 1fr; }
        }

        .setting-card {
            background: var(--accent-bg);
            padding: 12px;
            border-radius: 4px;
        }

        .setting-card label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .setting-card select {
            width: 100%;
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            padding: 6px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        /* --- OYUN ALANI --- */
        .main-workspace {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            border: 2px solid var(--border-color);
            padding: 25px;
            background-color: var(--container-bg);
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px;
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            margin: 0;
        }

        .edition-badge {
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 5px;
            display: block;
            opacity: 0.7;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--accent-bg);
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .btn-prime {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--text-color);
            color: var(--container-bg);
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .workspace-layout {
            display: flex;
            flex-direction: row;
            gap: 25px;
        }

        @media (max-width: 950px) {
            .workspace-layout { flex-direction: column; }
        }

        .matrix-section {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            min-height: 520px;
            border-radius: 4px;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--border-color);
            padding: 1px;
        }

        .cell {
            background-color: transparent;
            position: relative;
            width: 36px;
            height: 36px;
        }

        .cell.active { background-color: #ffffff; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
            background: transparent;
            color: #000000;
        }

        .cell input:focus {
            background-color: #fffacd !important;
            outline: none;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 8px;
            font-weight: bold;
            color: #444;
            z-index: 10;
        }

        .corpus-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .corpus-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            margin: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .clue-block {
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            padding: 12px;
            border-radius: 4px;
        }

        .clue-block h3 {
            margin: 0 0 8px 0;
            font-size: 11px;
            text-transform: uppercase;
            background: var(--border-color);
            color: var(--container-bg);
            padding: 2px 6px;
            display: inline-block;
        }

        .clue-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.4;
            padding-bottom: 6px;
            border-bottom: 1px dotted var(--border-color);
        }

        .clue-text { flex: 1; padding-right: 8px; }
        .clue-text strong { background: var(--accent-bg); padding: 0 4px; margin-right: 4px; }

        .audio-trigger {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            opacity: 0.6;
        }
        .audio-trigger:hover { opacity: 1; }

        .corpus-index-wrapper {
            margin-top: 20px;
            border-top: 2px dashed var(--border-color);
            padding-top: 15px;
            display: none;
        }

        .corpus-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .corpus-table th, .corpus-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        .corpus-table th { background-color: var(--accent-bg); text-transform: uppercase; }
    </style>
</head>

<div class="welcome-screen" id="launcher-area">
    <h1 class="welcome-title" id="lbl-launch-title">Polyglot Leksikal Workbench</h1>
    <span class="welcome-subtitle" id="lbl-launch-subtitle">Dil öğrenenler için gelişmiş bağlamsal kare bulmaca masası.</span>

    <div class="action-group">
        <button class="start-action-btn" onclick="launchWorkspace()" id="btn-menu-start">Matrisi Yükle</button>
        <button class="random-action-btn" onclick="launchRandomizedWorkspace()" id="btn-menu-random">🎲 Rastgele Sürpriz Kombinasyon</button>
    </div>

    <div class="quick-settings-grid">
        <div class="setting-card">
            <label for="langSelect" id="lbl-cfg-lang">Hedef Dil</label>
            <select id="langSelect" onchange="onLanguageChange()">
                <option value="en">English (İngilizce)</option>
                <option value="es">Español (İspanyolca)</option>
                <option value="de">Deutsch (Almanca)</option>
                <option value="fr">Français (Fransızca)</option>
                <option value="it">Italiano (İtalyanca)</option>
            </select>
        </div>

        <div class="setting-card">
            <label for="topicSelect" id="lbl-cfg-topic">Leksikal Alan</label>
            <select id="topicSelect" onchange="resetCycle()">
                <option value="cinema">🍿 Sinema & Medya</option>
                <option value="travel">✈️ Seyahat & Göç</option>
                <option value="culinary">🍳 Gastronomi & Mutfak</option>
                <option value="daily">🏡 Günlük Yaşam</option>
                <option value="law">⚖️ Hukuk & Adalet</option>
                <option value="business">💼 Ekonomi & Finans</option>
                <option value="science">🧬 Bilim & Teknoloji</option>
                <option value="history">🏛️ Tarih & Arkeoloji</option>
                <option value="art">🎨 Sanat & Edebiyat</option>
                <option value="psychology">🧠 Psikoloji & Felsefe</option>
            </select>
        </div>

        <div class="setting-card">
            <label for="themeSelect" id="lbl-cfg-theme">Renk Paleti</label>
            <select id="themeSelect" onchange="applySelectedTheme()"></select>
        </div>
    </div>
</div>

<div class="main-workspace" id="workspace-area">
    <header>
        <h1 id="lbl-main-title">Leksikal Matris Masası</h1>
        <span class="edition-badge" id="lbl-theme-badge">Tema</span>
    </header>

    <div class="control-panel">
        <button class="btn-prime" onclick="returnToLauncher()" id="lbl-btn-back">⬅ Ayarlar Menüsü</button>
        <div>
            <button class="btn-prime" onclick="generateNextInCycle()" id="lbl-btn-generate">Yeni Matris Filtrele (Refresh)</button>
            <button class="btn-prime" onclick="getStructuralHint()" id="lbl-btn-hint" style="background-color: var(--accent-bg); color: var(--text-color); margin-left:5px;">Harf İpucu</button>
        </div>
    </div>

    <div class="workspace-layout">
        <div class="matrix-section">
            <div class="crossword-grid" id="grid-container"></div>
        </div>

        <div class="corpus-section">
            <h2 id="lbl-section-title">Bağlamsal Metin Analizleri</h2>
            
            <div class="clue-block">
                <h3 id="lbl-across">Yatay (Across)</h3>
                <div id="across-clues"></div>
            </div>

            <div class="clue-block">
                <h3 id="lbl-down">Dikey (Down)</h3>
                <div id="down-clues"></div>
            </div>
        </div>
    </div>

    <div class="corpus-index-wrapper" id="corpus-index-area">
        <h2 id="lbl-analysis-title">Matris Tamamlandı: Leksikal İndeks</h2>
        <table class="corpus-table">
            <thead>
                <tr>
                    <th id="th-word">Sözcük (Lexeme)</th>
                    <th id="th-context">Semantik Karşılık ve Cümle Yapısı</th>
                </tr>
            </thead>
            <tbody id="corpus-table-body"></tbody>
        </table>
    </div>
</div>

    // MATRİS MOTORU: KELİMELERİN ANLAMSIZCA MATRİSTE BOZULMASINI %100 ENGELLER
    function initMatrix() {
        document.getElementById('corpus-index-area').style.display = 'none';
        const lang = document.getElementById('langSelect').value;
        const topic = document.getElementById('topicSelect').value;
        
        let pool = CORE_VOCABULARY[topic][lang];
        let startIdx = (currentCycleStep * 5) % pool.length;
        
        // Refresh adımında tamamen benzersiz 5 kelime filtrelenir
        let workingSubset = [];
        for (let i = 0; i < 5; i++) {
            workingSubset.push(pool[(startIdx + i) % pool.length]);
        }

        const buildLayout = computeCrosswordLayout(workingSubset);
        activeWords = buildLayout.placedWords;
        renderGrid(buildLayout.matrix);
        renderClues(lang);
    }

    function computeCrosswordLayout(words) {
        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        let placedWords = [];
        
        if(words.length === 0) return { matrix: localMatrix, placedWords: [] };

        // İlk kelimeyi merkeze yatay olarak güvenle yerleştir
        let first = words[0];
        let fRow = Math.floor(matrixSize / 2) - 1;
        let fCol = Math.max(0, Math.floor((matrixSize - first.word.length) / 2));
        
        for (let i = 0; i < first.word.length; i++) {
            localMatrix[fRow][fCol + i] = { letter: first.word[i], isStart: i === 0, num: 1 };
        }
        placedWords.push({ ...first, row: fRow, col: fCol, dir: "across", num: 1 });

        let globalCounter = 2;

        // Diğer kelimeleri sadece geçerli kesişim kurallarına göre yerleştir
        for (let w = 1; w < words.length; w++) {
            let item = words[w];
            let placed = false;

            for (let r = 0; r < matrixSize && !placed; r++) {
                for (let c = 0; c < matrixSize && !placed; c++) {
                    if (localMatrix[r][c] !== null) {
                        let letterMatch = localMatrix[r][c].letter;
                        let matchIdx = item.word.indexOf(letterMatch);

                        if (matchIdx !== -1) {
                            // Dikey yerleşimi dene
                            let startR = r - matchIdx;
                            let startC = c;
                            if (validateStrictPlacement(item.word, startR, startC, "down", localMatrix, r, c)) {
                                for (let i = 0; i < item.word.length; i++) {
                                    let currR = startR + i;
                                    if (!localMatrix[currR][startC]) {
                                        localMatrix[currR][startC] = { letter: item.word[i], isStart: i === 0, num: i === 0 ? globalCounter : null };
                                    } else if (i === 0) {
                                        localMatrix[currR][startC].num = globalCounter;
                                    }
                                }
                                placedWords.push({ ...item, row: startR, col: startC, dir: "down", num: globalCounter++ });
                                placed = true;
                            }

                            // Yatay yerleşimi dene
                            if (!placed) {
                                let startH_R = r;
                                let startH_C = c - matchIdx;
                                if (validateStrictPlacement(item.word, startH_R, startH_C, "across", localMatrix, r, c)) {
                                    for (let i = 0; i < item.word.length; i++) {
                                        let currC = startH_C + i;
                                        if (!localMatrix[startH_R][currC]) {
                                            localMatrix[startH_R][currC] = { letter: item.word[i], isStart: i === 0, num: i === 0 ? globalCounter : null };
                                        } else if (i === 0) {
                                            localMatrix[startH_R][currC].num = globalCounter;
                                        }
                                    }
                                    placedWords.push({ ...item, row: startH_R, col: startH_C, dir: "across", num: globalCounter++ });
                                    placed = true;
                                }
                            }
                        }
                    }
                }
            }

            // Eğer kelime kesişecek legal bir nokta bulamazsa, matrisi bozmaması için izole bir satıra güvenle yerleştirilir
            if (!placed) {
                let fallbackRow = (w * 2.5) % matrixSize;
                if(fallbackRow === fRow) fallbackRow = (fallbackRow + 2) % matrixSize;
                let fallbackCol = 1;
                
                if (validateStrictPlacement(item.word, fallbackRow, fallbackCol, "across", localMatrix, -1, -1)) {
                    for(let i=0; i<item.word.length; i++) {
                        localMatrix[fallbackRow][fallbackCol + i] = { letter: item.word[i], isStart: i===0, num: i===0 ? globalCounter : null };
                    }
                    placedWords.push({ ...item, row: fallbackRow, col: fallbackCol, dir: "across", num: globalCounter++ });
                }
            }
        }

        return { matrix: localMatrix, placedWords: placedWords };
    }

    // YAN YANA GELEN HARFLERİN ANLAMSIZ KELİMELER ÜRETMESİNİ ENGELLEYEN SIKI KONTROL MOTORU
    function validateStrictPlacement(word, startR, startC, dir, matrix, intersectR, intersectC) {
        if (startR < 0 || startC < 0) return false;
        if (dir === "down" && startR + word.length > matrixSize) return false;
        if (dir === "across" && startC + word.length > matrixSize) return false;

        for (let i = 0; i < word.length; i++) {
            let r = dir === "down" ? startR + i : startR;
            let c = dir === "down" ? startC : startC + i;

            if (r === intersectR && c === intersectC) continue;

            // Hücre doluysa ve harf uyuşmuyorsa geçersizdir
            if (matrix[r][c] !== null && matrix[r][c].letter !== word[i]) return false;

            // Çevre hücre (adjacency) kontrolü - Komşu harflerin birbirini bozup anlamsızlaşmasını engeller
            if (matrix[r][c] === null) {
                if (dir === "down") {
                    if (c > 0 && matrix[r][c - 1] !== null) return false;
                    if (c < matrixSize - 1 && matrix[r][c + 1] !== null) return false;
                } else {
                    if (r > 0 && matrix[r - 1][c] !== null) return false;
                    if (r < matrixSize - 1 && matrix[r + 1][c] !== null) return false;
                }
            }
        }
        return true;
    }

    function renderGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 36px)`;
        container.style.gridTemplateRows = `repeat(${matrixSize}, 36px)`;
        inputElements = {};

        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                const cell = matrixData[r][c];
                const div = document.createElement('div');
                
                if (cell) {
                    div.className = 'cell active';
                    if (cell.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = cell.num;
                        div.appendChild(numSpan);
                    }

                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.maxLength = 1;
                    
                    inp.addEventListener('input', (e) => {
                        inp.value = e.target.value.toUpperCase();
                        verifyLinguisticGrid();
                    });

                    inp.addEventListener('focus', () => {
                        currentFocusCell = { row: r, col: c, element: inp };
                    });

                    inputElements[`${r}-${c}`] = inp;
                    div.appendChild(inp);
                } else {
                    div.className = 'cell';
                }
                container.appendChild(div);
            }
        }
    }

    function getStructuralHint() {
        if (currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            const cell = gridMatrix[currentFocusCell.row][currentFocusCell.col];
            currentFocusCell.element.value = cell.letter;
            verifyLinguisticGrid();
        }
    }

    function renderClues(lang) {
        const acrossContainer = document.getElementById('across-clues');
        const downContainer = document.getElementById('down-clues');
        acrossContainer.innerHTML = '';
        downContainer.innerHTML = '';

        activeWords.forEach(item => {
            const clueDiv = document.createElement('div');
            clueDiv.className = 'clue-item';
            clueDiv.innerHTML = `
                <div class="clue-text"><strong>${item.num}</strong> ${item.clue}</div>
                <button class="audio-trigger" onclick="executePhoneticSynthesis('${item.word}', '${lang}')">🔊</button>
            `;
            if (item.dir === 'across') acrossContainer.appendChild(clueDiv);
            else downContainer.appendChild(clueDiv);
        });
    }

    function executePhoneticSynthesis(word, langCode) {
        if ('speechSynthesis' in window) {
            let utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = langCode;
            window.speechSynthesis.speak(utterance);
        }
    }

    function verifyLinguisticGrid() {
        let allCorrect = true;
        let activeCount = 0;
        
        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                if (gridMatrix[r][c]) {
                    activeCount++;
                    const userVal = inputElements[`${r}-${c}`].value;
                    if (userVal !== gridMatrix[r][c].letter) {
                        allCorrect = false;
                    }
                }
            }
        }
        
        if (allCorrect && activeCount > 0) {
            buildCorpusAnalysisTable();
        }
    }

    function buildCorpusAnalysisTable() {
        const tableBody = document.getElementById('corpus-table-body');
        tableBody.innerHTML = '';
        
        activeWords.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="font-weight: bold; letter-spacing:1px; color:#1b5e20;">${item.word}</td>
                <td>${item.clue}</td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('corpus-index-area').style.display = 'block';
        document.getElementById('corpus-index-area').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
