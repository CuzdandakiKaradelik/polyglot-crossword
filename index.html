<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubBurner - SaaS & Subscription Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; }
        .smooth { transition: all 0.25s ease; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen text-slate-200 antialiased tracking-tight" x-data="subBurnerEngine()">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
            <span class="font-extrabold text-sm tracking-wider text-white">SUBBURNER // FINANCE</span>
        </div>
        <div class="text-[11px] font-mono text-slate-400 bg-slate-950 px-3 py-1 rounded-lg border border-slate-800">
            💵 1 USD = 32 TL | 💶 1 EUR = 35 TL (Sabit Kur)
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 h-fit space-y-4">
            <h2 class="text-sm font-bold text-white tracking-wide">💳 Abonelik Ekle</h2>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Servis Adı</label>
                    <input type="text" x-model="form.name" placeholder="Örn: Netflix, AWS, ChatGPT" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-rose-500 smooth">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Fiyat</label>
                        <input type="number" x-model.number="form.price" placeholder="0.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-rose-500 smooth">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Döviz Cinsi</label>
                        <select x-model="form.currency" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-rose-500 smooth">
                            <option value="TRY">TRY (TL)</option>
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Periyot</label>
                        <select x-model="form.period" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-rose-500 smooth">
                            <option value="monthly">Aylık</option>
                            <option value="yearly">Yıllık</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Kategori</label>
                        <select x-model="form.category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-rose-500 smooth">
                            <option value="Eğlence">Eğlence</option>
                            <option value="Yazılım/Altyapı">Yazılım/Altyapı</option>
                            <option value="Üretkenlik/AI">Üretkenlik/AI</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                    </div>
                </div>

                <button @click="addSubscription()" class="w-full py-2.5 bg-gradient-to-r from-rose-500 to-amber-500 hover:from-rose-400 hover:to-amber-400 text-white font-bold rounded-xl text-xs uppercase tracking-wider smooth shadow-lg shadow-rose-500/10 pt-2 cursor-pointer">
                    🚀 Radara Ekle
                </button>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Aylık Toplam Yük (Net)</span>
                    <div class="flex items-baseline gap-1 mt-2">
                        <span class="text-3xl font-black text-rose-500" x-text="formatTL(totalMonthlyVolume())"></span>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-1">Yıllık tahmini harcama: <span class="text-slate-300 font-bold" x-text="formatTL(totalMonthlyVolume() * 12)"></span></p>
                </div>

                <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">En Pahalı Odak Noktası</span>
                    <div class="mt-2">
                        <span class="text-xl font-bold text-amber-400" x-text="getTopCategory()"></span>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-1">En çok bu sektöre bütçe yakıyorsunuz.</p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-800 bg-slate-950/40 flex items-center justify-between">
                    <h3 class="text-xs font-bold text-white uppercase tracking-wider">Aktif Abonelikler Radarı</h3>
                    <span class="text-[10px] text-slate-400 font-mono" x-text="subscriptions.length + ' Servis Takipte'"></span>
                </div>

                <div class="divide-y divide-slate-800/60 max-h-[400px] overflow-y-auto">
                    <template x-for="sub in subscriptions" :key="sub.id">
                        <div class="p-4 flex items-center justify-between hover:bg-slate-950/20 smooth">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <h4 class="text-sm font-bold text-white" x-text="sub.name"></h4>
                                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400" x-text="sub.category"></span>
                                </div>
                                <p class="text-[11px] text-slate-500" x-text="sub.period === 'monthly' ? 'Aylık yenilenir' : 'Yıllık yenilenir'"></p>
                            </div>

                            <div class="flex items-center gap-4">
                                <div class="text-right">
                                    <span class="text-sm font-bold text-slate-200" x-text="formatOriginal(sub.price, sub.currency)"></span>
                                    <span x-show="sub.currency !== 'TRY'" class="text-[10px] text-slate-500 block" x-text="'~' + formatTL(convertToTL(sub.price, sub.currency))"></span>
                                </div>
                                <button @click="deleteSubscription(sub.id)" class="text-slate-600 hover:text-rose-400 smooth cursor-pointer text-xs p-1">✕</button>
                            </div>
                        </div>
                    </template>

                    <template x-if="subscriptions.length === 0">
                        <div class="p-12 text-center text-xs text-slate-500 italic">
                            Şu an takip edilen abonelik yok. Kartlarını güvende tutmak için bir tane ekle!
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </main>

    <script>
        function subBurnerEngine() {
            return {
                subscriptions: [],
                rates: { USD: 32, EUR: 35, TRY: 1 }, // Simüle döviz kurları
                form: {
                    name: '',
                    price: null,
                    currency: 'TRY',
                    period: 'monthly',
                    category: 'Eğlence'
                },

                init() {
                    const saved = localStorage.getItem('subburner_data');
                    if (saved) this.subscriptions = JSON.parse(saved);
                },

                save() {
                    localStorage.setItem('subburner_data', JSON.stringify(this.subscriptions));
                },

                addSubscription() {
                    if (!this.form.name.trim() || !this.form.price) {
                        alert('Lütfen servis adı ve geçerli bir fiyat girin!');
                        return;
                    }

                    this.subscriptions.push({
                        id: 'sub_' + Date.now(),
                        name: this.form.name,
                        price: this.form.price,
                        currency: this.form.currency,
                        period: this.form.period,
                        category: this.form.category
                    });

                    // Form temizliği
                    this.form.name = '';
                    this.form.price = null;
                    
                    this.save();
                },

                deleteSubscription(id) {
                    this.subscriptions = this.subscriptions.filter(s => s.id !== id);
                    this.save();
                },

                convertToTL(price, currency) {
                    return price * (this.rates[currency] || 1);
                },

                // Tüm servisleri normalize edip "Aylık TL" yükünü hesaplama
                totalMonthlyVolume() {
                    return this.subscriptions.reduce((sum, sub) => {
                        let tlPrice = this.convertToTL(sub.price, sub.currency);
                        // Eğer yıllıksa aylık yükünü bulmak için 12'ye bölüyoruz
                        let monthlyCost = sub.period === 'yearly' ? (tlPrice / 12) : tlPrice;
                        return sum + monthlyCost;
                    }, 0);
                },

                // En çok harcama yapılan kategoriyi bulma
                getTopCategory() {
                    if (this.subscriptions.length === 0) return 'Veri Yok';
                    
                    let cats = {};
                    this.subscriptions.forEach(sub => {
                        let tlPrice = this.convertToTL(sub.price, sub.currency);
                        let monthly = sub.period === 'yearly' ? (tlPrice / 12) : tlPrice;
                        cats[sub.category] = (cats[sub.category] || 0) + monthly;
                    });

                    return Object.keys(cats).reduce((a, b) => cats[a] > cats[b] ? a : b);
                },

                formatTL(val) {
                    return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(val);
                },

                formatOriginal(val, curr) {
                    let symbol = curr === 'USD' ? '$' : (curr === 'EUR' ? '€' : 'TL');
                    return val + ' ' + symbol;
                }
            }
        }
    </script>
</body>
</html>
