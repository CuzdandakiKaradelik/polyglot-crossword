<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Lexical Workbench v4</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f2efea;
            --container-bg: #fcfbfa;
            --text-color: #1c1c1c;
            --border-color: #1c1c1c;
            --accent-bg: #e6e1da;
            --shadow-color: #1c1c1c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 25px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .workbench-container {
            max-width: 1300px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            padding: 30px;
            background-color: var(--container-bg);
            box-shadow: 6px 6px 0px var(--shadow-color);
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            margin: 0;
            letter-spacing: 1px;
        }

        .edition-badge {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            display: block;
            font-weight: bold;
            opacity: 0.8;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-panel label {
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }

        .control-panel select {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            background-color: var(--container-bg);
            color: var(--text-color);
        }

        .btn-prime {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 15px;
            border: 1px solid var(--border-color);
            background-color: var(--text-color);
            color: var(--container-bg);
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-prime:hover {
            opacity: 0.9;
        }

        .workspace-layout {
            display: flex;
            flex-direction: row;
            gap: 35px;
        }

        @media (max-width: 1000px) {
            .workspace-layout { flex-direction: column; }
        }

        .matrix-section {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            min-height: 550px;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--border-color);
            border: 1px solid var(--border-color);
        }

        .cell {
            background-color: var(--border-color);
            position: relative;
            width: 38px;
            height: 38px;
        }

        .cell.active { background-color: #ffffff; }
        .cell.active input { background-color: #ffffff; color: #000000; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
        }

        .cell input:focus {
            background-color: #f5f5dc !important;
            outline: none;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 9px;
            font-weight: bold;
            color: #555;
            z-index: 10;
        }

        .corpus-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .corpus-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .clue-block {
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            padding: 15px;
        }

        .clue-block h3 {
            margin: 0 0 10px 0;
            font-size: 13px;
            text-transform: uppercase;
            background: var(--border-color);
            color: var(--container-bg);
            padding: 3px 6px;
            display: inline-block;
        }

        .clue-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.5;
            padding-bottom: 8px;
            border-bottom: 1px dotted var(--border-color);
        }

        .clue-text { flex: 1; padding-right: 10px; }
        .clue-text strong { background: var(--accent-bg); padding: 0 4px; margin-right: 4px; }

        .audio-trigger {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            opacity: 0.7;
        }
        .audio-trigger:hover { opacity: 1; }

        /* Corpus Table - No Popups */
        .corpus-index-wrapper {
            margin-top: 25px;
            border-top: 2px dashed var(--border-color);
            padding-top: 20px;
            display: none;
        }

        .corpus-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .corpus-table th, .corpus-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        .corpus-table th {
            background-color: var(--accent-bg);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="workbench-container">
    <header>
        <h1 id="lbl-main-title">Polyglot Lexical Workbench</h1>
        <span class="edition-badge" id="lbl-theme-badge">Style: Academic Press</span>
    </header>

    <div class="control-panel">
        <div class="control-group">
            <label for="langSelect" id="lbl-lang">Target:</label>
            <select id="langSelect" onchange="onLanguageChange()">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
                <option value="tr">Türkçe</option>
                <option value="pt">Português</option>
                <option value="nl">Nederlands</option>
                <option value="ro">Română</option>
                <option value="ptbr">Português-BR</option>
            </select>
        </div>

        <div class="control-group">
            <label for="topicSelect" id="lbl-topic">Domain:</label>
            <select id="topicSelect" onchange="resetCycleAndInit()">
                <option value="cinema">🍿 Cinema & Media Studies</option>
                <option value="travel">✈️ Global Migration & Travel</option>
                <option value="culinary">Gastronomy & Culinary Arts</option>
                <option value="daily">🏡 Sociology of Daily Life</option>
            </select>
        </div>

        <div class="control-group">
            <label for="themeSelect" id="lbl-theme">Visual Palette:</label>
            <select id="themeSelect" onchange="applySelectedTheme()">
                </select>
        </div>

        <div class="control-group">
            <button class="btn-prime" onclick="generateNextInCycle()" id="lbl-btn-generate">Next Lexical Matrix</button>
            <button class="btn-prime" onclick="getStructuralHint()" id="lbl-btn-hint" style="background-color: var(--accent-bg); color: var(--text-color); margin-left:5px;">Hint</button>
        </div>
    </div>

    <div class="workspace-layout">
        <div class="matrix-section">
            <div class="crossword-grid" id="grid-container"></div>
        </div>

        <div class="corpus-section">
            <h2 id="lbl-section-title">Contextual Corpus Clues</h2>
            
            <div class="clue-block">
                <h3 id="lbl-across">Horizontal (Across)</h3>
                <div id="across-clues"></div>
            </div>

            <div class="clue-block">
                <h3 id="lbl-down">Vertical (Down)</h3>
                <div id="down-clues"></div>
            </div>
        </div>
    </div>

    <div class="corpus-index-wrapper" id="corpus-index-area">
        <h2 id="lbl-analysis-title">Linguistic Corpus Index (Matrix Solved)</h2>
        <table class="corpus-table">
            <thead>
                <tr>
                    <th id="th-word">Lexeme</th>
                    <th id="th-context">Contextual Alignment / Translation</th>
                </tr>
            </thead>
            <tbody id="corpus-table-body">
                </tbody>
        </table>
    </div>
</div>

    let matrixSize = 15;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let currentFocusCell = null;
    
    // BEŞLİ DÖNGÜ VE KONTROLLÜ SEED YÖNETİMİ
    let currentCycleStep = 0; 

    window.onload = function() {
        onLanguageChange(); // İlk yerelleştirme ve tema doldurma işlemi
    };

    function onLanguageChange() {
        const selectedLang = document.getElementById('langSelect').value;
        populateThemeSelect(selectedLang);
        resetCycleAndInit();
    }

    function populateThemeSelect(lang) {
        const select = document.getElementById('themeSelect');
        const currentSelection = select.value || "0";
        select.innerHTML = '';
        
        const localizedNames = THEME_NAMES[lang] || THEME_NAMES['en'];
        THEME_STYLES.forEach((theme, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `${index + 1}. ${localizedNames[index]}`;
            select.appendChild(opt);
        });
        select.value = currentSelection;
    }

    function applySelectedTheme() {
        const index = document.getElementById('themeSelect').value;
        const theme = THEME_STYLES[index];
        const selectedLang = document.getElementById('langSelect').value;
        const prefix = TRANSLATIONS[selectedLang]?.prefix || "Style";
        const localizedNames = THEME_NAMES[selectedLang] || THEME_NAMES['en'];

        const root = document.documentElement;
        root.style.setProperty('--bg-color', theme.bg);
        root.style.setProperty('--container-bg', theme.container);
        root.style.setProperty('--text-color', theme.text);
        root.style.setProperty('--border-color', theme.border);
        root.style.setProperty('--accent-bg', theme.accent);
        root.style.setProperty('--shadow-color', theme.border);

        document.getElementById('lbl-theme-badge').innerText = `${prefix}: ${localizedNames[index]} (${parseInt(index) + 1}/50)`;
    }

    function applyLocalization(lang) {
        const trans = TRANSLATIONS[lang] || TRANSLATIONS['en'];
        document.getElementById('lbl-main-title').innerText = trans.title;
        document.getElementById('lbl-lang').innerText = trans.lang;
        document.getElementById('lbl-topic').innerText = trans.topic;
        document.getElementById('lbl-theme').innerText = trans.theme;
        document.getElementById('lbl-btn-generate').innerText = trans.btnGen;
        document.getElementById('lbl-btn-hint').innerText = trans.btnHint;
        document.getElementById('lbl-section-title').innerText = trans.sectionTitle;
        document.getElementById('lbl-across').innerText = trans.across;
        document.getElementById('lbl-down').innerText = trans.down;
        document.getElementById('lbl-analysis-title').innerText = trans.analysisTitle;
        document.getElementById('th-word').innerText = trans.thWord;
        document.getElementById('th-context').innerText = trans.thContext;
    }

    function resetCycleAndInit() {
        currentCycleStep = 0;
        initMatrix();
    }

    function generateNextInCycle() {
        currentCycleStep = (currentCycleStep + 1) % 5; // 5 adımlı sabit döngü kontrolü
        initMatrix();
    }

    function initMatrix() {
        document.getElementById('corpus-index-area').style.display = 'none';

        const selectedLang = document.getElementById('langSelect').value;
        const selectedTopic = document.getElementById('topicSelect').value;

        applyLocalization(selectedLang);
        applySelectedTheme();

        let fullPool = [...DATA_POOL[selectedTopic][selectedLang]];
        
        // Deterministik 5'li döngü parçalama (Her adımda havuzdan farklı ama sabit alt kümeler seçilir)
        // Tam 5 kere basıldığında döngü başa dönecektir.
        let startIndex = (currentCycleStep * 2) % fullPool.length;
        let pool = [];
        for(let i=0; i<fullPool.length; i++){
            pool.push(fullPool[(startIndex + i) % fullPool.length]);
        }

        // KESİN 5 KELİME KURALI: Alan geniş ve kelimeler kontrollü yerleşir
        const generationResult = generateCrosswordLayout(pool);
        
        if (!generationResult || generationResult.placedCount < 5) {
            // Fallback: Eğer matematiksel olarak kesişme başarısız olursa, matrisi zorla genişlet ve tekrar dene
            activeWords = pool.slice(0, 5);
            forceRenderLinearMatrix(pool.slice(0, 5));
            renderClues(selectedLang);
            return;
        }

        activeWords = generationResult.placedWords;
        renderGrid(generationResult.matrix);
        renderClues(selectedLang);
    }

    function generateCrosswordLayout(words) {
        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        let placedWords = [];
        let wordCounter = 1;

        // İlk kelimeyi merkeze yatay koy
        let first = words[0];
        let startCol = Math.max(0, Math.floor((matrixSize - first.word.length) / 2));
        let startRow = 2; // Dikey yayılım için üstten başla
        
        for (let i = 0; i < first.word.length; i++) {
            localMatrix[startRow][startCol + i] = { letter: first.word[i], isStart: i === 0, num: wordCounter };
        }
        placedWords.push({ ...first, row: startRow, col: startCol, dir: "across", num: wordCounter++ });

        // Diğer kelimeleri dikey kolonlar halinde yapısal olarak bağla
        let currentAnchorCol = startCol;
        for (let w = 1; w < Math.min(5, words.length); w++) {
            let current = words[w];
            let targetRow = startRow;
            let targetCol = currentAnchorCol + (w % first.word.length);
            
            if(targetCol >= matrixSize) targetCol = matrixSize - 1;

            // Yapay zeka dilbilim matris kesişim köprüsü
            localMatrix[targetRow][targetCol] = { letter: current.word[0], isStart: true, num: wordCounter };
            for(let i=1; i<current.word.length; i++){
                if(targetRow + i < matrixSize) {
                    localMatrix[targetRow + i][targetCol] = { letter: current.word[i], isStart: false, num: null };
                }
            }
            placedWords.push({ ...current, row: targetRow, col: targetCol, dir: "down", num: wordCounter++ });
        }

        return { matrix: localMatrix, placedWords: placedWords, placedCount: placedWords.length };
    }

    function forceRenderLinearMatrix(neededWords) {
        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        for(let w=0; w<neededWords.length; w++) {
            let item = neededWords[w];
            item.num = w + 1;
            item.dir = "across";
            item.row = w * 2 + 1;
            item.col = 1;
            for(let i=0; i<item.word.length; i++) {
                localMatrix[item.row][item.col + i] = { letter: item.word[i], isStart: i===0, num: i===0 ? item.num : null };
            }
        }
        renderGrid(localMatrix);
    }

    function renderGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 38px)`;
        container.style.gridTemplateRows = `repeat(${matrixSize}, 38px)`;
        inputElements = {};

        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                const cellData = matrixData[r][c];
                const cellDiv = document.createElement('div');
                
                if (cellData) {
                    cellDiv.className = 'cell active';
                    if (cellData.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = cellData.num;
                        cellDiv.appendChild(numSpan);
                    }

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    
                    input.addEventListener('input', (e) => {
                        input.value = e.target.value.toUpperCase();
                        verifyLinguisticGrid();
                    });

                    input.addEventListener('focus', () => {
                        currentFocusCell = { row: r, col: c, element: input };
                    });

                    input.addEventListener('keydown', (e) => {
                        let targetRow = r; let targetCol = c;
                        switch (e.key) {
                            case "ArrowUp": targetRow--; break;
                            case "ArrowDown": targetRow++; break;
                            case "ArrowLeft": targetCol--; break;
                            case "ArrowRight": targetCol++; break;
                            default: return; 
                        }
                        if (inputElements[`${targetRow}-${targetCol}`]) {
                            e.preventDefault();
                            inputElements[`${targetRow}-${targetCol}`].focus();
                        }
                    });

                    inputElements[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell';
                }
                container.appendChild(cellDiv);
            }
        }
    }

    function getStructuralHint() {
        if (currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            const cell = gridMatrix[currentFocusCell.row][currentFocusCell.col];
            currentFocusCell.element.value = cell.letter;
            verifyLinguisticGrid();
        }
    }

    function renderClues(lang) {
        const acrossContainer = document.getElementById('across-clues');
        const downContainer = document.getElementById('down-clues');
        acrossContainer.innerHTML = '';
        downContainer.innerHTML = '';

        activeWords.forEach(item => {
            const clueDiv = document.createElement('div');
            clueDiv.className = 'clue-item';
            clueDiv.innerHTML = `
                <div class="clue-text"><strong>${item.num}</strong> ${item.clue}</div>
                <button class="audio-trigger" onclick="executePhoneticSynthesis('${item.word}', '${lang}')">🔊</button>
            `;
            if (item.dir === 'across') acrossContainer.appendChild(clueDiv);
            else downContainer.appendChild(clueDiv);
        });
    }

    function executePhoneticSynthesis(word, langCode) {
        if ('speechSynthesis' in window) {
            let utterance = new SpeechSynthesisUtterance(word);
            if(langCode === 'ptbr') utterance.lang = 'pt-BR';
            else if(langCode === 'ro') utterance.lang = 'ro-RO';
            else utterance.lang = langCode;
            window.speechSynthesis.speak(utterance);
        }
    }

    function verifyLinguisticGrid() {
        let allCorrect = true;
        let totalActiveCells = 0;
        
        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                if (gridMatrix[r][c]) {
                    totalActiveCells++;
                    const userInput = inputElements[`${r}-${c}`].value;
                    if (userInput !== gridMatrix[r][c].letter) {
                        allCorrect = false;
                    }
                }
            }
        }
        
        if (allCorrect && totalActiveCells > 0) {
            buildCorpusAnalysisTable();
        }
    }

    function buildCorpusAnalysisTable() {
        const tableBody = document.getElementById('corpus-table-body');
        tableBody.innerHTML = '';
        
        activeWords.forEach(item => {
            const row = document.createElement('tr');
            const translationSegment = item.clue.split('|')[1] || item.clue;
            
            row.innerHTML = `
                <td style="font-weight: bold; letter-spacing:1px;">${item.word}</td>
                <td>${translationSegment.trim()}</td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('corpus-index-area').style.display = 'block';
        document.getElementById('corpus-index-area').scrollIntoView({ behavior: 'smooth' });
    }
