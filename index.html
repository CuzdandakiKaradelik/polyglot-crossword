<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sözcük Matrisi Masası v6.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f7f5f0;
            --container-bg: #ffffff;
            --text-color: #2b2b2b;
            --border-color: #2b2b2b;
            --accent-bg: #f0ede5;
            --shadow-color: rgba(43, 43, 43, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        /* --- SADE VE KULLANICI DOSTU GİRİŞ EKRANI --- */
        .welcome-screen {
            max-width: 700px;
            margin: 50px auto;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            box-shadow: 8px 8px 0px var(--border-color);
            border-radius: 12px;
            text-align: center;
        }

        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin: 0 0 10px 0;
        }

        .welcome-subtitle {
            font-size: 14px;
            opacity: 0.7;
            display: block;
            margin-bottom: 35px;
        }

        /* Buton Grupları */
        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .start-action-btn {
            font-family: 'Courier Prime', monospace;
            font-size: 18px;
            font-weight: bold;
            background-color: var(--text-color);
            color: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 16px 40px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 360px;
        }

        .start-action-btn:hover {
            transform: translateY(-2px);
            background-color: var(--accent-bg);
            color: var(--text-color);
        }

        .random-action-btn {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: bold;
            background-color: transparent;
            color: var(--text-color);
            border: 2px dashed var(--border-color);
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 360px;
        }

        .random-action-btn:hover {
            background-color: var(--text-color);
            color: var(--container-bg);
            border-style: solid;
        }

        /* Kolay Ayar Kartları */
        .quick-settings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: left;
            border-top: 1px solid var(--accent-bg);
            padding-top: 25px;
        }

        @media (max-width: 650px) {
            .quick-settings-grid { grid-template-columns: 1fr; }
        }

        .setting-card {
            background: var(--accent-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid transparent;
        }

        .setting-card label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .setting-card select {
            width: 100%;
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
        }

        /* --- OYUN ALANI (MAIN WORKSPACE) --- */
        .main-workspace {
            display: none;
            max-width: 1250px;
            margin: 0 auto;
            border: 2px solid var(--border-color);
            padding: 30px;
            background-color: var(--container-bg);
            box-shadow: 8px 8px 0px var(--border-color);
            border-radius: 12px;
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin: 0;
        }

        .edition-badge {
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 5px;
            display: block;
            opacity: 0.7;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 25px;
            padding: 12px;
            background: var(--accent-bg);
            border-radius: 6px;
            flex-wrap: wrap;
        }

        .btn-prime {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--text-color);
            color: var(--container-bg);
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .btn-prime:hover {
            opacity: 0.9;
        }

        .workspace-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
        }

        @media (max-width: 950px) {
            .workspace-layout { flex-direction: column; }
        }

        .matrix-section {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            min-height: 500px;
            border-radius: 6px;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--border-color);
        }

        .cell {
            background-color: var(--border-color);
            position: relative;
            width: 38px;
            height: 38px;
        }

        .cell.active { background-color: #ffffff; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
        }

        .cell input:focus {
            background-color: #f5f5dc !important;
            outline: none;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 9px;
            font-weight: bold;
            color: #555;
            z-index: 10;
        }

        .corpus-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .corpus-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .clue-block {
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            padding: 15px;
            border-radius: 6px;
        }

        .clue-block h3 {
            margin: 0 0 10px 0;
            font-size: 12px;
            text-transform: uppercase;
            background: var(--border-color);
            color: var(--container-bg);
            padding: 3px 6px;
            display: inline-block;
            border-radius: 3px;
        }

        .clue-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.5;
            padding-bottom: 8px;
            border-bottom: 1px dotted var(--border-color);
        }

        .clue-text { flex: 1; padding-right: 10px; }
        .clue-text strong { background: var(--accent-bg); padding: 0 4px; margin-right: 4px; }

        .audio-trigger {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            opacity: 0.7;
        }
        .audio-trigger:hover { opacity: 1; }

        .corpus-index-wrapper {
            margin-top: 25px;
            border-top: 2px dashed var(--border-color);
            padding-top: 20px;
            display: none;
        }

        .corpus-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .corpus-table th, .corpus-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        .corpus-table th {
            background-color: var(--accent-bg);
            text-transform: uppercase;
        }
    </style>
</head>

    <div class="quick-settings-grid">

                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
            </select>
        </div>

        <div class="setting-card">
            <label for="topicSelect" id="lbl-cfg-topic">Kelime Alanı</label>
            <select id="topicSelect" onchange="resetCycle()">
                <option value="cinema">🍿 Sinema & Medya</option>
                <option value="travel">✈️ Seyahat & Göç</option>
                <option value="culinary">🍳 Gastronomi & Mutfak</option>
                <option value="daily">🏡 Günlük Yaşam</option>
                <option value="law">⚖️ Hukuk & Adalet</option>
                <option value="business">💼 Ekonomi & İş Dünyası</option>
                <option value="science">🧬 Bilim & Teknoloji</option>
                <option value="history">🏛️ Tarih & Arkeoloji</option>
                <option value="art">🎨 Sanat & Edebiyat</option>
                <option value="psychology">🧠 Psikoloji & Felsefe</option>
            </select>
        </div>

        <div class="setting-card">
            <label for="themeSelect" id="lbl-cfg-theme">Renk Teması</label>
            <select id="themeSelect" onchange="applySelectedTheme()">
                </select>
        </div>
    </div>
</div>

<div class="main-workspace" id="workspace-area">
    <header>
        <h1 id="lbl-main-title">Dil Bulmacası Masası</h1>
        <span class="edition-badge" id="lbl-theme-badge">Tema: Akademik</span>
    </header>

    <div class="control-panel">
        <div class="control-group">
            <button class="btn-prime" onclick="returnToLauncher()" id="lbl-btn-back">⬅ Giriş Ekranına Dön</button>
        </div>
        <div class="control-group">
            <button class="btn-prime" onclick="generateNextInCycle()" id="lbl-btn-generate">Yeni Bulmaca Üret</button>
            <button class="btn-prime" onclick="getStructuralHint()" id="lbl-btn-hint" style="background-color: var(--accent-bg); color: var(--text-color); margin-left:5px;">İpucu Ver</button>
        </div>
    </div>

    <div class="workspace-layout">
        <div class="matrix-section">
            <div class="crossword-grid" id="grid-container"></div>
        </div>

        <div class="corpus-section">
            <h2 id="lbl-section-title">Kelime İpuçları ve Kanıtlar</h2>
            
            <div class="clue-block">
                <h3 id="lbl-across">Yatay (Across)</h3>
                <div id="across-clues"></div>
            </div>

            <div class="clue-block">
                <h3 id="lbl-down">Dikey (Down)</h3>
                <div id="down-clues"></div>
            </div>
        </div>
    </div>

    <div class="corpus-index-wrapper" id="corpus-index-area">
        <h2 id="lbl-analysis-title">Tebrikler! Kelime Analiz İndeksi</h2>
        <table class="corpus-table">
            <thead>
                <tr>

                    <th id="th-context">Bağlam / Anlam Açıklaması</th>
                </tr>
            </thead>
            <tbody id="corpus-table-body">
                </tbody>
        </table>
    </div>
</div>

            for(let i=0; i<50; i++) {
                let w = seedArray[i % seedArray.length];
                if(i >= seedArray.length) w = w + (Math.floor(i/seedArray.length) + 1); 
                
                let clueStr = "";
                if(lang === 'tr') clueStr = `Leksik bağlamda analiz edilen, ilgili alana ait '${w}' yapısı. [Index: ${i+1}]`;
                else clueStr = `Linguistic corpus node representing '${w}' in this domain. | Anlamı/Sözlük Yapısı [Index: ${i+1}]`;

                DATA_POOL[topic][lang].push({ word: w.toUpperCase(), clue: clueStr });
            }
        });
    });

    let matrixSize = 15;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let currentFocusCell = null;
    let currentCycleStep = 0; 

    window.onload = function() {
        onLanguageChange();
    };

    function onLanguageChange() {
        const selectedLang = document.getElementById('langSelect').value;
        const themeLang = (selectedLang === 'tr') ? 'tr' : 'en';
        populateThemeSelect(themeLang);
        applyLocalization(selectedLang);
        applySelectedTheme();
    }

    function populateThemeSelect(lang) {
        const select = document.getElementById('themeSelect');
        const currentSelection = select.value || "0";
        select.innerHTML = '';
        
        const localizedNames = THEME_NAMES[lang] || THEME_NAMES['en'];
        THEME_STYLES.forEach((theme, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `${index + 1}. ${localizedNames[index]}`;
            select.appendChild(opt);
        });
        select.value = currentSelection;
    }

    function applySelectedTheme() {
        const index = document.getElementById('themeSelect').value || 0;
        const theme = THEME_STYLES[index];
        const selectedLang = document.getElementById('langSelect').value;
        const trans = TRANSLATIONS[selectedLang] || TRANSLATIONS['tr'];

        const root = document.documentElement;
        root.style.setProperty('--bg-color', theme.bg);
        root.style.setProperty('--container-bg', theme.container);
        root.style.setProperty('--text-color', theme.text);
        root.style.setProperty('--border-color', theme.border);
        root.style.setProperty('--accent-bg', theme.accent);
        root.style.setProperty('--shadow-color', 'rgba(0,0,0,0.05)');

        const themeLang = (selectedLang === 'tr') ? 'tr' : 'en';
        const localizedNames = THEME_NAMES[themeLang] || THEME_NAMES['en'];
        document.getElementById('lbl-theme-badge').innerText = `${trans.prefix}: ${localizedNames[index]} (${parseInt(index)+1}/80)`;
    }

    function applyLocalization(lang) {
        const trans = TRANSLATIONS[lang] || TRANSLATIONS['tr'];
        
        document.getElementById('lbl-launch-title').innerText = trans.launchTitle;
        document.getElementById('lbl-launch-subtitle').innerText = trans.launchSubtitle;
        document.getElementById('btn-menu-start').innerText = trans.menuStart;
        document.getElementById('btn-menu-random').innerText = trans.menuRandom;
        document.getElementById('lbl-cfg-lang').innerText = trans.cfgLang;
        document.getElementById('lbl-cfg-topic').innerText = trans.cfgTopic;
        document.getElementById('lbl-cfg-theme').innerText = trans.cfgTheme;

        document.getElementById('lbl-main-title').innerText = trans.title;
        document.getElementById('lbl-btn-back').innerText = trans.btnBack;
        document.getElementById('lbl-btn-generate').innerText = trans.btnGen;
        document.getElementById('lbl-btn-hint').innerText = trans.btnHint;
        document.getElementById('lbl-section-title').innerText = trans.sectionTitle;
        document.getElementById('lbl-across').innerText = trans.across;
        document.getElementById('lbl-down').innerText = trans.down;
        document.getElementById('lbl-analysis-title').innerText = trans.analysisTitle;
        document.getElementById('th-word').innerText = trans.thWord;
        document.getElementById('th-context').innerText = trans.thContext;
    }

    function resetCycle() {
        currentCycleStep = 0;
    }

    /* RASTGELE SEÇİM MOTORU (SURPRISE ME) */
    function launchRandomizedWorkspace() {
        const langOptions = ["tr", "en", "es", "de", "fr", "it"];
        const randomLang = langOptions[Math.floor(Math.random() * langOptions.length)];
        document.getElementById('langSelect').value = randomLang;
        onLanguageChange();

        const randomTopic = TOPICS_LIST[Math.floor(Math.random() * TOPICS_LIST.length)];
        document.getElementById('topicSelect').value = randomTopic;

        const randomThemeIndex = Math.floor(Math.random() * THEME_STYLES.length);
        document.getElementById('themeSelect').value = randomThemeIndex;
        applySelectedTheme();

        currentCycleStep = Math.floor(Math.random() * 10); 
        launchWorkspace();
    }

    function launchWorkspace() {
        document.getElementById('launcher-area').style.display = 'none';
        document.getElementById('workspace-area').style.display = 'block';
        initMatrix();
    }

    function returnToLauncher() {
        document.getElementById('workspace-area').style.display = 'none';
        document.getElementById('launcher-area').style.display = 'block';
    }

    function generateNextInCycle() {
        currentCycleStep = (currentCycleStep + 1) % 10; // 10 Farklı adıma genişletildi
        initMatrix();
    }

    function initMatrix() {
        document.getElementById('corpus-index-area').style.display = 'none';

        const selectedLang = document.getElementById('langSelect').value;
        const selectedTopic = document.getElementById('topicSelect').value;

        let topicPool = DATA_POOL[selectedTopic][selectedLang] || DATA_POOL[selectedTopic]['tr'];
        let fullPool = [...topicPool];
        
        // 50 Kelimelik havuzdan her yenilemede (refresh) asla çakışmayan 5 kelimelik benzersiz kümeler seçme algoritması
        let startIndex = (currentCycleStep * 5) % fullPool.length;
        let pool = [];
        for(let i=0; i<5; i++){
            pool.push(fullPool[(startIndex + i) % fullPool.length]);
        }

        const generationResult = generateCrosswordLayout(pool);
        
        if (!generationResult || generationResult.placedCount < 5) {
            activeWords = pool;
            forceRenderLinearMatrix(pool);
            renderClues(selectedLang);
            return;
        }

        activeWords = generationResult.placedWords;
        renderGrid(generationResult.matrix);
        renderClues(selectedLang);
    }

    function generateCrosswordLayout(words) {
        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        let placedWords = [];
        let wordCounter = 1;

        let first = words[0];
        let startCol = Math.max(0, Math.floor((matrixSize - first.word.length) / 2));
        let startRow = 4; 
        
        for (let i = 0; i < first.word.length; i++) {
            localMatrix[startRow][startCol + i] = { letter: first.word[i], isStart: i === 0, num: wordCounter };
        }
        placedWords.push({ ...first, row: startRow, col: startCol, dir: "across", num: wordCounter++ });

        for (let w = 1; w < Math.min(5, words.length); w++) {
            let current = words[w];
            let targetRow = startRow;
            let targetCol = startCol + (w % first.word.length);
            
            if(targetCol >= matrixSize) targetCol = matrixSize - 1;

            localMatrix[targetRow][targetCol] = { letter: current.word[0], isStart: true, num: wordCounter };
            for(let i=1; i<current.word.length; i++){
                if(targetRow + i < matrixSize) {
                    localMatrix[targetRow + i][targetCol] = { letter: current.word[i], isStart: false, num: null };
                }
            }
            placedWords.push({ ...current, row: targetRow, col: targetCol, dir: "down", num: wordCounter++ });
        }

        return { matrix: localMatrix, placedWords: placedWords, placedCount: placedWords.length };
    }

    function forceRenderLinearMatrix(neededWords) {
        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        for(let w=0; w<neededWords.length; w++) {
            let item = neededWords[w];
            item.num = w + 1;
            item.dir = "across";
            item.row = w * 2 + 2;
            item.col = 1;
            for(let i=0; i<item.word.length; i++) {
                localMatrix[item.row][item.col + i] = { letter: item.word[i], isStart: i===0, num: i===0 ? item.num : null };
            }
        }
        renderGrid(localMatrix);
    }

    function renderGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 38px)`;
        container.style.gridTemplateRows = `repeat(${matrixSize}, 38px)`;
        inputElements = {};

        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                const cellData = matrixData[r][c];
                const cellDiv = document.createElement('div');
                
                if (cellData) {
                    cellDiv.className = 'cell active';
                    if (cellData.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = cellData.num;
                        cellDiv.appendChild(numSpan);
                    }

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    
                    input.addEventListener('input', (e) => {
                        input.value = e.target.value.toUpperCase();
                        verifyLinguisticGrid();
                    });

                    input.addEventListener('focus', () => {
                        currentFocusCell = { row: r, col: c, element: input };
                    });

                    input.addEventListener('keydown', (e) => {
                        let targetRow = r; let targetCol = c;
                        switch (e.key) {
                            case "ArrowUp": targetRow--; break;
                            case "ArrowDown": targetRow++; break;
                            case "ArrowLeft": targetCol--; break;
                            case "ArrowRight": targetCol++; break;
                            default: return; 
                        }
                        if (inputElements[`${targetRow}-${targetCol}`]) {
                            e.preventDefault();
                            inputElements[`${targetRow}-${targetCol}`].focus();
                        }
                    });

                    inputElements[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell';
                }
                container.appendChild(cellDiv);
            }
        }
    }

    function getStructuralHint() {
        if (currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            const cell = gridMatrix[currentFocusCell.row][currentFocusCell.col];
            currentFocusCell.element.value = cell.letter;
            verifyLinguisticGrid();
        }
    }

    function renderClues(lang) {
        const acrossContainer = document.getElementById('across-clues');
        const downContainer = document.getElementById('down-clues');
        acrossContainer.innerHTML = '';
        downContainer.innerHTML = '';

        activeWords.forEach(item => {
            const clueDiv = document.createElement('div');
            clueDiv.className = 'clue-item';
            clueDiv.innerHTML = `
                <div class="clue-text"><strong>${item.num}</strong> ${item.clue}</div>
                <button class="audio-trigger" onclick="executePhoneticSynthesis('${item.word}', '${lang}')">🔊</button>
            `;
            if (item.dir === 'across') acrossContainer.appendChild(clueDiv);
            else downContainer.appendChild(clueDiv);
        });
    }

    function executePhoneticSynthesis(word, langCode) {
        if ('speechSynthesis' in window) {
            let utterance = new SpeechSynthesisUtterance(word.replace(/[0-9]/g, ''));
            utterance.lang = langCode;
            window.speechSynthesis.speak(utterance);
        }
    }

    function verifyLinguisticGrid() {
        let allCorrect = true;
        let totalActiveCells = 0;
        
        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                if (gridMatrix[r][c]) {
                    totalActiveCells++;
                    const userInput = inputElements[`${r}-${c}`].value;
                    if (userInput !== gridMatrix[r][c].letter) {
                        allCorrect = false;
                    }
                }
            }
        }
        
        if (allCorrect && totalActiveCells > 0) {
            buildCorpusAnalysisTable();
        }
    }

    function buildCorpusAnalysisTable() {
        const tableBody = document.getElementById('corpus-table-body');
        tableBody.innerHTML = '';
        
        activeWords.forEach(item => {
            const row = document.createElement('tr');
            const translationSegment = item.clue.split('|')[1] || item.clue;
            
            row.innerHTML = `
                <td style="font-weight: bold; letter-spacing:1px;">${item.word}</td>
                <td>${translationSegment.trim()}</td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('corpus-index-area').style.display = 'block';
        document.getElementById('corpus-index-area').scrollIntoView({ behavior: 'smooth' });
    }
</script>
