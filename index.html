<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Engine - Ultimate Shadowing Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; }
        .smooth { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen text-slate-100 antialiased tracking-tight"
      x-data="{
        selectedLang: 'en-US',
        customText: 'Practice makes perfect when learning languages.',
        speechRate: 1.0,
        shadowMode: false, // 1. Eksik Çözümü: Gölge Modu

        // Ses Tanıma ve Karşılaştırma Sistemleri (3. Eksik Çözümü)
        recognition: null,
        spokenText: '',
        evaluatedWords: [], // Kelime bazlı doğruluk analizi (Yeşil/Kırmızı)
        isListening: false,

        // Ses Kayıt Altyapısı
        mediaRecorder: null,
        audioChunks: [],
        audioUrl: null,
        isRecording: false,

        init() {
            // Tarayıcının yerleşik Ses Tanıma (Speech Recognition) API'sini hazırlayalım
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                this.recognition = new SpeechRecognition();
                this.recognition.continuous = true;
                this.recognition.interimResults = false;
                
                this.recognition.onresult = (event) => {
                    let resultText = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) resultText += event.results[i][0].transcript;
                    }
                    this.spokenText = resultText.trim();
                    this.evaluatePronunciation();
                };

                this.recognition.onend = () => { this.isListening = false; };
            }
        },

        // 3. Eksik Çözümü: Kelime Kelime Telaffuz Analiz Algoritması
        evaluatePronunciation() {
            let originalWords = this.customText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,'').split(' ');
            let spokenWords = this.spokenText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,'').split(' ');
            
            this.evaluatedWords = originalWords.map(word => {
                // Eğer kullanıcının söylediği kelimeler arasında bu kelime varsa doğru kabul et
                let isCorrect = spokenWords.includes(word);
                return { text: word, correct: isCorrect };
            });
        },

        // DOĞAL SESLENDİRME
        playNative() {
            if(!this.customText.trim()) return;
            window.speechSynthesis.cancel();
            
            let utterance = new SpeechSynthesisUtterance(this.customText);
            let voices = window.speechSynthesis.getVoices();
            let premiumVoice = voices.find(v => v.lang === this.selectedLang && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Microsoft')));
            
            if (premiumVoice) utterance.voice = premiumVoice;
            else utterance.lang = this.selectedLang;
            
            utterance.rate = this.speechRate;

            // 1. Eksik Çözümü: Shadowing Gecikmeli Kayıt Tetikleyici
            if (this.shadowMode) {
                setTimeout(() => {
                    this.startSession();
                }, 1200); // Ses başladıktan 1.2 saniye sonra otomatik mikrofonu açar
            }

            window.speechSynthesis.speak(utterance);
        },

        // HEM KAYIT HEM SES TANIMAYI AYNI ANDA BAŞLATAN AKTİF OTURUM
        async startSession() {
            this.audioChunks = [];
            this.audioUrl = null;
            this.spokenText = '';
            this.evaluatedWords = [];
            
            // 1. Adım: Mikrofondan Ses Kaydetme (Geri dinlemek için)
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.mediaRecorder = new MediaRecorder(stream);
                this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
                this.mediaRecorder.onstop = () => {
                    let audioBlob = new Blob(this.audioChunks, { type: 'audio/mp3' });
                    this.audioUrl = URL.createObjectURL(audioBlob);
                };
                this.mediaRecorder.start();
                this.isRecording = true;
            } catch(e) { console.log('Kayıt başlatılamadı'); }

            // 2. Adım: Tarayıcı İçi Yapay Zekasız Telaffuz Analizini Başlatma
            if (this.recognition) {
                this.recognition.lang = this.selectedLang;
                this.recognition.start();
                this.isListening = true;
            }
        },

        stopSession() {
            if (this.mediaRecorder && this.isRecording) {
                this.mediaRecorder.stop();
                this.isRecording = false;
            }
            if (this.recognition && this.isListening) {
                this.recognition.stop();
                this.isListening = false;
            }
        },

        translateFullText() {
            let langCode = this.selectedLang.split('-')[0];
            let url = `https://translate.google.com/?sl=${langCode}&tl=tr&text=${encodeURIComponent(this.customText)}&op=translate`;
            window.open(url, '_blank');
        }
      }">

    <header class="w-full border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto h-16 flex items-center justify-between px-6">
            <span class="text-sm font-extrabold tracking-widest bg-gradient-to-r from-emerald-400 to-indigo-400 bg-clip-text text-transparent">POLYGLOT ENGINE PRO</span>
            <span class="text-xs text-slate-500 font-mono">Status: Local AI Validation Ready</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto pt-10 px-4 pb-32 space-y-8">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-black text-white">Advanced Shadowing & Pronunciation Checker</h1>
            <p class="text-sm text-slate-400">Camianın beklediği gerçek analiz aracı: Konuşun, anında hatalarınızı yakalayın.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Hedef Dil</label>
                    <select x-model="selectedLang" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 smooth">
                        <option value="en-US">English (US)</option>
                        <option value="de-DE">Deutsch (Almanca)</option>
                        <option value="fr-FR">Français (Fransızca)</option>
                        <option value="es-ES">Español (İspanyolca)</option>
                    </select>
                </div>

                <div class="flex items-center justify-between bg-slate-950/50 border border-slate-800/80 rounded-xl px-4 py-2">
                    <div>
                        <span class="text-xs font-bold text-slate-300 block">Realtime Shadowing</span>
                        <span class="text-[10px] text-slate-500">Ses başladıktan 1sn sonra mikrofon açılır</span>
                    </div>
                    <button @click="shadowMode = !shadowMode" :class="shadowMode ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'" class="px-3 py-1.5 rounded-lg text-xs font-bold smooth cursor-pointer">
                        <span x-text="shadowMode ? 'AÇIK 🔥' : 'KAPALI'"></span>
                    </button>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Çalışılacak Cümle</label>
                <textarea x-model="customText" rows="3" class="w-full bg-slate-800/30 border border-slate-700 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-indigo-500 smooth resize-none"></textarea>
            </div>

            <div class="space-y-2 bg-slate-950/60 border border-slate-800/80 p-5 rounded-2xl">
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">Gelişmiş Telaffuz Doğruluk Raporu</span>
                
                <div class="flex flex-wrap gap-2 text-base font-semibold pt-2">
                    <template x-for="word in evaluatedWords">
                        <span :class="word.correct ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'" class="px-2.5 py-1 rounded-lg border text-sm" x-text="word.text"></span>
                    </template>
                    <template x-if="evaluatedWords.length === 0">
                        <span class="text-xs text-slate-600 italic">Henüz telaffuz analizi yapılmadı. Konuşmaya başladığınızda rapor burada görünecektir.</span>
                    </template>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <button @click="playNative()" class="py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs smooth cursor-pointer">
                    🔊 1. Orijinali Dinle
                </button>
                
                <button @click="isRecording ? stopSession() : startSession()" 
                        :class="isRecording ? 'bg-rose-600 animate-pulse text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'"
                        class="py-3 font-bold rounded-xl text-xs smooth cursor-pointer">
                    <span x-text="isRecording ? '■ 2. Analizi Bitir' : '🎤 2. Telaffuz Et & Analiz Et'"></span>
                </button>

                <button @click="translateFullText()" class="py-3 bg-slate-950/80 hover:bg-slate-900 text-slate-400 border border-slate-800 font-medium rounded-xl text-xs smooth cursor-pointer">
                    🌐 Google Çeviri
                </button>
            </div>

            <button x-show="audioUrl" @click="new Audio(audioUrl).play()" x-cloak x-transition
                    class="w-full py-3.5 bg-emerald-500/10 border border-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 font-bold rounded-xl text-xs smooth cursor-pointer">
                Play My Voice Recording & Compare
            </button>

        </div>

    </main>

</body>
</html>
