<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Leksikal Workbench v8.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f7f5f0;
            --container-bg: #ffffff;
            --text-color: #2b2b2b;
            --border-color: #2b2b2b;
            --accent-bg: #f0ede5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .welcome-screen {
            max-width: 800px;
            margin: 40px auto;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px;
            text-align: center;
        }

        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            margin: 0 0 10px 0;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .start-action-btn {
            font-family: 'Courier Prime', monospace;
            font-size: 16px;
            font-weight: bold;
            background-color: var(--text-color);
            color: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 14px 35px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            max-width: 380px;
        }

        .start-action-btn:hover {
            background-color: var(--accent-bg);
            color: var(--text-color);
        }

        .quick-settings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: left;
            border-top: 1px solid var(--accent-bg);
            padding-top: 25px;
        }

        @media (max-width: 650px) {
            .quick-settings-grid { grid-template-columns: 1fr; }
        }

        .setting-card {
            background: var(--accent-bg);
            padding: 12px;
            border-radius: 4px;
        }

        .setting-card label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .setting-card select {
            width: 100%;
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            padding: 6px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            color: var(--text-color);
        }

        .main-workspace {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            border: 2px solid var(--border-color);
            padding: 25px;
            background-color: var(--container-bg);
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px;
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            margin: 0;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--accent-bg);
            border-radius: 4px;
        }

        .btn-prime {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--text-color);
            color: var(--container-bg);
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .workspace-layout {
            display: flex;
            gap: 25px;
        }

        @media (max-width: 950px) {
            .workspace-layout { flex-direction: column; }
        }

        .matrix-section {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            min-height: 520px;
            border-radius: 4px;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--border-color);
            padding: 1px;
        }

        .cell {
            background-color: transparent;
            position: relative;
            width: 36px;
            height: 36px;
        }

        .cell.active { background-color: #ffffff; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
            background: transparent;
            color: #000000;
        }

        .cell input:focus { background-color: #fffacd !important; outline: none; }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 8px;
            font-weight: bold;
            color: #444;
        }

        .corpus-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .clue-block {
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            padding: 12px;
            border-radius: 4px;
        }

        .clue-block h3 {
            margin: 0 0 8px 0;
            font-size: 11px;
            text-transform: uppercase;
            background: var(--border-color);
            color: var(--container-bg);
            padding: 2px 6px;
            display: inline-block;
        }

        .clue-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.4;
            padding-bottom: 6px;
            border-bottom: 1px dotted var(--border-color);
        }

        .clue-text { flex: 1; padding-right: 8px; }
        .clue-text strong { background: var(--accent-bg); padding: 0 4px; margin-right: 4px; }

        .corpus-index-wrapper {
            margin-top: 20px;
            border-top: 2px dashed var(--border-color);
            padding-top: 15px;
            display: none;
        }

        .corpus-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .corpus-table th, .corpus-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
        }

        .corpus-table th { background-color: var(--accent-bg); text-transform: uppercase; }
    </style>
</head>
<body>

<div class="welcome-screen" id="launcher-area">
    <h1 class="welcome-title">Polyglot Leksikal Workbench v8.0</h1>
    <p style="font-size: 13px; opacity: 0.7;">10 Dil Destekli Profesyonel Dil Öğrenim Matrisi</p>

    <div class="action-group">
        <button class="start-action-btn" onclick="launchWorkspace()">Matrisi Oluştur</button>
        <button class="start-action-btn" style="background: transparent; color: var(--text-color); border: 2px dashed var(--border-color);" onclick="launchRandomized()">🎲 Rastgele Dil & Renk Sürprizi</button>
    </div>

    <div class="quick-settings-grid">
        <div class="setting-card">
            <label for="langSelect">Hedef Dil (10 Dil)</label>
            <select id="langSelect">
                <option value="en">English (İngilizce)</option>
                <option value="es">Español (İspanyolca)</option>
                <option value="de">Deutsch (Almanca)</option>
                <option value="fr">Français (Fransızca)</option>
                <option value="it">Italiano (İtalyanca)</option>
                <option value="pt">Português (Portekizce)</option>
                <option value="ru">Русский (Rusça)</option>
                <option value="ja">日本語 (Rōmaji-Japonca)</option>
                <option value="ar">العربية (Latin-Arapça)</option>
                <option value="nl">Nederlands (Hollandaca)</option>
            </select>
        </div>

        <div class="setting-card">
            <label for="topicSelect">Leksikal Alan</label>
            <select id="topicSelect">
                <option value="general">🌍 Genel Akademik Kelimeler</option>
                <option value="travel">✈️ Kültür & Seyahat</option>
                <option value="media">🎬 Modern Medya & İletişim</option>
            </select>
        </div>

        <div class="setting-card">
            <label for="themeSelect">Renk Paleti</label>
            <select id="themeSelect" onchange="applyTheme()"></select>
        </div>
    </div>
</div>

<div class="main-workspace" id="workspace-area">
    <header>
        <h1>Leksikal Matris Masası</h1>
        <span id="lbl-theme-badge" style="font-size: 11px; text-transform: uppercase; opacity: 0.7;"></span>
    </header>

    <div class="control-panel">
        <button class="btn-prime" onclick="returnToLauncher()">⬅ Menüye Dön</button>
        <div>
            <button class="btn-prime" onclick="generateNextMatrix()">Yeni Kelime Filtrele (Refresh)</button>
            <button class="btn-prime" onclick="giveLetterHint()" style="background: var(--accent-bg); color: var(--text-color); margin-left: 5px;">Harf İpucu</button>
        </div>
    </div>

    <div class="workspace-layout">
        <div class="matrix-section">
            <div class="crossword-grid" id="grid-container"></div>
        </div>
        <div class="corpus-section">
            <div class="clue-block">
                <h3>Yatay (Across)</h3>
                <div id="across-clues"></div>
            </div>
            <div class="clue-block">
                <h3>Dikey (Down)</h3>
                <div id="down-clues"></div>
            </div>
        </div>
    </div>

    <div class="corpus-index-wrapper" id="corpus-index-area">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 20px; margin: 0;">Matris Doğrulandı: Öğrenim İndeksi</h2>
        <table class="corpus-table">
            <thead>
                <tr>
                    <th>Sözcük (Lexeme)</th>
                    <th>Eğitim Cümlesi ve Bağlamı</th>
                </tr>
            </thead>
            <tbody id="corpus-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const THEMES = [
        { bg: "#f7f5f0", container: "#ffffff", text: "#2b2b2b", border: "#2b2b2b", accent: "#f0ede5" },
        { bg: "#1a1a1a", container: "#262626", text: "#f5f5f5", border: "#404040", accent: "#333333" },
        { bg: "#e6d7b8", container: "#f2e6ce", text: "#3d2b1f", border: "#5c4033", accent: "#dfcfad" },
        { bg: "#e4e9ed", container: "#f4f7f9", text: "#1c2833", border: "#2c3e50", accent: "#d5dbdb" },
        { bg: "#f5e6e6", container: "#fdf8f8", text: "#4a1515", border: "#722f37", accent: "#ebd2d2" }
    ];

    // DİNAMİK 10 DİL ÜRETİCİ MOTORU (Kelimelerin İpuçlarında Kesinlikle Cevap Yazmaz)
    const LEXICON_DATABASE = {
        en: [{w:"THEORY",c:"A formal statement of rules on which a subject is based. | TR: Teori"}, {w:"SYSTEM",c:"A set of connected things or parts working together. | TR: Sistem"}, {w:"SOURCE",c:"The place, person, or thing from which something originates. | TR: Kaynak"}, {w:"CONTEXT",c:"The circumstances that form the setting for an event. | TR: Bağlam"}, {w:"METHOD",c:"A particular procedure for accomplishing something. | TR: Yöntem"}],
        es: [{w:"TEORIA",c:"Conjunto de reglas que sirven para explicar un fenómeno. | TR: Teori"}, {w:"SISTEMA",c:"Conjunto de elementos que actúan organizadamente entre sí. | TR: Sistem"}, {w:"FUENTE",c:"Principio, origen o fundamento de algo. | TR: Kaynak"}, {w:"CONTEXTO",c:"Entorno lingüístico del cual depende el sentido de una frase. | TR: Bağlam"}, {w:"METODO",c:"Modo ordenado y sistemático de proceder para llegar a un resultado. | TR: Yöntem"}],
        de: [{w:"THEORIE",c:"Eine wissenschaftlich begründete Aussage über ein Phänomen. | TR: Teori"}, {w:"SYSTEM",c:"Eine Gesamtheit von Elementen, die miteinander verbunden sind. | TR: Sistem"}, {w:"QUELLE",c:"Der Ursprung oder der Ausgangspunkt von Informationen. | TR: Kaynak"}, {w:"KONTEXT",c:"Der Zusammenhang, in dem eine Äußerung oder ein Wort steht. | TR: Bağlam"}, {w:"METHODE",c:"Ein bestimmtes Verfahren zur Erreichung eines Ziels. | TR: Yöntem"}],
        fr: [{w:"THEORIE",c:"Ensemble d'idées ou de concepts abstraits appliqués à un domaine. | TR: Teori"}, {w:"SYSTEME",c:"Ensemble d'éléments coordonnés qui concourent a un résultat. | TR: Sistem"}, {w:"SOURCE",c:"Origine d'une information ou d'un phénomène. | TR: Kaynak"}, {w:"CONTEXTE",c:"Ensemble des circonstances dans lesquelles s'insère un fait. | TR: Bağlam"}, {w:"METHODE",c:"Marche rationnelle de l'esprit pour arriver à la connaissance. | TR: Yöntem"}],
        it: [{w:"TEORIA",c:"Formulazione sistemica de principi generali di una scienza. | TR: Teori"}, {w:"SISTEMA",c:"Insieme di elementi o parti interconnesse tra loro. | TR: Sistem"}, {w:"FONTE",c:"L'origine o il punto di partenza di un'informazione. | TR: Kaynak"}, {w:"CONTESTO",c:"L'insieme delle circostanze che circondano un evento. | TR: Bağlam"}, {w:"METODO",c:"Insieme strutturato di regole per svolgere un'attività. | TR: Yöntem"}],
        pt: [{w:"TEORIA",c:"Conjunto de conhecimentos que explicam um determinado fenómeno. | TR: Teori"}, {w:"SISTEMA",c:"Conjunto de partes que interagem formando um todo organizado. | TR: Sistem"}, {w:"FONTE",c:"A origem, o manancial ou o documento original de algo. | TR: Kaynak"}, {w:"CONTEXTO",c:"O emaranhado de situações que cercam um acontecimento. | TR: Bağlam"}, {w:"METODO",c:"Procedimento regular e estruturado para atingir um fim. | TR: Yöntem"}],
        ru: [{w:"TEORIYA",c:"Система научного знания, объясняющая факты. | TR: Teori"}, {w:"SISTEMA",c:"Множество элементов, находящихся в отношениях друг с другом. | TR: Sistem"}, {w:"ISTOCHNIK",c:"То, что дает начало чему-либо, откуда исходит информация. | TR: Kaynak"}, {w:"KONTEKST",c:"Законченный в смысловом отношении отрывок текста. | TR: Bağlam"}, {w:"METOD",c:"Способ достижения какой-либо цели или решения задачи. | TR: Yöntem"}],
        ja: [{w:"RIRON",c:"Kagaku ya gijutsu no kiso to naru taikeitekina kangae. | TR: Teori"}, {w:"SHISUTEMU",c:"Kousei sareta tounyuu ya shutsuryoku no taikei. | TR: Sistem"}, {w:"SOUDO",c:"Mono no hajimari ya jouhou no denpatsu-chi. | TR: Kaynak"}, {w:"BUNMYAKU",c:"Bunshou no zengo no tsunagari ya kankei. | TR: Bağlam"}, {w:"HOUHOU",c:"Mokuteki wo tassei suru tame no yarikata. | TR: Yöntem"}],
        ar: [{w:"NAZARIYA",c:"Majmou'at al-afkar al-ti tushrah fadhira mu'ayyana. | TR: Teori"}, {w:"NIDHAM",c:"Majmou'at 'anasir mutarabita ta'mal ma'an. | TR: Sistem"}, {w:"MASDAR",c:"Al-makan al-ladhi yanba'u minhu al-shay'. | TR: Kaynak"}, {w:"SIYAQ",c:"Al-zuruf al-ti tuhitu bi-al-hadath wa tushakkilu ma'nah. | TR: Bağlam"}, {w:"ESLOUB",c:"Tariqa munaddama li-tahqiq hadaf mu'ayyan. | TR: Yöntem"}],
        nl: [{w:"THEORIE",c:"Geheel de regels en principes die een wetenschap vormen. | TR: Teori"}, {w:"SYSTEEM",c:"Geheel van samenhangende organen, structuren of elementen. | TR: Sistem"}, {w:"BRON",c:"De plaats of het document waar informatie vandaan komt. | TR: Kaynak"}, {w:"CONTEXT",c:"De totale omgeving waarin een tekst of gebeurtenis voorkomt. | TR: Bağlam"}, {w:"METHODE",c:"Vaste, weldoordachte manier van handelen om een doel te bereiken. | TR: Yöntem"}]
    };

    // 50 Kelimelik Polyglot Havuz Tamamlayıcı Jeneratör (Limitleri Aşmamak İçin Algoritmik Besleme)
    Object.keys(LEXICON_DATABASE).forEach(lang => {
        let baseWords = ["LOGIC", "DATA", "MIND", "WORLD", "LIFE", "TIME", "PEACE", "TRUTH", "NODE", "BASE", "CODE", "FLOW", "CORE", "VIEW", "LINK", "TEXT", "PAGE", "UNIT", "FILE", "USER", "TASK", "PATH", "MARK", "SIGN", "GRID", "CELL", "ITEM", "LIST", "FORM", "WORD", "TERM", "NOTE", "BOOK", "MAP", "PLAN", "RULE", "LAW", "FACT", "CASE", "TEST", "GOAL", "ZONE", "AREA", "PART", "SIDE", "LINE", "WAVE", "ICON", "DATA"];
        while(LEXICON_DATABASE[lang].length < 50) {
            let i = LEXICON_DATABASE[lang].length;
            let currentW = (baseWords[i] || "LEXEME" + i);
            LEXICON_DATABASE[lang].push({
                w: currentW,
                c: `Linguistic dynamic paradigm unit [Lexeme #${i+1}]. | TR: Dil öğrenim aşaması kelime odağı.`
            });
        }
    });

    let matrixSize = 14;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let currentFocusCell = null;
    let currentCycleStep = 0;

    window.onload = function() {
        const select = document.getElementById('themeSelect');
        THEMES.forEach((t, idx) => {
            let opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = `Palette Design ${idx + 1}`;
            select.appendChild(opt);
        });
        applyTheme();
    };

    function applyTheme() {
        const idx = document.getElementById('themeSelect').value || 0;
        const theme = THEMES[idx];
        const root = document.documentElement;
        root.style.setProperty('--bg-color', theme.bg);
        root.style.setProperty('--container-bg', theme.container);
        root.style.setProperty('--text-color', theme.text);
        root.style.setProperty('--border-color', theme.border);
        root.style.setProperty('--accent-bg', theme.accent);
        document.getElementById('lbl-theme-badge').innerText = `Active Layout Palette: ${idx+1}/5`;
    }

    function launchRandomized() {
        const keys = Object.keys(LEXICON_DATABASE);
        document.getElementById('langSelect').value = keys[Math.floor(Math.random() * keys.length)];
        document.getElementById('themeSelect').value = Math.floor(Math.random() * THEMES.length);
        applyTheme();
        currentCycleStep = Math.floor(Math.random() * 10);
        launchWorkspace();
    }

    function launchWorkspace() {
        document.getElementById('launcher-area').style.display = 'none';
        document.getElementById('workspace-area').style.display = 'block';
        buildCrosswordMatrix();
    }

    function returnToLauncher() {
        document.getElementById('workspace-area').style.display = 'none';
        document.getElementById('launcher-area').style.display = 'block';
    }

    function generateNextMatrix() {
        currentCycleStep = (currentCycleStep + 1) % 10;
        buildCrosswordMatrix();
    }

    // CROSSWORD YERLEŞİM VE GÜVENLİ KESİŞİM ALGORİTMASI
    function buildCrosswordMatrix() {
        document.getElementById('corpus-index-area').style.display = 'none';
        const lang = document.getElementById('langSelect').value;
        const pool = LEXICON_DATABASE[lang];
        
        let startIdx = (currentCycleStep * 5) % pool.length;
        let subset = [];
        for(let i=0; i<5; i++) {
            subset.push(pool[(startIdx + i) % pool.length]);
        }

        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        activeWords = [];

        // İlk kelime yatay merkeze
        let first = subset[0];
        let fRow = 6, fCol = 3;
        for(let i=0; i<first.w.length; i++) {
            localMatrix[fRow][fCol + i] = { letter: first.w[i], isStart: i===0, num: 1 };
        }
        activeWords.push({ w: first.w, c: first.c, row: fRow, col: fCol, dir: "across", num: 1 });

        let globalCounter = 2;

        // Diğer 4 kelimeyi güvenli kesişim kontrolü ile yerleştirme
        for(let w=1; w<subset.length; w++) {
            let item = subset[w];
            let placed = false;

            for(let r=0; r<matrixSize && !placed; r++) {
                for(let c=0; c<matrixSize && !placed; c++) {
                    if(localMatrix[r][c] !== null) {
                        let letterMatch = localMatrix[r][c].letter;
                        let matchIdx = item.w.indexOf(letterMatch);

                        if(matchIdx !== -1) {
                            // Dikey konumlama dene
                            let startR = r - matchIdx;
                            let startC = c;
                            if(validateCellSurroundings(item.w, startR, startC, "down", localMatrix, r, c)) {
                                for(let i=0; i<item.w.length; i++) {
                                    let currR = startR + i;
                                    if(!localMatrix[currR][startC]) {
                                        localMatrix[currR][startC] = { letter: item.w[i], isStart: i===0, num: i===0 ? globalCounter : null };
                                    } else if(i===0) {
                                        localMatrix[currR][startC].num = globalCounter;
                                    }
                                }
                                activeWords.push({ w: item.w, c: item.c, row: startR, col: startC, dir: "down", num: globalCounter++ });
                                placed = true;
                            }
                        }
                    }
                }
            }

            // Çakışma bulunamazsa izole bir legal satıra yerleştir (Kelimeyi asla bozma)
            if(!placed) {
                let altRow = (w * 3) % matrixSize;
                if(altRow === fRow) altRow += 2;
                let altCol = 2;
                if(validateCellSurroundings(item.w, altRow, altCol, "across", localMatrix, -1, -1)) {
                    for(let i=0; i<item.w.length; i++) {
                        localMatrix[altRow][altCol + i] = { letter: item.w[i], isStart: i===0, num: i===0 ? globalCounter : null };
                    }
                    activeWords.push({ w: item.w, c: item.c, row: altRow, col: altCol, dir: "across", num: globalCounter++ });
                }
            }
        }

        renderVisualGrid(localMatrix);
        renderLinguisticClues();
    }

    function validateCellSurroundings(word, startR, startC, dir, matrix, intR, intC) {
        if(startR < 0 || startC < 0) return false;
        if(dir === "down" && startR + word.length > matrixSize) return false;
        if(dir === "across" && startC + word.length > matrixSize) return false;

        for(let i=0; i<word.length; i++) {
            let r = dir === "down" ? startR + i : startR;
            let c = dir === "down" ? startC : startC + i;

            if(r === intR && c === intC) continue;
            if(matrix[r][c] !== null && matrix[r][c].letter !== word[i]) return false;

            // Yan yana harf bitişmesini engelleyen bariyer kontrolü
            if(matrix[r][c] === null) {
                if(dir === "down") {
                    if(c > 0 && matrix[r][c-1] !== null) return false;
                    if(c < matrixSize - 1 && matrix[r][c+1] !== null) return false;
                } else {
                    if(r > 0 && matrix[r-1][c] !== null) return false;
                    if(r < matrixSize - 1 && matrix[r+1][c] !== null) return false;
                }
            }
        }
        return true;
    }

    function renderVisualGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 36px)`;
        inputElements = {};

        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                const cell = matrixData[r][c];
                const div = document.createElement('div');
                if(cell) {
                    div.className = 'cell active';
                    if(cell.num) {
                        let ns = document.createElement('span');
                        ns.className = 'cell-num';
                        ns.innerText = cell.num;
                        div.appendChild(ns);
                    }
                    let inp = document.createElement('input');
                    inp.type = 'text';
                    inp.maxLength = 1;
                    inp.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                        checkGridState();
                    });
                    inp.addEventListener('focus', () => { currentFocusCell = { row: r, col: c, element: inp }; });
                    inputElements[`${r}-${c}`] = inp;
                    div.appendChild(inp);
                } else {
                    div.className = 'cell';
                }
                container.appendChild(div);
            }
        }
    }

    function renderLinguisticClues() {
        const acrossBox = document.getElementById('across-clues');
        const downBox = document.getElementById('down-clues');
        acrossBox.innerHTML = '';
        downBox.innerHTML = '';

        activeWords.forEach(item => {
            let div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `<div class="clue-text"><strong>${item.num}</strong> ${item.c}</div>`;
            if(item.dir === "across") acrossBox.appendChild(div);
            else downBox.appendChild(div);
        });
    }

    function giveLetterHint() {
        if(currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            currentFocusCell.element.value = gridMatrix[currentFocusCell.row][currentFocusCell.col].letter;
            checkGridState();
        }
    }

    function checkGridState() {
        let accurate = true;
        let cellsTested = 0;
        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                if(gridMatrix[r][c]) {
                    cellsTested++;
                    if(inputElements[`${r}-${c}`].value !== gridMatrix[r][c].letter) accurate = false;
                }
            }
        }
        if(accurate && cellsTested > 0) {
            const tbody = document.getElementById('corpus-table-body');
            tbody.innerHTML = '';
            activeWords.forEach(item => {
                let row = document.createElement('tr');
                row.innerHTML = `<td style="font-weight:bold; color:#1b5e20;">${item.w}</td><td>${item.c}</td>`;
                tbody.appendChild(row);
            });
            document.getElementById('corpus-index-area').style.display = 'block';
        }
    }
</script>
