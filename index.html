<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Polyglot Movie Crossword</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #2b2b2b; /* Arka plan koyu gri (Ekran görüntüsündeki mobil çeper gibi) */
            --page-bg: #ffffff;  /* Gazete sayfası beyazı */
            --grid-bg: #bcbfc2;  /* Bulmaca matrisinin gri arka planı */
            --text-color: #1a1a1a;
            --border-color: #2b2b2b;
            --accent-yellow: #fbc02d; /* Harf Al butonu rengi */
            --btn-blue: #1f3a52; /* Yeni Bulmaca butonu rengi */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        /* Ana Gazete Sayfası Konteyneri */
        .paper-container {
            background-color: var(--page-bg);
            width: 100%;
            max-width: 800px;
            border: 4px double var(--border-color);
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Başlık Alanı */
        header {
            text-align: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 5px 0;
        }

        .sub-header {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        /* Kalan Süre Şeridi */
        .timer-bar {
            background-color: #f0f0f2;
            border: 1px solid #ccc;
            text-align: center;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Ayarlar ve Kontrol Paneli */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .control-group label {
            white-space: nowrap;
        }

        select {
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            padding: 3px;
            border: 1px solid #777;
            background: #fff;
        }

        /* Aksiyon Butonları */
        .action-buttons {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-new {
            background-color: var(--btn-blue);
            color: white;
        }

        .btn-hint {
            background-color: var(--accent-yellow);
            color: black;
        }

        /* İki Bölümlü Çalışma Alanı */
        .workspace-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 650px) {
            .workspace-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sol Taraf: Bulmaca Matrisi Arka Planı */
        .matrix-section {
            background-color: var(--grid-bg);
            border: 1px solid #999;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
            overflow: auto;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: #777; /* Hücre çizgileri */
            padding: 1px;
        }

        /* Hücre Yapıları */
        .cell {
            background-color: transparent;
            position: relative;
            width: 32px;
            height: 32px;
        }

        .cell.active {
            background-color: #ffffff;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
            background: transparent;
            color: #000000;
        }

        .cell input:focus {
            background-color: #fffacd;
            outline: none;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 8px;
            font-weight: bold;
            color: #333;
            z-index: 2;
        }

        /* Sağ Taraf: İpuçları */
        .corpus-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .corpus-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            margin: 0 0 10px 0;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 3px;
        }

        .clue-block h3 {
            margin: 0 0 8px 0;
            font-size: 10px;
            text-transform: uppercase;
            background: #777;
            color: #fff;
            padding: 2px 6px;
            display: inline-block;
        }

        .clue-item {
            font-size: 11px;
            line-height: 1.4;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px dotted #ccc;
        }

        .clue-text strong {
            margin-right: 5px;
        }

        /* Çözüldü Tablosu */
        .corpus-index-wrapper {
            margin-top: 20px;
            border-top: 2px dashed var(--border-color);
            padding-top: 15px;
            display: none;
        }

        .corpus-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 10px;
        }

        .corpus-table th, .corpus-table td {
            border: 1px solid #aaa;
            padding: 6px;
            text-align: left;
        }

        .corpus-table th {
            background-color: #f0f0f2;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="paper-container">
    <header>
        <h1>The Polyglot Movie Crossword</h1>
        <div class="sub-header">Baskı Tarzı: Platin Baskı (30/30)</div>
    </header>

    <div class="timer-bar">
        ⏱ Kalan Süre: --:--
    </div>

    <div class="control-panel">
        <div class="control-group">
            <label>Hedef Dil:</label>
            <select id="langSelect" onchange="buildCrosswordMatrix()">
                <option value="en">İngilizce (English)</option>
                <option value="es">İspanyolca (Español)</option>
                <option value="de">Almanca (Deutsch)</option>
                <option value="fr">Fransızca (Français)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Gazete Baskısı (Tema):</label>
            <select id="topicSelect" onchange="buildCrosswordMatrix()">
                <option value="academic">🎬 Sinema & Kültür Klasikleri</option>
                <option value="lifestyle">🌍 Günlük Yaşam & Kültür</option>
            </select>
        </div>

        <div class="control-group">
            <select id="matrixVersion" onchange="generateNextMatrix()">
                <option value="0">30. Platin Baskı</option>
                <option value="1">31. Altın Baskı</option>
                <option value="2">32. Gümüş Baskı</option>
            </select>
        </div>

        <div class="control-group">
            <label>Süre Modu:</label>
            <select>
                <option>Süre Kapat</option>
                <option>Süre Aç (Zamana Karşı)</option>
            </select>
        </div>

        <div class="action-buttons">
            <button class="btn btn-new" onclick="generateNextMatrix()">🔄 Yeni Bulmaca</button>
            <button class="btn btn-hint" onclick="giveLetterHint()">💡 Harf Al</button>
        </div>
    </div>

    <div class="workspace-layout">
        <div class="matrix-section">
            <div class="crossword-grid" id="grid-container"></div>
        </div>

        <div class="corpus-section">
            <h2>Günün Sinema İpuçları</h2>
            
            <div class="clue-block">
                <h3>Yatay Kelimeler (Across)</h3>
                <div id="across-clues"></div>
            </div>
            
            <div class="clue-block">
                <h3>Dikey Kelimeler (Down)</h3>
                <div id="down-clues"></div>
            </div>
        </div>
    </div>

    <div class="corpus-index-wrapper" id="corpus-index-area">
        <h3 style="margin:0; color: #2e7d32;">✓ Matris Başarıyla Çözüldü!</h3>
        <table class="corpus-table">
            <thead>
                <tr>
                    <th>Sözcük (Lexeme)</th>
                    <th>Bağlamsal Eğitim Notu</th>
                </tr>
            </thead>
            <tbody id="corpus-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    // Sinema odaklı özelleştirilmiş kelime havuzu
    const LEXICON_DATABASE = {
        academic: {
            en: [
                { w: "AWARD", c: "He won an Oscar ________ last night. | Anlamı: Ödül" },
                { w: "THIEF", c: "In Inception, Cobb is a skilled ________. | Anlamı: Hırsız" },
                { w: "MOVIE", c: "Let's watch a classic ________. | Anlamı: Film" },
                { w: "SPACE", c: "Interstellar is an epic film about ________. | Anlamı: Uzay" },
                { w: "HERO", c: "Batman is the ________ Gotham needs. | Anlamı: Kahraman" }
            ],
            es: [
                { w: "PREMIO", c: "Ganó un Oscar anoche. | TR: Ödül" },
                { w: "LADRON", c: "En Inception, Cobb es un hırsız. | TR: Hırsız" },
                { w: "CINE", c: "Película o film clásico. | TR: Sinema" },
                { w: "ESPACIO", c: "Interstellar es sobre el uzay. | TR: Uzay" },
                { w: "HEROE", c: "Batman es el kahraman de Gotham. | TR: Kahraman" }
            ],
            de: [
                { w: "PREIS", c: "Er hat gestern einen Oscar gewonnen. | TR: Ödül" },
                { w: "DIEB", c: "In Inception ist Cobb ein Hırsız. | TR: Hırsız" },
                { w: "FILM", c: "Ein klassischer Movie. | TR: Film" },
                { w: "WELTRAUM", c: "Interstellar ist über den Uzay. | TR: Uzay" },
                { w: "HELD", c: "Batman ist der Kahraman. | TR: Kahraman" }
            ],
            fr: [
                { w: "PRIX", c: "Il a gagné un Oscar. | TR: Ödül" },
                { w: "VOLEUR", c: "Dans Inception, Cobb est un hırsız. | TR: Hırsız" },
                { w: "FILM", c: "Regardons un film classique. | TR: Film" },
                { w: "ESPACE", c: "Interstellar est sur l'uzay. | TR: Uzay" },
                { w: "HEROS", c: "Batman est le kahraman. | TR: Kahraman" }
            ]
        },
        lifestyle: {
            en: [
                { w: "ACTOR", c: "The lead ________ performed well. | TR: Oyuncu" },
                { w: "SCENE", c: "The opening ________ was shot in Paris. | TR: Sahne" },
                { w: "SCRIPT", c: "The writers finished the new ________. | TR: Senaryo" },
                { w: "DRAMA", c: "This movie is a heavy emotional ________. | TR: Drama" },
                { w: "STAGE", c: "The actors are performing on the ________. | TR: Sahne/Platform" }
            ],
            es: [
                { w: "ACTOR", c: "El actor principal. | TR: Oyuncu" },
                { w: "ESCENA", c: "La primera escena en París. | TR: Sahne" },
                { w: "GUION", c: "El libreto de la película. | TR: Senaryo" },
                { w: "DRAMA", c: "Una película dramática. | TR: Drama" },
                { w: "TEATRO", c: "El escenario principal. | TR: Sahne" }
            ],
            de: [
                { w: "AKTEUR", c: "Der Hauptdarsteller. | TR: Oyuncu" },
                { w: "SZENE", c: "Die erste Szene des Films. | TR: Sahne" },
                { w: "SKRIPT", c: "Das Drehbuch ist fertig. | TR: Senaryo" },
                { w: "DRAMA", c: "Ein emotionaler Film. | TR: Drama" },
                { w: "BUEHNE", c: "Auf der Bühne spielen. | TR: Sahne" }
            ],
            fr: [
                { w: "ACTEUR", c: "L'acteur principal du film. | TR: Oyuncu" },
                { w: "SCENE", c: "La scène d'ouverture. | TR: Sahne" },
                { w: "SCRIPT", c: "Le scénario écrit. | TR: Senaryo" },
                { w: "DRAME", c: "Un film dramatique. | TR: Drama" },
                { w: "SCENE", c: "Sur la scène du théâtre. | TR: Sahne" }
            ]
        }
    };

    let matrixSize = 12;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let currentFocusCell = null;
    let currentCycleStep = 0;

    window.onload = function() {
        buildCrosswordMatrix();
    };

    function generateNextMatrix() {
        currentCycleStep = (currentCycleStep + 1) % 3;
        document.getElementById('matrixVersion').value = currentCycleStep;
        buildCrosswordMatrix();
    }

    function buildCrosswordMatrix() {
        document.getElementById('corpus-index-area').style.display = 'none';
        const lang = document.getElementById('langSelect').value;
        const topic = document.getElementById('topicSelect').value;
        const subset = LEXICON_DATABASE[topic][lang];

        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        activeWords = [];

        // Kelime 1: Sabit Merkez Çapa Yatay (Ekran görüntüsündeki yerleşime yakın yapı)
        let first = subset[0]; 
        let fRow = 5, fCol = 3;
        for(let i=0; i<first.w.length; i++) {
            localMatrix[fRow][fCol + i] = { letter: first.w[i], isStart: i===0, num: 1, dir: "across" };
        }
        activeWords.push({ w: first.w, c: first.c, row: fRow, col: fCol, dir: "across", num: 1 });

        // Kelime 2: Dikey Kesişen
        let second = subset[1];
        let sRow = 2, sCol = 5;
        for(let i=0; i<second.w.length; i++) {
            if(!localMatrix[sRow + i][sCol]) {
                localMatrix[sRow + i][sCol] = { letter: second.w[i], isStart: i===0, num: 2, dir: "down" };
            } else if(i===0) { localMatrix[sRow + i][sCol].num = 2; }
        }
        activeWords.push({ w: second.w, c: second.c, row: sRow, col: sCol, dir: "down", num: 2 });

        // Kelime 3: Yatay Alt Bölge
        let third = subset[2];
        let tRow = 7, tCol = 2;
        for(let i=0; i<third.w.length; i++) {
            if(!localMatrix[tRow][tCol + i]) {
                localMatrix[tRow][tCol + i] = { letter: third.w[i], isStart: i===0, num: 3, dir: "across" };
            } else if(i===0) { localMatrix[tRow][tCol + i].num = 3; }
        }
        activeWords.push({ w: third.w, c: third.c, row: tRow, col: tCol, dir: "across", num: 3 });

        // Kelime 4: Sağ Dikey Koridor
        let fourth = subset[3];
        let foRow = 2, foCol = 8;
        for(let i=0; i<fourth.w.length; i++) {
            if(!localMatrix[foRow + i][foCol]) {
                localMatrix[foRow + i][foCol] = { letter: fourth.w[i], isStart: i===0, num: 4, dir: "down" };
            } else if(i===0) { localMatrix[foRow + i][foCol].num = 4; }
        }
        activeWords.push({ w: fourth.w, c: fourth.c, row: foRow, col: foCol, dir: "down", num: 4 });

        // Kelime 5: Küçük Ara Kesişim Yatay
        let fifth = subset[4];
        let fiRow = 6, fiCol = 6;
        for(let i=0; i<fifth.w.length; i++) {
            if(!localMatrix[fiRow][fiCol + i]) {
                localMatrix[fiRow][fiCol + i] = { letter: fifth.w[i], isStart: i===0, num: 5, dir: "across" };
            } else if(i===0) { localMatrix[fiRow][fiCol + i].num = 5; }
        }
        activeWords.push({ w: fifth.w, c: fifth.c, row: fiRow, col: fiCol, dir: "across", num: 5 });

        renderVisualGrid(localMatrix);
        renderLinguisticClues();
    }

    function renderVisualGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 32px)`;
        inputElements = {};

        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                const cell = matrixData[r][c];
                const div = document.createElement('div');
                if(cell) {
                    div.className = 'cell active';
                    if(cell.num) {
                        let ns = document.createElement('span');
                        ns.className = 'cell-num';
                        ns.innerText = cell.num;
                        div.appendChild(ns);
                    }
                    let inp = document.createElement('input');
                    inp.type = 'text';
                    inp.maxLength = 1;
                    
                    inp.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                        checkGridState();
                        if(e.target.value.length === 1) {
                            focusNextInput(r, c, cell.dir);
                        }
                    });
                    
                    inp.addEventListener('focus', () => { currentFocusCell = { row: r, col: c, element: inp }; });
                    inputElements[`${r}-${c}`] = inp;
                    div.appendChild(inp);
                } else {
                    div.className = 'cell';
                }
                container.appendChild(div);
            }
        }
    }

    function focusNextInput(row, col, direction) {
        let nextR = direction === "down" ? row + 1 : row;
        let nextC = direction === "down" ? col : col + 1;
        let nextInp = inputElements[`${nextR}-${nextC}`];
        if(nextInp) nextInp.focus();
    }

    function renderLinguisticClues() {
        const acrossBox = document.getElementById('across-clues');
        const downBox = document.getElementById('down-clues');
        acrossBox.innerHTML = '';
        downBox.innerHTML = '';

        activeWords.forEach(item => {
            let div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `<div class="clue-text"><strong>${item.num}</strong> ${item.c}</div>`;
            if(item.dir === "across") acrossBox.appendChild(div);
            else downBox.appendChild(div);
        });
    }

    function giveLetterHint() {
        if(currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            currentFocusCell.element.value = gridMatrix[currentFocusCell.row][currentFocusCell.col].letter;
            checkGridState();
        }
    }

    function checkGridState() {
        let accurate = true;
        let cellsTested = 0;
        for(let r=0; r<matrixSize; r++) {
            for(let c=0; c<matrixSize; c++) {
                if(gridMatrix[r][c]) {
                    cellsTested++;
                    if(inputElements[`${r}-${c}`].value !== gridMatrix[r][c].letter) accurate = false;
                }
            }
        }
        if(accurate && cellsTested > 0) {
            const tbody = document.getElementById('corpus-table-body');
            tbody.innerHTML = '';
            activeWords.forEach(item => {
                let row = document.createElement('tr');
                row.innerHTML = `<td style="font-weight:bold; color:#2e7d32;">${item.w}</td><td>${item.c}</td>`;
                tbody.appendChild(row);
            });
            document.getElementById('corpus-index-area').style.display = 'block';
        }
    }
</script>
</body>
</html>
