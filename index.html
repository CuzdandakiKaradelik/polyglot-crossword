<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-color: #f4ebd9;
            --container-bg: #fbf5eb;
            --text-color: #2b2b2b;
            --border-color: #2b2b2b;
            --accent-bg: #eae0cc;
            --shadow-color: #2b2b2b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .newspaper-container {
            max-width: 1200px;
            margin: 0 auto;
            border: 2px solid var(--border-color);
            padding: 20px;
            box-shadow: 5px 5px 0px var(--shadow-color);
            background-color: var(--container-bg);
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        header {
            text-align: center;
            border-bottom: 4px double var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .theme-badge {
            font-size: 11px;
            text-transform: uppercase;
            font-style: italic;
            margin-top: 5px;
            display: block;
            opacity: 0.8;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            background: var(--accent-bg);
            padding: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .control-panel label {
            font-weight: bold;
            font-size: 14px;
        }

        .control-panel select {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            padding: 5px 10px;
            border: 2px solid var(--border-color);
            background-color: var(--container-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        .control-panel button, .btn-action {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 15px;
            border: 2px solid var(--border-color);
            background-color: var(--text-color);
            color: var(--container-bg);
            cursor: pointer;
            box-shadow: 2px 2px 0px #888;
        }

        .control-panel button:hover, .btn-action:hover {
            opacity: 0.9;
        }

        .game-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            margin-top: 20px;
        }

        @media (max-width: 950px) {
            .game-layout { flex-direction: column; }
        }

        .puzzle-section {
            flex: 1.3;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--border-color); 
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
            min-height: 500px;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background-color: var(--border-color);
            border: 2px solid var(--border-color);
        }

        .cell {
            background-color: var(--border-color);
            position: relative;
            width: 35px;
            height: 35px;
        }

        .cell.active { background-color: #ffffff; }
        .cell.active input { background-color: #ffffff; color: #2b2b2b; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            padding: 0;
            box-sizing: border-box;
        }

        .cell input:focus {
            background-color: #fffacd !important;
            outline: none;
        }

        .cell-num {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 9px;
            font-weight: bold;
            color: #2b2b2b;
            z-index: 10;
            line-height: 1;
        }

        .clues-section {
            flex: 1;
            border-left: 1px dashed var(--border-color);
            padding-left: 20px;
            max-height: 580px;
            overflow-y: auto;
        }

        .clues-section h2 {
            font-family: 'Playfair Display', serif;
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }

        .clue-group h3 {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background-color: var(--border-color);
            color: var(--container-bg);
            padding: 4px 8px;
            display: inline-block;
        }

        .clue-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 13px;
            line-height: 1.5;
            padding: 6px;
            border-bottom: 1px dotted var(--border-color);
        }

        .clue-text-wrapper { flex: 1; }

        .clue-item strong {
            font-size: 14px;
            background-color: var(--accent-bg);
            color: var(--text-color);
            padding: 0 4px;
            margin-right: 5px;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }

        #success-banner {
            display: none;
            background-color: #617a55;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 3px 3px 0px var(--shadow-color);
            font-family: 'Playfair Display', serif;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: var(--container-bg);
            color: var(--text-color);
            padding: 30px;
            border: 3px solid var(--border-color);
            max-width: 500px;
            width: 90%;
            box-shadow: 8px 8px 0px var(--shadow-color);
            font-family: 'Courier Prime', monospace;
        }
        .modal-content h2 { font-family: 'Playfair Display', serif; margin-top: 0; text-align: center; }
        .deck-list { margin: 20px 0; max-height: 250px; overflow-y: auto; }
        .deck-item { padding: 8px; border-bottom: 1px dashed var(--border-color); font-size: 14px; }
    </style>
</head>

    </div>
</div>

    let matrixSize = 15;
    let gridMatrix = [];
    let inputElements = {};
    let activeWords = [];
    let timerInterval = null;
    let timeLeft = 0;
    let currentFocusCell = null;

    window.onload = function() {
        populateThemeSelect();
        initGame(true);
    };

    function populateThemeSelect() {
        const select = document.getElementById('themeSelect');
        select.innerHTML = '';
        THEMES.forEach((theme, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `${index + 1}. ${theme.name}`;
            select.appendChild(opt);
        });
    }

    function applySelectedTheme() {
        const index = document.getElementById('themeSelect').value;
        const theme = THEMES[index];
        setThemeStyles(theme, index);
    }

    function applyRandomTheme() {
        const randomIndex = Math.floor(Math.random() * THEMES.length);
        document.getElementById('themeSelect').value = randomIndex;
        const theme = THEMES[randomIndex];
        setThemeStyles(theme, randomIndex);
    }

    function setThemeStyles(theme, index) {
        const selectedLang = document.getElementById('langSelect').value;
        const prefix = TRANSLATIONS[selectedLang]?.themePrefix || "Baskı";
        
        const root = document.documentElement;
        root.style.setProperty('--bg-color', theme.bg);
        root.style.setProperty('--container-bg', theme.container);
        root.style.setProperty('--text-color', theme.text);
        root.style.setProperty('--border-color', theme.border);
        root.style.setProperty('--accent-bg', theme.accent);
        root.style.setProperty('--shadow-color', theme.border);

        document.getElementById('themeNameBadge').innerText = `${prefix}: ${theme.name} (${parseInt(index) + 1}/50)`;
    }

    function applyLocalization(lang) {
        const trans = TRANSLATIONS[lang] || TRANSLATIONS['en'];
        
        document.getElementById('ui-main-title').innerText = trans.title;
        document.getElementById('ui-timer-label').innerText = trans.timer;
        document.getElementById('ui-label-lang').innerText = trans.labelLang;
        document.getElementById('ui-label-topic').innerText = trans.labelTopic;
        document.getElementById('ui-label-theme').innerText = trans.labelTheme;
        document.getElementById('ui-label-timer-mode').innerText = trans.labelTimer;
        document.getElementById('ui-btn-new').innerText = trans.btnNew;
        document.getElementById('ui-btn-hint').innerText = trans.btnHint;
        document.getElementById('success-banner').innerText = trans.success;
        document.getElementById('ui-modal-title').innerText = trans.modalTitle;
        document.getElementById('ui-btn-close').innerText = trans.btnClose;
        document.getElementById('opt-timer-off').innerText = trans.timerOff;
        document.getElementById('ui-clues-title').innerText = trans.modalTitle.replace('✨', '📰'); 
        
        // Yatay/Dikey başlık adaptasyonu
        if (lang === 'tr') {
            document.getElementById('ui-across-title').innerText = "Yatay Kelimeler (Across)";
            document.getElementById('ui-down-title').innerText = "Dikey Kelimeler (Down)";
            document.getElementById('ui-clues-title').innerText = "Günün İpuçları";
        } else {
            document.getElementById('ui-across-title').innerText = "Across";
            document.getElementById('ui-down-title').innerText = "Down";
            document.getElementById('ui-clues-title').innerText = "Clues of the Day";
        }
    }

    function initGame(shouldChangeTheme = false) {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('success-banner').style.display = 'none';

        const selectedLang = document.getElementById('langSelect').value;
        const selectedTopic = document.getElementById('topicSelect').value;
        const timerConfig = document.getElementById('timerSelect').value;

        // Sayfa yazılarını seçilen dile çevir
        applyLocalization(selectedLang);
        
        // Temayı ayarla
        if (shouldChangeTheme) {
            applyRandomTheme();
        } else {
            applySelectedTheme();
        }

        let pool = [...DATA_POOL[selectedTopic][selectedLang]];
        pool.sort(() => 0.5 - Math.random());
        
        let selectedWords = pool.slice(0, Math.min(5, pool.length));
        const generationResult = generateCrosswordLayout(selectedWords);
        
        if (!generationResult || generationResult.placedCount < 1) {
            // Güvenlik mekanizması: Kelime tek de olsa yerleştirilsin
            renderEmptyFallback();
            return;
        }

        activeWords = generationResult.placedWords;
        renderGrid(generationResult.matrix);
        renderClues(selectedLang);
        setupTimer(timerConfig);
    }

    function setupTimer(mode) {
        const timerDisplay = document.getElementById('timerVal');
        if (mode === "off") {
            timerDisplay.innerText = "--:--";
            return;
        }
        timeLeft = parseInt(mode) * 60;
        updateTimerDisplay();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                Object.values(inputElements).forEach(input => input.disabled = true);
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timerVal').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function speakWord(word, langCode) {
        if ('speechSynthesis' in window) {
            let utterance = new SpeechSynthesisUtterance(word);
            if(langCode === 'ptbr') utterance.lang = 'pt-BR';
            else if(langCode === 'ro') utterance.lang = 'ro-RO';
            else utterance.lang = langCode;
            window.speechSynthesis.speak(utterance);
        }
    }

    function generateCrosswordLayout(words) {
        let localMatrix = Array(matrixSize).fill(null).map(() => Array(matrixSize).fill(null));
        let placedWords = [];
        let wordCounter = 1;

        if(words.length === 0) return null;

        let first = words[0];
        let startCol = Math.max(0, Math.floor((matrixSize - first.word.length) / 2));
        let startRow = Math.floor(matrixSize / 2);
        
        for (let i = 0; i < first.word.length; i++) {
            localMatrix[startRow][startCol + i] = { letter: first.word[i], isStart: i === 0, num: wordCounter };
        }
        placedWords.push({ ...first, row: startRow, col: startCol, dir: "across", num: wordCounter++ });

        for (let w = 1; w < words.length; w++) {
            let current = words[w];
            let placed = false;

            for (let r = 0; r < matrixSize && !placed; r++) {
                for (let c = 0; c < matrixSize && !placed; c++) {
                    if (localMatrix[r][c] !== null) {
                        let matchLetter = localMatrix[r][c].letter;
                        let matchIndex = current.word.indexOf(matchLetter);

                        if (matchIndex !== -1) {
                            let dRow = r - matchIndex;
                            let dCol = c;
                            if (canPlaceWord(current.word, dRow, dCol, "down", localMatrix, r, c)) {
                                for (let i = 0; i < current.word.length; i++) {
                                    if (!localMatrix[dRow + i][dCol]) {
                                        localMatrix[dRow + i][dCol] = { letter: current.word[i], isStart: i === 0, num: i === 0 ? wordCounter : null };
                                    } else if (i === 0) {
                                        localMatrix[dRow + i][dCol].num = wordCounter;
                                    }
                                }
                                placedWords.push({ ...current, row: dRow, col: dCol, dir: "down", num: wordCounter++ });
                                placed = true;
                            }
                        }
                    }
                }
            }
        }
        return { matrix: localMatrix, placedWords: placedWords, placedCount: placedWords.length };
    }

    function canPlaceWord(word, startRow, startCol, dir, matrix, intersectR, intersectC) {
        if (startRow < 0 || startCol < 0) return false;
        if (dir === "down" && startRow + word.length > matrixSize) return false;
        if (dir === "across" && startCol + word.length > matrixSize) return false;

        for (let i = 0; i < word.length; i++) {
            let r = dir === "down" ? startRow + i : startRow;
            let c = dir === "down" ? startCol : startCol + i;
            if (r === intersectR && c === intersectC) continue; 
            if (matrix[r][c] !== null && matrix[r][c].letter !== word[i]) return false; 
        }
        return true;
    }

    function renderGrid(matrixData) {
        gridMatrix = matrixData;
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrixSize}, 35px)`;
        container.style.gridTemplateRows = `repeat(${matrixSize}, 35px)`;
        inputElements = {};

        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                const cellData = matrixData[r][c];
                const cellDiv = document.createElement('div');
                
                if (cellData) {
                    cellDiv.className = 'cell active';
                    if (cellData.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = cellData.num;
                        cellDiv.appendChild(numSpan);
                    }

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    
                    input.addEventListener('input', (e) => {
                        input.value = e.target.value.toUpperCase();
                        checkWinCondition();
                    });

                    input.addEventListener('focus', () => {
                        currentFocusCell = { row: r, col: c, element: input };
                    });

                    input.addEventListener('keydown', (e) => {
                        let targetRow = r; let targetCol = c;
                        switch (e.key) {
                            case "ArrowUp": targetRow--; break;
                            case "ArrowDown": targetRow++; break;
                            case "ArrowLeft": targetCol--; break;
                            case "ArrowRight": targetCol++; break;
                            default: return; // Herhangi bir harfe basınca tema tetiklenmesi önlendi
                        }
                        if (inputElements[`${targetRow}-${targetCol}`]) {
                            e.preventDefault();
                            inputElements[`${targetRow}-${targetCol}`].focus();
                        }
                    });

                    inputElements[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell';
                }
                container.appendChild(cellDiv);
            }
        }
    }

    function renderEmptyFallback() {
        const container = document.getElementById('grid-container');
        container.innerHTML = '<div style="color:white; padding: 20px; text-align:center; font-weight:bold;">Layout Error. Please Refresh.</div>';
    }

    function getLetterHint() {
        if (currentFocusCell && gridMatrix[currentFocusCell.row][currentFocusCell.col]) {
            const cell = gridMatrix[currentFocusCell.row][currentFocusCell.col];
            currentFocusCell.element.value = cell.letter;
            checkWinCondition();
        }
    }

    function renderClues(lang) {
        const acrossContainer = document.getElementById('across-clues');
        const downContainer = document.getElementById('down-clues');
        acrossContainer.innerHTML = '';
        downContainer.innerHTML = '';

        activeWords.sort((a,b) => a.num - b.num).forEach(item => {
            const clueDiv = document.createElement('div');
            clueDiv.className = 'clue-item';
            clueDiv.innerHTML = `
                <div class="clue-text-wrapper"><strong>${item.num}</strong> ${item.clue}</div>
                <button class="audio-btn" onclick="speakWord('${item.word}', '${lang}')">🔊</button>
            `;
            if (item.dir === 'across') acrossContainer.appendChild(clueDiv);
            else downContainer.appendChild(clueDiv);
        });
    }

    function checkWinCondition() {
        let allCorrect = true;
        let activeCellCount = 0;
        
        for (let r = 0; r < matrixSize; r++) {
            for (let c = 0; c < matrixSize; c++) {
                if (gridMatrix[r][c]) {
                    activeCellCount++;
                    const userInput = inputElements[`${r}-${c}`].value;
                    if (userInput !== gridMatrix[r][c].letter) {
                        allCorrect = false;
                        break;
                    }
                }
            }
        }
        if (allCorrect && activeCellCount > 0) {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('success-banner').style.display = 'block';
            Object.values(inputElements).forEach(input => input.disabled = true);
            openVocabularyDeck();
        }
    }

    function openVocabularyDeck() {
        const deckList = document.getElementById('deckList');
        deckList.innerHTML = '';
        activeWords.forEach(item => {
            const div = document.createElement('div');
            div.className = 'deck-item';
            div.innerHTML = `⭐ <strong>${item.word}</strong>: ${item.clue.split('|')[1] || item.clue}`;
            deckList.appendChild(div);
        });
        document.getElementById('deckModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('deckModal').style.display = 'none';
    }
</script>
