<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Suite - Dynamic Mimic</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .apple-ease { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .bg-gradient-radial {
            background-image: radial-gradient(circle at 50% -20%, #0d1e2d 0%, #000000 75%);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen bg-[#000000] text-[#f5f5f7] antialiased tracking-tight bg-gradient-radial"
      x-data="{
        activeTab: 'mimic',
        
        // Dinamik Mimic Verileri
        selectedLang: 'en-US',
        customText: 'Type any phrase here to practice your accent...', // Kullanıcının özgürce yazacağı metin
        
        mediaRecorder: null,
        audioChunks: [],
        audioUrl: null,
        isRecording: false,
        userWaveforms: [20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20],
        audioContext: null,
        analyser: null,

        // Anki Verileri
        rawWords: 'run, walk, speak',
        ankiRows: '',

        async startRecording() {
            this.audioChunks = [];
            this.userWaveforms = [];
            
            let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.mediaRecorder = new MediaRecorder(stream);
            
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.analyser = this.audioContext.createAnalyser();
            let source = this.audioContext.createMediaStreamSource(stream);
            source.connect(this.analyser);
            this.analyser.fftSize = 32;
            
            let bufferLength = this.analyser.frequencyBinCount;
            let dataArray = new Uint8Array(bufferLength);

            let draw = () => {
                if (!this.isRecording) return;
                requestAnimationFrame(draw);
                this.analyser.getByteFrequencyData(dataArray);
                
                let avg = dataArray.reduce((a,b) => a+b, 0) / bufferLength;
                let barHeight = Math.max(15, Math.min(95, (avg / 128) * 100));
                
                if(this.userWaveforms.length > 20) this.userWaveforms.shift();
                this.userWaveforms.push(barHeight);
            };
            
            this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
            this.mediaRecorder.onstop = () => {
                let audioBlob = new Blob(this.audioChunks, { type: 'audio/mp3' });
                this.audioUrl = URL.createObjectURL(audioBlob);
                if(this.audioContext) this.audioContext.close();
            };
            
            this.mediaRecorder.start();
            this.isRecording = true;
            draw();
        },

        stopRecording() {
            if (this.mediaRecorder) {
                this.mediaRecorder.stop();
                this.isRecording = false;
            }
        },

        playNative() {
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance(this.customText);
            u.lang = this.selectedLang;
            window.speechSynthesis.speak(u);
        },

        playUser() {
            if(this.audioUrl) new Audio(this.audioUrl).play();
        }
      }">

    <nav class="sticky top-0 z-40 w-full border-b border-white/5 bg-[#000000]/70 backdrop-blur-md">
        <div class="max-w-4xl mx-auto h-14 flex items-center justify-between px-6">
            <span class="text-sm font-bold tracking-wider text-zinc-200">POLYGLOT.SUITE</span>
            <div class="bg-zinc-900 p-0.5 rounded-xl flex gap-1 border border-white/5">
                <button @click="activeTab = 'mimic'" :class="activeTab === 'mimic' ? 'bg-[#323236] text-white shadow-md' : 'text-zinc-400'" class="px-4 py-1.5 text-xs font-semibold rounded-lg apple-ease cursor-pointer">1. Dynamic Mimic</button>
                <button @click="activeTab = 'anki'" :class="activeTab === 'anki' ? 'bg-[#323236] text-white shadow-md' : 'text-zinc-400'" class="px-4 py-1.5 text-xs font-semibold rounded-lg apple-ease cursor-pointer">2. Deck Architect</button>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto pt-12 px-6 pb-32">

        <div x-show="activeTab === 'mimic'" x-transition:enter="apple-ease" class="space-y-8">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-bold text-white tracking-tight">Kendi Metnini Mimikle</h1>
                <p class="text-xs text-zinc-400 max-w-sm mx-auto">Çalışmak istediğiniz herhangi bir cümleyi yazın, yapay zeka sesiyle dinleyin ve kendi aksanınızla kıyaslayın.</p>
            </div>

            <div class="p-6 bg-[#1d1d1f]/50 border border-white/5 rounded-2xl space-y-6">
                <div class="grid grid-cols-1 gap-4">
                    <div class="flex items-center justify-between">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">Hedef Dil Seçimi</label>
                        <select x-model="selectedLang" class="bg-black/40 border border-white/5 rounded-lg px-2 py-1 text-xs text-zinc-300 focus:outline-none">
                            <option value="en-US">İngilizce (en-US)</option>
                            <option value="de-DE">Almanca (de-DE)</option>
                            <option value="fr-FR">Fransızca (fr-FR)</option>
                            <option value="es-ES">İspanyolca (es-ES)</option>
                        </select>
                    </div>
                    
                    <textarea x-model="customText" rows="3" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/10 apple-ease resize-none" placeholder="Buraya pratik yapmak istediğiniz herhangi bir cümle yazın..."></textarea>
                </div>

                <hr class="border-white/5">

                <div class="flex items-center justify-between bg-black/40 p-4 rounded-xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <button @click="playNative()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-bold text-sm hover:scale-105 apple-ease cursor-pointer">▶</button>
                        <div>
                            <span class="text-xs font-semibold text-zinc-300 block">1. Doğru Telaffuzu Dinle</span>
                            <span class="text-[11px] text-zinc-500">Kelimelerin vurgularına dikkat edin.</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between bg-zinc-900/40 p-4 rounded-xl border border-dashed border-white/10">
                    <div class="flex items-center gap-3">
                        <button @click="isRecording ? stopRecording() : startRecording()" 
                                :class="isRecording ? 'bg-red-500 animate-pulse text-white' : 'bg-zinc-800 text-white'"
                                class="w-10 h-10 rounded-full flex items-center justify-center text-sm apple-ease cursor-pointer">
                            <span x-text="isRecording ? '■' : '🎤'"></span>
                        </button>
                        <div>
                            <span class="text-xs font-semibold text-zinc-300 block" x-text="isRecording ? 'Sesiniz Analiz Ediliyor...' : '2. Kendi Sesini Kaydet'"></span>
                            <span class="text-[11px] text-zinc-500" x-text="isRecording ? 'Konuşmaya devam edin' : 'Cümleyi seslendirmek için mikrofona basın'"></span>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-0.5 h-10 w-32 justify-end overflow-hidden">
                        <template x-for="h in userWaveforms">
                            <div class="w-1 bg-emerald-400 rounded-full apple-ease" :style="'height: ' + h + '%'"></div>
                        </template>
                    </div>
                </div>

                <button x-show="audioUrl" @click="playUser()" x-cloak x-transition
                        class="w-full py-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-semibold rounded-xl text-xs apple-ease hover:bg-emerald-500/20 cursor-pointer">
                    ▶ 3. Kendi Sesini Dinle & Farkları Keşfet
                </button>
            </div>
        </div>

        <div x-show="activeTab === 'anki'" x-transition:enter="apple-ease" class="space-y-8" x-cloak>
            </div>

    </main>
</body>
</html>
