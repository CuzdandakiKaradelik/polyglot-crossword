<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilibrium - Ultimate Life Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #090d16; }
        .smooth { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen text-slate-200 antialiased tracking-tight" x-data="equilibriumEngine()">

    <header class="border-b border-slate-800 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50 px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
            <span class="font-black text-sm tracking-widest text-white">EQUILIBRIUM // LIFE RADAR</span>
        </div>
        
        <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
            <button @click="currentTab = 'carbon'" :class="currentTab === 'carbon' ? 'bg-emerald-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'" class="px-4 py-2 rounded-lg smooth cursor-pointer">🌱 CarbonBurner</button>
            <button @click="currentTab = 'brain'" :class="currentTab === 'brain' ? 'bg-purple-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'" class="px-4 py-2 rounded-lg smooth cursor-pointer">🧠 BrainFuel</button>
            <button @click="currentTab = 'skill'" :class="currentTab === 'skill' ? 'bg-amber-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'" class="px-4 py-2 rounded-lg smooth cursor-pointer">⚔️ SkillWeaver</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 h-fit space-y-4 shadow-xl">
            
            <div x-show="currentTab === 'carbon'" x-cloak class="space-y-4">
                <h2 class="text-sm font-bold text-emerald-400">🌱 Yeni Çevre Aktivitesi Ekle</h2>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Aktivite/Rutin</label>
                        <input type="text" x-model="forms.carbon.name" placeholder="Örn: Arabayla İşe Gidiş, Et Tüketimi" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500 smooth">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Miktar (kg CO₂/Gün)</label>
                            <input type="number" x-model.number="forms.carbon.amount" placeholder="Örn: 5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500 smooth">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Kategori</label>
                            <select x-model="forms.carbon.category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500 smooth">
                                <option value="Ulaşım">Ulaşım</option>
                                <option value="Beslenme">Beslenme</option>
                                <option value="Ev/Enerji">Ev/Enerji</option>
                            </select>
                        </div>
                    </div>
                    <button @click="addCarbonItem()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider smooth cursor-pointer">Doğa Yükünü Ekle</button>
                </div>
            </div>

            <div x-show="currentTab === 'brain'" x-cloak class="space-y-4">
                <h2 class="text-sm font-bold text-purple-400">🧠 Dijital Tüketim Ekle</h2>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Platform/Uygulama</label>
                        <input type="text" x-model="forms.brain.name" placeholder="Örn: Instagram, YouTube, Kitap" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500 smooth">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Süre (Dakika/Gün)</label>
                            <input type="number" x-model.number="forms.brain.amount" placeholder="Örn: 45" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500 smooth">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Etki Türü</label>
                            <select x-model="forms.brain.category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500 smooth">
                                <option value="Dopamin/Eğlence">Dopamin/Eğlence</option>
                                <option value="Eğitim/Gelişim">Eğitim/Gelişim</option>
                                <option value="Haber/Sosyal">Haber/Sosyal</option>
                            </select>
                        </div>
                    </div>
                    <button @click="addBrainItem()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider smooth cursor-pointer">Zaman Yükünü Ekle</button>
                </div>
            </div>

            <div x-show="currentTab === 'skill'" x-cloak class="space-y-4">
                <h2 class="text-sm font-bold text-amber-400">⚔️ Gelişim Yatırımı Ekle</h2>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Yetenek/Kas Grubu</label>
                        <input type="text" x-model="forms.skill.name" placeholder="Örn: Kodlama, İngilizce, Fitness" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500 smooth">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Yatırım (Saat/Hafta)</label>
                            <input type="number" x-model.number="forms.skill.amount" placeholder="Örn: 4" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500 smooth">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Odak Alanı</label>
                            <select x-model="forms.skill.category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500 smooth">
                                <option value="Entelektüel">Entelektüel</option>
                                <option value="Fiziksel Güç">Fiziksel Güç</option>
                                <option value="Kariyer/Teknik">Kariyer/Teknik</option>
                            </select>
                        </div>
                    </div>
                    <button @click="addSkillItem()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider smooth cursor-pointer">Gelişimi Tetikle</button>
                </div>
            </div>

            <div class="pt-2 border-t border-slate-800/60">
                <button @click="shareStatus()" class="w-full py-2.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold rounded-xl text-xs flex items-center justify-center gap-2 smooth cursor-pointer">
                    𝕏 <span x-text="shareButtonText"></span>
                </button>
            </div>

        </div>

        <div class="lg:col-span-2 space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between shadow-lg">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider" x-text="getMetrics().title"></span>
                    <div class="mt-2">
                        <span class="text-3xl font-black" :class="getMetrics().color" x-text="getMetrics().value"></span>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1" x-text="getMetrics().subtext"></p>
                </div>

                <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between shadow-lg">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Baskın Odak Noktası</span>
                    <div class="mt-2">
                        <span class="text-xl font-bold text-indigo-400" x-text="getTopCategory()"></span>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">Verilerinizin yoğunlaştığı ana kategori alanı.</p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="px-5 py-4 border-b border-slate-800 bg-slate-950/40 flex items-center justify-between">
                    <h3 class="text-xs font-bold text-white uppercase tracking-wider" x-text="getMetrics().listTitle"></h3>
                    <button @click="clearTab()" class="text-[10px] font-bold text-rose-400 hover:text-rose-300 smooth cursor-pointer">Sekmeyi Temizle</button>
                </div>

                <div class="divide-y divide-slate-800/60 max-h-[350px] overflow-y-auto">
                    <template x-for="item in getActiveList()" :key="item.id">
                        <div class="p-4 flex items-center justify-between hover:bg-slate-950/20 smooth">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <h4 class="text-sm font-bold text-white" x-text="item.name"></h4>
                                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400" x-text="item.category"></span>
                                </div>
                            </div>

                            <div class="flex items-center gap-4">
                                <span class="text-sm font-bold" :class="getMetrics().color" x-text="item.amount + ' ' + getMetrics().unit"></span>
                                <button @click="deleteItem(item.id)" class="text-slate-600 hover:text-rose-400 smooth cursor-pointer text-xs">✕</button>
                            </div>
                        </div>
                    </template>

                    <template x-if="getActiveList().length === 0">
                        <div class="p-12 text-center text-xs text-slate-500 italic">
                            Bu sekmede henüz izlenen bir rutin yok. Sol taraftan ekleme yapabilirsiniz.
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </main>

    <script>
        function equilibriumEngine() {
            return {
                currentTab: 'carbon',
                shareButtonText: 'Durumumu Panoya Kopyala',
                
                db: {
                    carbon: [],
                    brain: [],
                    skill: []
                },

                forms: {
                    carbon: { name: '', amount: null, category: 'Ulaşım' },
                    brain: { name: '', amount: null, category: 'Dopamin/Eğlence' },
                    skill: { name: '', amount: null, category: 'Kariyer/Teknik' }
                },

                init() {
                    const saved = localStorage.getItem('equilibrium_db');
                    if (saved) this.db = JSON.parse(saved);
                },

                save() {
                    localStorage.setItem('equilibrium_db', JSON.stringify(this.db));
                },

                addCarbonItem() {
                    if(!this.forms.carbon.name || !this.forms.carbon.amount) return;
                    this.db.carbon.push({ id: 'c_' + Date.now(), ...this.forms.carbon });
                    this.forms.carbon.name = ''; this.forms.carbon.amount = null;
                    this.save();
                },
                addBrainItem() {
                    if(!this.forms.brain.name || !this.forms.brain.amount) return;
                    this.db.brain.push({ id: 'b_' + Date.now(), ...this.forms.brain });
                    this.forms.brain.name = ''; this.forms.brain.amount = null;
                    this.save();
                },
                addSkillItem() {
                    if(!this.forms.skill.name || !this.forms.skill.amount) return;
                    this.db.skill.push({ id: 's_' + Date.now(), ...this.forms.skill });
                    this.forms.skill.name = ''; this.forms.skill.amount = null;
                    this.save();
                },

                getActiveList() {
                    return this.db[this.currentTab] || [];
                },

                deleteItem(id) {
                    this.db[this.currentTab] = this.db[this.currentTab].filter(i => i.id !== id);
                    this.save();
                },

                clearTab() {
                    if(confirm('Bu kategorideki tüm verileri sıfırlamak istiyor musunuz?')) {
                        this.db[this.currentTab] = [];
                        this.save();
                    }
                },

                getMetrics() {
                    let list = this.getActiveList();
                    let total = list.reduce((sum, item) => sum + (item.amount || 0), 0);

                    if (this.currentTab === 'carbon') {
                        let yearly = Math.round(total * 365);
                        let treeCount = Math.ceil(yearly / 20);
                        return {
                            title: 'Yıllık Karbon Yükü Projeksiyonu',
                            value: yearly.toLocaleString() + ' kg CO₂',
                            subtext: `Bu salınımı nötrlemek için yılda ${treeCount} ağaç dikmelisiniz.`,
                            color: 'text-emerald-400',
                            unit: 'kg',
                            listTitle: 'Doğa Ayak İzi Radarı',
                            shareText: `Equilibrium panelime göre doğaya yıllık ${yearly.toLocaleString()} kg CO₂ bırakıyorum. Bunu sıfırlamak için ${treeCount} ağaç dikmem gerek! Sen de durumunu ölç:`
                        };
                    } else if (this.currentTab === 'brain') {
                        let yearlyHours = Math.round((total * 365) / 60);
                        let days = (yearlyHours / 24).toFixed(1);
                        return {
                            title: 'Yıllık Ekran Bağımlılığı Maliyeti',
                            value: yearlyHours.toLocaleString() + ' Saat',
                            subtext: `Yılın yaklaşık ${days} gününü bu platformlarda eritiyorsunuz.`,
                            color: 'text-purple-400',
                            unit: 'dk',
                            listTitle: 'Zihinsel Tüketim Radarı',
                            shareText: `Dijital tüketim şoku! Equilibrium panelime göre yılın tam ${days} gününü ekranda eritiyorum. Zihinsel dengeni kontrol et:`
                        };
                    } else {
                        let yearlyHours = total * 52;
                        let percent = ((yearlyHours / 10000) * 100).toFixed(1);
                        return {
                            title: 'Yıllık Gelişim ve Yetenek Yatırımı',
                            value: '+' + yearlyHours.toLocaleString() + ' Saat/Yıl',
                            subtext: `10.000 saat kuralına göre uzmanlığa giden yolun %${percent}'ini tamamlıyorsunuz.`,
                            color: 'text-amber-400',
                            unit: 'Saat/Hafta',
                            listTitle: 'Karakter Yetenek Ağacı',
                            shareText: `Karakterimi inşa ediyorum! Bu yıl kendime +${yearlyHours.toLocaleString()} saat yeni yetenek yatırımı yaptım. Hayatını oyunlaştır:`
                        };
                    }
                },

                getTopCategory() {
                    let list = this.getActiveList();
                    if (list.length === 0) return 'Veri Yok';
                    let cats = {};
                    list.forEach(i => cats[i.category] = (cats[i.category] || 0) + i.amount);
                    return Object.keys(cats).reduce((a, b) => cats[a] > cats[b] ? a : b);
                },

                // KOPYALAMA VE VİRAL PAYLAŞIM MOTORU
                shareStatus() {
                    let metrics = this.getMetrics();
                    let siteUrl = window.location.href;
                    let fullText = `${metrics.shareText} ${siteUrl}`;

                    navigator.clipboard.writeText(fullText).then(() => {
                        this.shareButtonText = '✓ Kopyalandı! (𝕏\'te Paylaş)';
                        
                        // Kullanıcıyı doğrudan Twitter/X'e yönlendirme linki açalım (Yeni sekmede)
                        let twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(fullText)}`;
                        window.open(twitterUrl, '_blank');

                        setTimeout(() => {
                            this.shareButtonText = 'Durumumu Panoya Kopyala';
                        }, 3000);
                    }).catch(err => {
                        alert('Kopyalama başarısız oldu, lütfen metni manuel paylaşın.');
                    });
                }
            }
        }
    </script>
</body>
</html>
