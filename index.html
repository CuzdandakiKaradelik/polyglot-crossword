<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Polyglot Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* Apple Akıcı Geçiş Eğrisi (Cubic Bezier) */
        .apple-ease {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-modal-ease {
            transition: all 0.5s cubic-bezier(0.32, 0.94, 0.6, 1);
        }
        [x-cloak] { display: none !important; }
        
        /* İnce Apple Ambians Işığı */
        .bg-gradient-radial {
            background-image: radial-gradient(circle at 50% -20%, #221a36 0%, #000000 70%);
        }
    </style>
</head>
<body class="min-h-screen bg-[#000000] text-[#f5f5f7] antialiased tracking-tight bg-gradient-radial"
      x-data="{ 
        isModalOpen: false, 
        activeTab: 'all',
        posts: [
            { id: 1, type: 'hack', title: '15 Dakika Shadowing Tekniği', category: '🎧 Kulak Alışkanlığı', author: 'kerem', content: 'Dizi izlerken altyazıyı kapatıp, karakterin hemen arkasından aynı tonlamayla cümleyi tekrar ediyorum. Ağız kaslarımı yabancı bir dile alıştırmak için mükemmel bir kısa yol.', lang: 'İngilizce', level: 'İleri Seviye', votes: 42, hasVoted: false },
            { id: 2, type: 'progress', title: 'Sıfırdan B2 Almanca: 6 Aylık Haritam', category: '📈 İlerleme Günlüğü', author: 'dilara', content: 'Her gün sadece 20 dakikalık odaklanmış Anki desteleri ve haftalık 2 saatlik iTalki konuşma pratikleriyle B2 sertifikasını aldım. Sürecimin haftalık kelime grafiklerini paylaşıyorum.', lang: 'Almanca', level: 'B2', votes: 128, hasVoted: false }
        ],
        handleVote(id) {
            this.posts = this.posts.map(post => {
                if (post.id === id) {
                    post.votes = post.hasVoted ? post.votes - 1 : post.votes + 1;
                    post.hasVoted = !post.hasVoted;
                }
                return post;
            });
        }
      }">

    <nav class="sticky top-0 z-40 w-full border-b border-white/5 bg-[#000000]/70 backdrop-blur-md">
        <div class="max-w-4xl mx-auto h-12 flex items-center justify-between px-6">
            <span class="text-sm font-semibold tracking-tight text-zinc-200">The Polyglot Lab</span>
            <span class="text-xs text-zinc-500 font-medium tracking-wide bg-zinc-900 px-2.5 py-0.5 rounded-full border border-white/5">Beta v1.0</span>
        </div>
    </nav>

    <header class="max-w-4xl mx-auto pt-24 px-6 text-center select-none">
        <h1 class="text-5xl md:text-6xl font-bold tracking-tight text-white mb-4 bg-clip-text text-transparent bg-gradient-to-b from-white via-zinc-200 to-zinc-500">
            Kolektif Hafıza.
        </h1>
        <p class="max-w-xl mx-auto text-lg md:text-xl text-zinc-400 font-normal leading-relaxed tracking-normal">
            Kitabi yöntemlerin dışına çıkın. Kendi dil hack'ini icat etmiş olanların ortak haritasını keşfedin.
        </p>
    </header>

    <div class="max-w-3xl mx-auto mt-10 px-6">
        <button @click="isModalOpen = true"
                class="w-full py-4 bg-white text-black font-semibold rounded-full apple-ease hover:bg-zinc-200 hover:scale-[1.005] active:scale-[0.995] shadow-2xl shadow-white/5 text-sm tracking-wide cursor-pointer flex items-center justify-center gap-1.5">
            <span>Kendi Yolunu Paylaş</span>
            <span class="text-xs opacity-60">→</span>
        </button>
    </div>

    <main class="max-w-3xl mx-auto mt-20 px-6">
        
        <div class="flex justify-center">
            <div class="bg-[#1d1d1f] p-0.75 rounded-full flex gap-1 border border-white/5">
                <button @click="activeTab = 'all'" :class="activeTab === 'all' ? 'bg-[#323236] text-white' : 'text-zinc-400 hover:text-zinc-200'" class="px-5 py-1.5 text-xs font-medium rounded-full apple-ease cursor-pointer">Tümü</button>
                <button @click="activeTab = 'hack'" :class="activeTab === 'hack' ? 'bg-[#323236] text-white' : 'text-zinc-400 hover:text-zinc-200'" class="px-5 py-1.5 text-xs font-medium rounded-full apple-ease cursor-pointer">🧬 Dil Hackleri</button>
                <button @click="activeTab = 'progress'" :class="activeTab === 'progress' ? 'bg-[#323236] text-white' : 'text-zinc-400 hover:text-zinc-200'" class="px-5 py-1.5 text-xs font-medium rounded-full apple-ease cursor-pointer">📈 İlerleme Günlükleri</button>
            </div>
        </div>

        <div class="mt-12 space-y-4 pb-32">
            <template x-for="post in posts" :key="post.id">
                <div x-show="activeTab === 'all' || post.type === activeTab"
                     x-transition:enter="apple-ease"
                     x-transition:enter-start="opacity-0 scale-98 translate-y-2"
                     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                     class="p-6 bg-[#1d1d1f]/40 border border-white/5 rounded-2xl hover:border-white/10 apple-ease flex justify-between items-center gap-6 group">
                    
                    <div class="space-y-3 flex-1">
                        <div class="flex items-center gap-2 text-[11px] font-semibold tracking-wider uppercase">
                            <span class="text-purple-400" x-text="post.category"></span>
                            <span class="text-zinc-600">•</span>
                            <span class="text-zinc-400" x-text="post.lang"></span>
                            <span class="text-zinc-600">/</span>
                            <span class="text-zinc-500" x-text="post.level"></span>
                        </div>
                        <h3 class="text-xl font-bold text-white tracking-tight" x-text="post.title"></h3>
                        <p class="text-[14px] text-zinc-400 leading-relaxed font-normal" x-text="post.content"></p>
                        <div class="text-xs text-zinc-500 font-medium pt-1">Katkıda bulunan: <span class="text-zinc-400" x-text="'@' + post.author"></span></div>
                    </div>

                    <button @click="handleVote(post.id)"
                            :class="post.hasVoted ? 'bg-white text-black border-white' : 'bg-transparent border-white/10 text-white hover:border-white/30 hover:bg-white/5'"
                            class="flex flex-col items-center justify-center p-3 rounded-xl border apple-ease w-16 h-16 active:scale-90 cursor-pointer shrink-0">
                        <span class="text-base leading-none" x-text="post.hasVoted ? '✓' : '▲'"></span>
                        <span class="text-xs font-bold mt-1 tracking-tight" x-text="post.votes"></span>
                    </button>
                </div>
            </template>
        </div>
    </main>

    <div x-show="isModalOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div x-show="isModalOpen" 
             x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
             @click="isModalOpen = false" 
             class="absolute inset-0 bg-black/60 backdrop-blur-xl"></div>
        
        <div x-show="isModalOpen" 
             x-transition:enter="apple-modal-ease" x-transition:enter-start="opacity-0 scale-95 translate-y-8" x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="apple-modal-ease" x-transition:leave-start="opacity-100 scale-100 translate-y-0" x-transition:leave-end="opacity-0 scale-95 translate-y-8"
             class="relative w-full max-w-xl bg-[#1c1c1e] border border-white/10 p-8 rounded-3xl shadow-2xl z-10 overflow-y-auto max-h-[90vh]">
            
            <h2 class="text-2xl font-bold tracking-tight text-white">Haritaya Katkıda Bulun</h2>
            <p class="text-sm text-zinc-400 mt-1">Geliştirdiğin deneysel yöntemi veya ilerleme kanıtını ekle.</p>
            
            <form class="mt-8 space-y-6" @submit.preventDefault="isModalOpen = false">
                <div x-data="{ selectedType: 'hack' }">
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-wider mb-2.5">Paylaşım Türü</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div @click="selectedType = 'hack'" :class="selectedType === 'hack' ? 'border-white/40 bg-white/5 text-white' : 'border-white/5 text-zinc-400'" class="p-4 bg-[#2c2c2e]/50 border rounded-2xl cursor-pointer text-center apple-ease select-none">
                            <span class="text-lg block mb-0.5">🧬</span>
                            <span class="text-xs font-semibold">Dil Hack'i</span>
                        </div>
                        <div @click="selectedType = 'progress'" :class="selectedType === 'progress' ? 'border-white/40 bg-white/5 text-white' : 'border-white/5 text-zinc-400'" class="p-4 bg-[#2c2c2e]/50 border rounded-2xl cursor-pointer text-center apple-ease select-none">
                            <span class="text-lg block mb-0.5">📈</span>
                            <span class="text-xs font-semibold">İlerleme Günlüğü</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-wider mb-2">Başlık</label>
                    <input type="text" placeholder="Örn: Netflix Altyazı Parçalama Yöntemi" class="w-full bg-[#2c2c2e] border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/20 apple-ease placeholder-zinc-600" />
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-wider mb-2">Formül / Detaylar</label>
                    <textarea rows="4" placeholder="Bu yöntemi adım adım nasıl uyguluyorsun? Diğer insanlara net bir rehber bırak..." class="w-full bg-[#2c2c2e] border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/20 apple-ease resize-none placeholder-zinc-600"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-wider mb-2">Hedef Dil</label>
                        <input type="text" placeholder="Örn: Japonca" class="w-full bg-[#2c2c2e] border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/20 apple-ease placeholder-zinc-600" />
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-wider mb-2">Seviye</label>
                        <input type="text" placeholder="Örn: A2 - Tüm Seviyeler" class="w-full bg-[#2c2c2e] border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/20 apple-ease placeholder-zinc-600" />
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" @click="isModalOpen = false" class="flex-1 py-3.5 bg-transparent hover:bg-white/5 text-zinc-400 hover:text-white font-medium rounded-full apple-ease text-xs cursor-pointer">Vazgeç</button>
                    <button type="submit" class="flex-1 py-3.5 bg-white text-black font-semibold rounded-full hover:bg-zinc-200 apple-ease text-xs cursor-pointer">Yayınla</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
