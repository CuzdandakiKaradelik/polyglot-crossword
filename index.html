<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polyglot Lexical Matrix v14.0</title>
    <style>
        :root {
            --bg-main: #f8f9fa;
            --text-main: #212529;
            --border-color: #ced4da;
            --accent-blue: #004085;
            --cell-size: 42px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        /* Kontrol Paneli */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #fff;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        select, button {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            background: #fff;
            outline: none;
        }

        button.btn-primary {
            background: var(--text-main);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        button.btn-primary:hover {
            background: #343a40;
        }

        /* Çalışma Alanı */
        .workspace {
            display: none;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .matrix-holder {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 15px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            display: grid;
            gap: 1px;
            background: var(--border-color);
            padding: 1px;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background: #fff;
            position: relative;
        }

        .cell.empty {
            background: #e9ecef;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            padding: 0;
            background: transparent;
        }

        .cell input:focus {
            background: #fff3cd;
        }

        .cell-num {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 9px;
            color: #6c757d;
            font-weight: bold;
            z-index: 2;
        }

        /* Mobil Ekran Dinamik Küçülme */
        @media (max-width: 500px) {
            :root {
                --cell-size: 7.8vw;
            }
            .cell input {
                font-size: 14px;
            }
        }

        /* İpuçları Alanı */
        .clues-holder {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .clue-section h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 5px;
            font-size: 16px;
        }

        .clue-list {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }

        .clue-item {
            font-size: 13px;
            margin-bottom: 12px;
            line-height: 1.4;
            padding-bottom: 6px;
            border-bottom: 1px dotted var(--border-color);
        }

        .clue-item strong {
            background: #e2e3e5;
            padding: 2px 6px;
            margin-right: 5px;
            border-radius: 3px;
        }

        /* İndeks Paneli */
        .polyglot-index {
            margin-top: 20px;
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: none;
        }

        .polyglot-index h2 {
            margin-top: 0;
            font-size: 18px;
            color: #2b542c;
        }

        .analysis-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .analysis-table th, .analysis-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
        }

        .analysis-table th {
            background: #f1f3f5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>POLYGLOT LEXICAL MATRIX</h1>
    </header>

    <div class="control-panel">
        <div>
            <label>Acquisition Level / Dil Seviyesi</label>
            <select id="levelSelect">
                <option value="beginner">A1-A2: Survival Concepts & Core Connectors</option>
                <option value="intermediate">B1-B2: Functional Fluency & Discussion</option>
                <option value="advanced">C1-C2: Academic Discourse & Idioms</option>
            </select>
        </div>
        <div>
            <label>Sistem Operasyonu</label>
            <button class="btn-primary" onclick="initPolyglotEngine()">Yeni Matris Üret</button>
        </div>
    </div>

    <div class="workspace" id="mainWorkspace">
        <div class="matrix-holder">
            <div class="grid" id="lexicalGrid"></div>
        </div>

        <div class="clues-holder">
            <div class="clue-section">
                <h3>Yatay / Across</h3>
                <ul class="clue-list" id="acrossClues"></ul>
            </div>
            <div class="clue-section">
                <h3>Dikey / Down</h3>
                <ul class="clue-list" id="downClues"></ul>
            </div>
        </div>
    </div>

    <div class="polyglot-index" id="analysisPanel">
        <h2>✓ Yapısal Matris Çözüldü: Dil Bilgisi İndeksi</h2>
        <table class="analysis-table">
            <thead>
                <tr>
                    <th>Kelime / Kalıp</th>
                    <th>Dil</th>
                    <th>Bağlamsal Kullanım ve Canlı Cümle Örneği</th>
                </tr>
            </thead>
            <tbody id="analysisRows"></tbody>
        </table>
    </div>
</div>

<script>
    // ZENGİNLEŞTİRİLMİŞ DEV POLYGLOT VERİTABANI (A1'den C2'ye Geniş Havuz)
    const INTEL_DATABASE = {
        beginner: [
            { w: "BECAUSE", lang: "EN", c: "Nedensellik bildirir. Neden? sorusuna yanıt verir. | Örnek: 'I am learning Spanish because I love the culture.'" },
            { w: "ALWAYS", lang: "EN", c: "Sıklık zarfı (%100 sıklık durumu). | Örnek: 'She always drinks coffee in the morning.'" },
            { w: "DESPUES", lang: "ES", c: "İspanyolca 'sonra / daha sonra' zaman zarfı. | Örnek: 'Vamos a la playa despues de comer.'" },
            { w: "WARUM", lang: "DE", c: "Almanca 'Neden / Niçin' soru kelimesi. | Örnek: 'Warum lernst du Deutsch?'" },
            { w: "POURQUOI", lang: "FR", c: "Fransızca 'Neden / Niçin' soru kelimesi. | Örnek: 'Pourquoi tu pleures?'" },
            { w: "MAINTENANT", lang: "FR", c: "Fransızca 'Şimdi / Şu an' zaman zarfı. | Örnek: 'Nous devons partir maintenant.'" },
            { w: "SIEMPRE", lang: "ES", c: "İspanyolca 'Her zaman' sıklık zarfı. | Örnek: 'Mi abuela siempre cocina muy bien.'" },
            { w: "MORGEN", lang: "DE", c: "Almanca 'Yarın' veya 'Sabah' anlamına gelir. | Örnek: 'Morgen habe ich keine Zeit.'" },
            { w: "TOGETHER", lang: "EN", c: "Birlikte, bir arada olma durumu. | Örnek: 'Let's study the language matrix together.'" },
            { w: "BIENTOT", lang: "FR", c: "Fransızca 'Yakında / Görüşmek üzere' kalıbı. | Örnek: 'A bientot! Le train va arriver.'" },
            { w: "GRACIAS", lang: "ES", c: "İspanyolca temel teşekkür kalıbı. | Örnek: 'Muchas gracias por la ayuda.'" },
            { w: "TSCHUSS", lang: "DE", c: "Almanca samimi vedalaşma sözü (Güle güle). | Örnek: 'Tschuss! Bis morgen!'" }
        ],
        intermediate: [
            { w: "HOWEVER", lang: "EN", c: "Zıtlık bağlacı. İki bağımsız düşünceyi bağlar. | Örnek: 'The system is old; however, it works perfectly.'" },
            { w: "PROBABLE", lang: "EN", c: "Yüksek ihtimal belirten sıfat yapısı. | Örnek: 'It is highly probable that the strategy will succeed.'" },
            { w: "SIN EMBARGO", lang: "ES", c: "İspanyolca 'Buna rağmen / Ancak' zıtlık kalıbı. | Örnek: 'Estudió mucho; sin embargo, no aprobó el examen.'" },
            { w: "OBWOHL", lang: "DE", c: "Almanca '-e rağmen' yan cümle bağlacı. | Örnek: 'Obwohl es regnet, gehen wir im Park spazieren.'" },
            { w: "SUDDENLY", lang: "EN", c: "Aniden, ansızın gelişen durumlar için zarf. | Örnek: 'Suddenly, the lights went out in the laboratory.'" },
            { w: "PORTANTO", lang: "ES", c: "İspanyolca 'Bu yüzden / Dolayısıyla' sonuç kalıbı. | Örnek: 'No hay fondos, portanto debemos cancelar el proyecto.'" },
            { w: "PENDANT", lang: "FR", c: "Fransızca '-esnasında / boyunca' zaman edatı. | Örnek: 'Il a plu pendant toute la nuit.'" },
            { w: "DESARROLLO", lang: "ES", c: "İspanyolca 'Gelişim / Kalkınma' kelimesi. | Örnek: 'El desarrollo de software es una industria grande.'" },
            { w: "ERFAHRUNG", lang: "DE", c: "Almanca 'Deneyim / Tecrübe' ismi. | Örnek: 'Er hat viel Erfahrung im Unterrichten.'" },
            { w: "REASONABLE", lang: "EN", c: "Makul, mantıklı, akla uygun. | Örnek: 'That is a reasonable price for a polyglot dictionary.'" }
        ],
        advanced: [
            { w: "COMPREHENSIVE", lang: "EN", c: "Kapsamlı, her şeyi detaylarıyla barındıran. | Örnek: 'The researcher provided a comprehensive analysis of the linguistic shifts.'" },
            { w: "INHERENT", lang: "EN", c: "Doğasında olan, içsel, ayrılmaz özellik. | Örnek: 'Language learning has an inherent complexity that requires patience.'" },
            { w: "POR DOQUIER", lang: "ES", c: "Her yerde, dört bir yanda (Edebi deyim). | Örnek: 'Encontraron rastros de influencia romana por doquier.'" },
            { w: "ZEITGEIST", lang: "DE", c: "Zamanın ruhu (Felsefi / Kültürel kavram). | Örnek: 'Der Roman fängt den Zeitgeist der Jahrhundertwende perfekt ein.'" },
            { w: "CONSEQUENTLY", lang: "EN", c: "Sonuç olarak, bu nedenle, bağlantılı olarak. | Örnek: 'The data was flawed; consequently, the thesis was rejected.'" },
            { w: "NEVERTHELESS", lang: "EN", c: "Yine de, buna karşın, her şeye rağmen. | Örnek: 'The journey was dangerous; nevertheless, they continued.'" },
            { w: "MALGRÉ TOUT", lang: "FR", c: "Fransızca 'Her şeye rağmen / Ne olursa olsun' deyimi. | Örnek: 'Malgré tout, elle a gardé le sourire et l'espoir.'" },
            { w: "KONSENSUS", lang: "DE", c: "Almanca fikir birliği, uzlaşı. | Örnek: 'Die Parteien haben endlich einen Konsensus erreicht.'" },
            { w: "EPISTEMOLOGY", lang: "EN", c: "Bilgi felsefesi, epistemoloji. | Örnek: 'Linguistics shares roots with cognitive epistemology.'" }
        ]
    };

    let gSize = 14;
    let activeDataset = [];
    let gridData = [];
    let inputsRef = {};

    function initPolyglotEngine() {
        document.getElementById('analysisPanel').style.display = 'none';
        document.getElementById('mainWorkspace').style.display = 'grid';
        
        const lvl = document.getElementById('levelSelect').value;
        const pool = INTEL_DATABASE[lvl];

        if (!pool || pool.length < 4) {
            alert("Hata: Havuzda yeterli kelime bulunamadı.");
            return;
        }

        // 1. ADIM: Havuzdan HER SEFERİNDE tamamen rastgele 4 kelime seç
        let shuffled = [...pool].sort(() => 0.5 - Math.random());
        activeDataset = shuffled.slice(0, 4);

        // Dinamik yönlendirme şeması (2 Yatay, 2 Dikey)
        activeDataset[0].dir = "across";
        activeDataset[1].dir = "down";
        activeDataset[2].dir = "across";
        activeDataset[3].dir = "down";

        gridData = Array(gSize).fill(null).map(() => Array(gSize).fill(null));
        inputsRef = {};

        // 2. ADIM: Kelimeleri Matriste Güvenli Kesişim Bölgelerine Yerleştirme
        // Kelime 1
        let w1 = activeDataset[0];
        let cleanW1 = w1.w.replace(/\s/g, "");
        w1.proc = cleanW1;
        let r1 = 5, c1 = 1;
        for(let i=0; i<cleanW1.length; i++) {
            gridData[r1][c1+i] = { letter: cleanW1[i], num: i===0 ? 1 : null };
        }
        w1.num = 1;

        // Kelime 2 (İlk kelime ile dikey kilitlenme)
        let w2 = activeDataset[1];
        let cleanW2 = w2.w.replace(/\s/g, "");
        w2.proc = cleanW2;
        let r2 = 2, c2 = Math.min(gSize - 1, c1 + 4);
        for(let i=0; i<cleanW2.length; i++) {
            if(r2+i < gSize) {
                if(!gridData[r2+i][c2]) gridData[r2+i][c2] = { letter: cleanW2[i], num: i===0 ? 2 : null };
                else if(i===0) gridData[r2+i][c2].num = 2;
            }
        }
        w2.num = 2;

        // Kelime 3 (Alt kulvarda yatay kilitlenme)
        let w3 = activeDataset[2];
        let cleanW3 = w3.w.replace(/\s/g, "");
        w3.proc = cleanW3;
        let r3 = Math.min(gSize - 1, r2 + 4), c3 = Math.max(0, c2 - 2);
        for(let i=0; i<cleanW3.length; i++) {
            if(c3+i < gSize) {
                if(!gridData[r3][c3+i]) gridData[r3][c3+i] = { letter: cleanW3[i], num: i===0 ? 3 : null };
                else if(i===0) gridData[r3][c3+i].num = 3;
            }
        }
        w3.num = 3;

        // Kelime 4 (Son dikey emniyet şeridi)
        let w4 = activeDataset[3];
        let cleanW4 = w4.w.replace(/\s/g, "");
        w4.proc = cleanW4;
        let r4 = Math.max(0, r3 - 2), c4 = Math.min(gSize - 1, c3 + 3);
        for(let i=0; i<cleanW4.length; i++) {
            if(r4+i < gSize) {
                if(!gridData[r4+i][c4]) gridData[r4+i][c4] = { letter: cleanW4[i], num: i===0 ? 4 : null };
                else if(i===0) gridData[r4+i][c4].num = 4;
            }
        }
        w4.num = 4;

        renderGrid();
        renderClues();
    }

    function renderGrid() {
        const gridEl = document.getElementById('lexicalGrid');
        gridEl.innerHTML = '';
        gridEl.style.gridTemplateColumns = `repeat(${gSize}, var(--cell-size))`;

        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                const node = gridData[r][c];
                const cellDiv = document.createElement('div');

                if(node) {
                    cellDiv.className = 'cell';
                    if(node.num) {
                        const numSpan = document.createElement('span');
                        numSpan.className = 'cell-num';
                        numSpan.innerText = node.num;
                        cellDiv.appendChild(numSpan);
                    }
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.setAttribute('autocomplete', 'off');
                    input.addEventListener('input', (e) => {
                        e.target.value = e.target.value.toUpperCase();
                        checkMatrixStatus();
                    });
                    inputsRef[`${r}-${c}`] = input;
                    cellDiv.appendChild(input);
                } else {
                    cellDiv.className = 'cell empty';
                }
                gridEl.appendChild(cellDiv);
            }
        }
    }

    function renderClues() {
        const acrossUl = document.getElementById('acrossClues');
        const downUl = document.getElementById('downClues');
        acrossUl.innerHTML = '';
        downUl.innerHTML = '';

        activeDataset.forEach(item => {
            const li = document.createElement('li');
            li.className = 'clue-item';
            li.innerHTML = `<strong>${item.num} [${item.lang}]</strong> ${item.c.split('|')[0]}`;
            
            if(item.dir === "across") acrossUl.appendChild(li);
            else downUl.appendChild(li);
        });
    }

    function checkMatrixStatus() {
        let allCorrect = true;
        let filledCount = 0;

        for(let r=0; r<gSize; r++) {
            for(let c=0; c<gSize; c++) {
                if(gridData[r][c]) {
                    filledCount++;
                    const userVal = inputsRef[`${r}-${c}`].value.trim().toUpperCase();
                    if(userVal !== gridData[r][c].letter.toUpperCase()) {
                        allCorrect = false;
                    }
                }
            }
        }

        if(allCorrect && filledCount > 0) {
            showAnalysisPanel();
        }
    }

    function showAnalysisPanel() {
        const rowsEl = document.getElementById('analysisRows');
        rowsEl.innerHTML = '';

        activeDataset.forEach(item => {
            const tr = document.createElement('tr');
            const exampleSentence = item.c.split('|')[1] || "Örnek cümle yüklenemedi.";

            tr.innerHTML = `
                <td style="font-weight:bold; color:var(--accent-blue);">${item.w}</td>
                <td>${item.lang}</td>
                <td>${exampleSentence}</td>
            `;
            rowsEl.appendChild(tr);
        });

        document.getElementById('analysisPanel').style.display = 'block';
        document.getElementById('analysisPanel').scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
